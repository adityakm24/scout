# SpaceshipResearch-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: gmail
description: 'Gmail: search and read mail, draft replies, manage labels.'
source: https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server

# Google's official remote MCP (URL-only, Developer Preview). Verified live: RFC 9728
# protected-resource metadata at /.well-known/oauth-protected-resource/mcp/v1 names
# accounts.google.com, which has no Dynamic Client Registration — so the user brings an OAuth
# client from their own Google Cloud project. A "Desktop app" client accepts any loopback
# redirect, which is why the port can be pinned here. Drafts only: the server cannot send.

transport:
  type: http
  url: https://gmailmcp.googleapis.com/mcp/v1

auth:
  type: oauth
  env:
    - name: GMAIL_MCP_CLIENT_ID
      prompt: Google OAuth client ID (Desktop app client from your Google Cloud project)
      secret: false
    - name: GMAIL_MCP_CLIENT_SECRET
      prompt: Google OAuth client secret
  oauth:
    client_id: ${GMAIL_MCP_CLIENT_ID}
    client_secret: ${GMAIL_MCP_CLIENT_SECRET}
    redirect_host: 127.0.0.1
    redirect_port: 27896
    scope: https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - gmail
    - inbox
    - email
  hosts:
    - mail.google.com

post_install: |
  Gmail's MCP server is in Google's Developer Preview. Before connecting:
    1. Join the Google Workspace Developer Preview Program with this Google account.
    2. In a Google Cloud project, enable the Gmail API and the Gmail MCP API.
    3. Set up the OAuth consent screen with the gmail.readonly and gmail.compose scopes,
       and add yourself as a test user.
    4. Create an OAuth client of type "Desktop app"; use its client ID and secret here.
  Then sign in from Capabilities -> Connectors (or `scout mcp login gmail`). The sign-in
  returns to http://127.0.0.1:27896/callback, so the browser must run on this machine.

  The server can search and read mail, create drafts and manage labels. It cannot send:
  drafts wait in Gmail for you to send.
