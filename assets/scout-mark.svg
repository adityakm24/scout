  <path id="eye-right" fill="#150e25" d="M 656 364 A 66 66 0 1 1 656 496 A 66 66 0 1 1 656 364 Z" />
  <path id="glint-left" fill="#ece9f3" d="M 349 384 A 21 21 0 1 1 349 426 A 21 21 0 1 1 349 384 Z" />
  <path id="glint-right" fill="#ece9f3" d="M 637 384 A 21 21 0 1 1 637 426 A 21 21 0 1 1 637 384 Z" />
</svg>
