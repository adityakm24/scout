<!doctype html>
<!--
  Quiet shim page for the desktop update hand-off (Windows + POSIX).

  Served over loopback by the orchestrator (windows.ps1 / posix.sh) into a
  chromeless browser app window. Pure veneer: polls /progress for the current
  hand-off stage or a terminal event and reacts; owns nothing (relaunch,
  result file, marker hygiene all live in the orchestrator, which runs
  identically with no UI at all).

  - Loader: Scout's loading mark (the face tile, eyes looking around and
    blinking), the same as apps/desktop/src/components/ui/loader.tsx; its
    keyframes mirror apps/desktop/src/motion.css.
  - Layout: loader (size-20) + one title + one muted stage/elapsed line. No
    progress bar, stage list, log pane, or cancel (see #75895 for the
    arguments). Elapsed comes from the orchestrator or is omitted -- a clock
    started here would measure when this window painted, not the update.
  - Appearance follows the OS. Dark seeds are the installer's neutral
    charcoal (#232323 base, foreground #d6d6d6) — never brand blue.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scout</title>
<style>
  :root {
    --background: #ffffff;
    --foreground: #1a1a1a;
    --muted-foreground: #737373;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #232323;
      --foreground: #d6d6d6;
      --muted-foreground: #8a8a8a;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--background);
    color: var(--foreground);
    font-family: system-ui, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
    overflow: hidden;
  }
  /* UpdateScreen: flex h-full flex-col items-center justify-center gap-4
     px-6 text-center (routes/progress.tsx) */
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 24px;
    box-sizing: border-box;
    text-align: center;
  }
  @keyframes scout-fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .wrap { animation: scout-fade-in 0.45s ease-out both; }
  /* Loader size-20 (5rem); svg overflow-visible; curve path opacity .1 */
  #loader { width: 80px; height: 80px; color: var(--foreground); }
  #loader svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes scout-loader-look {
    0%, 12% { transform: translateX(0) scaleY(1); }
    22%, 36% { transform: translateX(-3.5px) scaleY(1); }
    46%, 60% { transform: translateX(3.5px) scaleY(1); }
    68% { transform: translateX(0) scaleY(1); }
    72% { transform: translateX(0) scaleY(0.12); }
    76%, 100% { transform: translateX(0) scaleY(1); }
  }
  @keyframes scout-loader-breathe {
    0%, 100% { transform: scale(1); opacity: 0.92; }
    50% { transform: scale(0.94); opacity: 1; }
  }
  .scout-loader-eyes, .scout-loader-face { transform-box: fill-box; transform-origin: center; }
  .scout-loader-eyes { animation: scout-loader-look 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
  .scout-loader-face { animation: scout-loader-breathe 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .scout-loader-eyes, .scout-loader-face { animation: none; }
  }
  #glyph {
    width: 80px;
    height: 80px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    line-height: 1;
  }
  /* text-lg font-semibold tracking-tight */
  h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.025em;
  }
  /* text-xs text-muted-foreground */
  p {
    margin: 0;
    max-width: 80%;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted-foreground);
    white-space: pre-line;
  }
  p code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 11px;
    color: var(--foreground);
  }
  body.done #loader, body.error #loader, body.disconnected #loader { display: none; }
  body.done #glyph, body.error #glyph, body.disconnected #glyph { display: flex; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="loader" role="status" aria-label="Updating">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <mask id="scout-loader-mask">
          <rect fill="white" width="48" height="48"/>
          <g class="scout-loader-eyes">
            <rect fill="black" x="15" y="18" width="6" height="11" rx="3"/>
            <rect fill="black" x="27" y="18" width="6" height="11" rx="3"/>
          </g>
        </mask>
        <rect class="scout-loader-face" fill="currentColor" x="4" y="4" width="40" height="40" rx="12" mask="url(#scout-loader-mask)"/>
      </svg>
    </div>
    <div id="glyph"></div>
    <h2 id="title">Updating Scout</h2>
    <p id="line">Scout will open once done.</p>
  </div>
<script>
  /* ── Event listener: running stage or terminal outcome ───────────────── */
  const titleEl = document.getElementById('title')
  const lineEl = document.getElementById('line')
  const glyphEl = document.getElementById('glyph')
  const defaultLine = lineEl.textContent   /* what a stage-less run says */
  let settled = false
  let failures = 0

  const elapsedText = s =>
    s < 60 ? `${s}s elapsed` : `${Math.floor(s / 60)}m ${s % 60}s elapsed`

  function settle(state) {
    settled = true
    document.body.className = state
  }

  function apply(state) {
    if (settled) return
    if (state.status === 'running') {
      const stage = state.message || defaultLine
      const elapsed = Number(state.elapsed_seconds)
      lineEl.textContent = Number.isFinite(elapsed) && elapsed >= 0
        ? `${stage}\n${elapsedText(Math.floor(elapsed))}`
        : stage
    } else if (state.status === 'done') {
      settle('done')
      glyphEl.textContent = '\u2713'
      titleEl.textContent = 'Update complete'
      lineEl.textContent = 'Opening Scout\u2026\nYou can close this window.'
    } else if (state.status === 'manual') {
      // Update landed but Scout will NOT reopen itself (package skew,
      // sandbox helper, launch rejected). The orchestrator leaves this
      // window up; the message says what to do.
      settle('done')
      glyphEl.textContent = '\u2713'
      titleEl.textContent = 'Update complete'
      lineEl.textContent = state.message || 'Reopen Scout to finish.'
    } else if (state.status === 'error') {
      settle('error')
      glyphEl.textContent = '\u2715'
      titleEl.textContent = 'Failed to update'
      lineEl.innerHTML = 'Run <code>scout debug share</code> in a terminal to send a report.'
    }
  }

  async function request(url, options = {}) {
    const controller = new AbortController()
    const timeout = setTimeout(() => controller.abort(), 5000)
    try {
      const response = await fetch(url, { ...options, cache: 'no-store', signal: controller.signal })
      if (!response.ok) throw new Error('Progress request failed')
      // Keep the deadline active while reading the body too: receiving
      // headers alone does not prove that the progress server is responsive.
      return options.method === 'POST' ? null : await response.json()
    } finally {
      clearTimeout(timeout)
    }
  }

  async function poll() {
    try {
      const state = await request('/progress')
      if (!state || !['running', 'done', 'manual', 'error'].includes(state.status)) {
        throw new Error('Invalid progress response')
      }
      failures = 0
      apply(state)
      // The Windows server can now wait for delivery instead of guessing
      // that one polling interval was enough. Older/POSIX servers omit this
      // receipt. Apply first so a failed acknowledgement cannot hide a result.
      if (settled && typeof state.receipt === 'string' && state.receipt) {
        await request(`/ack/${encodeURIComponent(state.receipt)}`, { method: 'POST' })
      }
    } catch {
      if (!settled && ++failures >= 3) {
        // A vanished server is not evidence of success OR failure. Leave an
        // honest, finite state even if the browser refuses the close request.
        settle('disconnected')
        glyphEl.textContent = '!'
        titleEl.textContent = 'Update status unavailable'
        lineEl.textContent = 'The progress connection was lost.\nCheck Scout for the update result. You can close this window.'
      }
    }
    if (!settled) setTimeout(poll, 400)
  }
  poll()
</script>
</body>
</html>
