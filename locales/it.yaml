      up: "su"
      down: "giù"
      left: "sinistra"
      right: "destra"
    fallback_tool_name: "strumento"
    fallback_done: "fatto"
    completed: "┊ ⚡ {tool} completato  {duration}"
  iteration_progress:
    unbounded: "iterazione {n}"
    bounded: "iterazione {n}/{max}"
  review:
    routing_fallback_warning: "⚠ auxiliary.background_review.provider='{task_provider}' (modello '{task_model}') non instradabile ({error}); fallback su {provider}/{model}"
    reasoning_effort_warning: "⚠ auxiliary.background_review.reasoning_effort='{effort}' non ha effetto finché il modello di revisione non è quello principale"
    memory_op_line: "{label} {glyph} {preview}"
    skill_patched_verbose: "📝 Skill '{name}' corretta: \"{old}\" → \"{new}\""
    skill_changed_verbose: "📝 Skill '{name}' {verb}: {description}"
    skill_message_verbose: "📝 {message}"
    skill_action: "Skill: {action}"
    label_updated: "{label} aggiornato"
    skill_result: "Skill '{name}' {verb}{path}"
    skill_verb:
      created: "creata"
      rewritten: "riscritta"
      patched: "corretta"
      written: "scritta"
      removed: "rimossa"
      deleted: "eliminata"
    label:
      skill: "Skill"
      memory: "Memoria"
      user: "Profilo utente"
    summary_cli: "  💾 Revisione di auto-miglioramento: {summary}"
    summary_callback: "💾 Revisione di auto-miglioramento: {summary}"
    aux_failure_label: "revisione in background"
  notice:
    uncompressed_context_overflow: "⚠️ Il contesto della sessione (~{tokens} token) supera la finestra di contesto del modello (~{context_length} token) con la compressione disattivata (compression.enabled: false). Usa /compact per comprimere la cronologia o attiva la compressione in config.yaml."
explainer:
  no_reply_prefix: "⚠️ Nessuna risposta: "
  empty_response: "{model} non ha prodotto una risposta questa volta, nemmeno dopo i tentativi ripetuti. Invia `continue` per riprovare, oppure cambia modello con /model."
  exit:
    all_retries_exhausted_no_response: "il provider del modello non ha risposto dopo tutti i tentativi. Invia /retry, oppure cambia modello con /model."
    partial_stream_recovery: "lo streaming si è interrotto in anticipo ed è stata recuperata solo una risposta parziale. Invia `continue` per riprendere dal punto in cui si è fermato."
    fallback_prior_turn_content: "in questo turno non è stato prodotto nuovo contenuto; viene mostrato il contesto precedente recuperato. Invia `continue` per riprovare."
    redirect_restart_limit_exceeded: "la richiesta è stata annullata da una nuova correzione a ogni tentativo, quindi il turno si è fermato invece di riprovare all'infinito. La tua ultima correzione è in coda come prossimo messaggio."
    rebuilt_restart_limit_exceeded: "ogni provider della catena di fallback ha continuato a cedere il passo al successivo, quindi il turno si è fermato invece di riprovare all'infinito. Invia `continue` oppure cambia provider."
    budget_exhausted: "il budget di iterazioni/costo per turno si è esaurito prima di una risposta finale. Invia `continue` per proseguire."
    ollama_runtime_context_too_small: "la finestra di contesto del modello locale era troppo piccola per finire. Aumenta la dimensione del contesto o usa un modello più grande."
    pending_tool_result: "il turno si è fermato mentre il risultato di uno strumento era ancora in attesa e il modello non ha prodotto altro testo. Invia `continue` per farglielo riassumere."
    interrupted_during_api_call: "la richiesta è stata interrotta a metà chiamata prima di ricevere una risposta. Invia `continue` per riprovare."
    max_iterations_reached: "è stato raggiunto il limite massimo di iterazioni degli strumenti prima di una risposta finale. Invia `continue` per proseguire, oppure aumenta `max_iterations`."
    error_near_max_iterations: "si è verificato un errore vicino al limite di iterazioni prima di una risposta finale. Controlla l'output dello strumento qui sopra, poi invia `continue`."
    repeated_outer_errors: "il turno ha continuato a fallire con errori ripetuti ed è stato fermato in anticipo invece di riprovare all'infinito. Controlla gli errori qui sopra, poi invia `continue` per riprovare."
  persistence:
    compression: "il turno è stato fermato perché un altro processo stava comprimendo questa sessione. Il tuo messaggio dovrebbe essere già salvato — invialo di nuovo al termine della compressione."
    compression_closed: "il turno è stato fermato perché questa sessione è stata ruotata dalla compressione del contesto e la sua continuazione attiva non ha potuto essere adottata. Lo storage è integro — aggiorna il client (o avvia un nuovo turno) così da usare il nuovo id di sessione, poi invia di nuovo il messaggio."
    turn_lease: "il turno è stato fermato perché un altro processo Scout ha preso il controllo di questa sessione. La tua risposta non è stata salvata — attendi che l'altro processo finisca, poi invia di nuovo il messaggio."
    session_row_missing: "questa sessione è stata eliminata dallo storage mentre la chat era ancora aperta e Scout non è riuscito a ricrearla, quindi questo messaggio non è stato salvato. Invia di nuovo il messaggio; se continua a fallire, esegui `scout {profile_arg}doctor`."
    locked: "il turno è stato fermato perché lo storage della sessione era occupato (un altro processo Scout stava scrivendo nel database di stato). Il tuo messaggio dovrebbe essere già salvato — invialo di nuovo tra un momento."
    replaced: "il file del database delle sessioni è stato sostituito mentre Scout era in esecuzione, quindi questo messaggio non è stato salvato (una copia è conservata in {home}/sessions/). Ferma Scout (`scout {profile_arg}gateway stop`), esegui `scout {profile_arg}doctor` — non `scout {profile_arg}doctor --fix`, che riparerebbe il file sbagliato sul posto — poi riavvialo e invia di nuovo il messaggio. I passaggi di recupero avanzati sono nel log."
    deleted_wal: "un altro processo Scout tiene ancora una vecchia copia del write-ahead log del database delle sessioni, quindi Scout ha smesso di scrivere per proteggere il file e questo messaggio non è stato salvato (una copia è conservata in {home}/sessions/). Non è andato perso nulla. Chiudi ogni processo Scout su questo profilo (app Desktop, `scout {profile_arg}gateway stop`, dashboard, cron), esegui `scout {profile_arg}doctor` — indica quale processo tiene ancora il log — poi riavvia Scout e invia di nuovo il messaggio. Non eseguire `doctor --fix` né eliminare file state.db mentre sono in esecuzione. Guida: {recovery_docs}"
    corrupt: "il turno è stato fermato perché il database di stato ha segnalato una corruzione strutturale (la trascrizione sarebbe andata perduta al riavvio). Liberare spazio su disco non servirà. Opzioni di recupero:\n1. Esegui `scout {profile_arg}doctor --fix`\n2. Ferma il gateway, poi recupera con:\n   scout {profile_arg}sessions recover --source {db_path} --inspect-only\n   (se segnala che è recuperabile) scout {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — il recupero crea prima uno snapshot del file danneggiato; NON eseguire `sqlite3 ... \".recover\"` sullo state.db attivo, una CLI sqlite3 vulnerabile può corromperlo ulteriormente\n3. Ripristina da un backup in {backups_dir}/\nPoi invia di nuovo il messaggio."
    fts_index: "il turno è stato fermato perché l'indice di ricerca delle sessioni (FTS5) è corrotto e non ha potuto essere scollegato, quindi questo messaggio non è stato salvato. L'archivio dei messaggi non è danneggiato: non eseguire strumenti di recupero né ripristinare un backup. Esegui `scout {profile_arg}doctor --fix` (o riavvia Scout, che ripara l'indice all'apertura), poi invia di nuovo il messaggio."
    disk: "Scout non è riuscito a salvare questa conversazione su disco, quindi si è fermato piuttosto che perdere i tuoi messaggi. Il disco è probabilmente pieno: libera spazio (o correggi i permessi su {home}/state.db), poi invia di nuovo il messaggio."
    default: "Scout non è riuscito a salvare questa conversazione, quindi si è fermato piuttosto che perdere i tuoi messaggi. Cause possibili: il disco è pieno, oppure un altro processo Scout sta tenendo occupato il database. Chiudi le altre finestre di Scout, esegui `scout {profile_arg}doctor` per controllare lo storage, poi invia di nuovo il messaggio."
  file_mutation:
    header: "⚠️ Verifica modifiche ai file: {count} modifiche FALLITE in questo turno, nonostante quanto il testo sopra possa far pensare. Esegui `git status` o `read_file` per confermare cosa è stato davvero applicato."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "non riuscito"
  shared:
    and_more: "  • … e altri {count}"
    the_model: "Il modello"
tips:
  t001: "/bg <prompt> esegue un'attività in una sessione separata mentre quella corrente resta libera; /btw <question> risponde a una domanda a margine su questa conversazione senza interromperla."
  t002: "/branch crea una diramazione della sessione corrente, così puoi esplorare una direzione diversa senza perdere i progressi."
  t003: "/compress comprime manualmente il contesto della conversazione quando diventa troppo lungo."
  t004: "/rollback elenca i checkpoint del filesystem: ripristina i file modificati dall'agente a qualsiasi stato precedente."
  t005: "/rollback diff 2 mostra in anteprima cosa è cambiato dal checkpoint 2 senza ripristinare nulla."
  t006: "/rollback 2 src/file.py ripristina un singolo file da un checkpoint specifico."
  t007: "/title \"mio progetto\" dà un nome alla sessione: riprendila più tardi con /resume o scout -c."
  t008: "/resume riprende da dove avevi lasciato in una sessione a cui hai dato un nome in precedenza."
  t009: "/queue <prompt> mette in coda un messaggio per il turno successivo senza interrompere quello corrente."
  t010: "/undo rimuove dalla conversazione l'ultimo scambio utente/assistente."
  t011: "/retry reinvia il tuo ultimo messaggio: utile quando la risposta dell'agente non era proprio quella giusta."
  t012: "/verbose alterna la visualizzazione dell'avanzamento degli strumenti: off → new → all → verbose."
  t013: "/reasoning high aumenta la profondità di ragionamento del modello. /reasoning show mostra il ragionamento."
  t014: "/fast attiva o disattiva l'elaborazione prioritaria per risposte API più rapide (dipende dal provider)."
  t015: "/yolo salta tutte le richieste di approvazione per comandi pericolosi per il resto della sessione."
  t016: "/model ti permette di cambiare modello a metà sessione: prova /model sonnet o /model gpt-5."
  t017: "/model --global cambia in modo permanente il tuo modello predefinito."
  t018: "/personality pirate imposta una personalità divertente: 14 opzioni integrate, da kawaii a shakespeare."
  t019: "/tools disable browser rimuove temporaneamente gli strumenti browser per la sessione corrente."
  t020: "/browser connect collega gli strumenti browser al tuo browser della famiglia Chromium già in esecuzione tramite CDP."
  t021: "/plugins elenca i plugin installati e il loro stato."
  t022: "/reload-mcp ricarica a caldo la configurazione dei server MCP senza riavviare."
  t023: "/usage mostra l'utilizzo dei token, la ripartizione dei costi e la durata della sessione."
  t024: "/insights mostra le statistiche di utilizzo degli ultimi 30 giorni."
  t025: "/paste controlla se negli appunti c'è un'immagine e la allega al tuo prossimo messaggio."
  t026: "/profile mostra quale profilo è attivo e la sua directory home."
  t027: "/config mostra a colpo d'occhio la tua configurazione corrente."
  t028: "/stop termina tutti i processi in background avviati dall'agente."
  t029: "@file:path/to/file.py inserisce il contenuto del file direttamente nel tuo messaggio."
  t030: "@file:main.py:10-50 inserisce solo le righe 10-50 di un file."
  t031: "@folder:src/ inserisce l'elenco ad albero di una directory."
  t032: "@diff inserisce nel messaggio le tue modifiche git non ancora in stage."
  t033: "@staged inserisce le tue modifiche git in stage (git diff --staged)."
  t034: "@git:5 inserisce gli ultimi 5 commit con le patch complete."
  t035: "@url:https://example.com scarica e inserisce il contenuto di una pagina web."
  t036: "Digitando @ si attiva il completamento dei percorsi del filesystem: raggiungi qualsiasi file in modo interattivo."
  t037: "Combina più riferimenti: \"Rivedi @file:main.py e @file:test.py per verificarne la coerenza.\""
  t038: "Digita un nuovo messaggio mentre l'agente sta lavorando per interromperlo e reindirizzarlo."
  t039: "Incollando 5 o più righe, il testo viene salvato automaticamente in un file e al suo posto viene inserito un riferimento compatto."
  t040: "scout -c riprende la tua sessione CLI più recente. scout -c \"nome progetto\" riprende in base al titolo."
  t041: "scout -w crea un worktree git isolato: perfetto per flussi di lavoro con agenti in parallelo."
  t042: "scout -p work chat esegue Scout con un profilo specifico senza cambiare quello predefinito."
  t043: "scout doctor --fix diagnostica e ripara automaticamente i problemi di configurazione e dipendenze."
  t044: "scout dump produce un riepilogo compatto della tua installazione: ottimo per le segnalazioni di bug."
  t045: "scout config set KEY VALUE indirizza automaticamente i segreti in .env e tutto il resto in config.yaml."
  t046: "scout config edit apre config.yaml nel tuo editor predefinito."
  t047: "scout config check cerca opzioni di configurazione mancanti o obsolete."
  t048: "scout sessions browse apre un selettore interattivo di sessioni con ricerca."
  t049: "scout sessions stats mostra il numero di sessioni per piattaforma e la dimensione del database."
  t050: "scout sessions prune --older-than 30 elimina le sessioni vecchie."
  t051: "scout skills search react --source skills-sh cerca nella directory pubblica skills.sh."
  t052: "scout skills check controlla se le skill installate dall'hub hanno aggiornamenti upstream."
  t053: "scout skills tap add myorg/skills-repo aggiunge una sorgente GitHub personalizzata per le skill."
  t054: "scout skills snapshot export setup.json esporta la configurazione delle tue skill per backup o condivisione."
  t055: "scout mcp add github --command npx aggiunge server MCP dalla riga di comando."
  t056: "scout mcp serve esegue Scout stesso come server MCP per altri agenti."
  t057: "scout auth add ti permette di aggiungere più chiavi API per la rotazione del pool di credenziali."
  t058: "scout logs -f segue agent.log in tempo reale. --level WARNING --since 1h filtra l'output."
  t059: "scout backup crea un backup zip dell'intera directory home di Scout."
  t060: "scout profile create coder crea un profilo isolato che diventa un comando a sé stante."
  t061: "scout profile create work --clone copia la configurazione e le chiavi correnti in un nuovo profilo."
  t062: "scout update sincronizza automaticamente le nuove skill integrate su TUTTI i profili."
  t063: "scout gateway install configura Scout come servizio di sistema (systemd/launchd)."
  t064: "scout memory setup ti permette di configurare un provider di memoria esterno (Honcho, Mem0, ecc.)."
  t065: "scout webhook subscribe crea route webhook basate su eventi con validazione HMAC."
  t066: "Risparmia: scout tools disattiva gli strumenti inutilizzati, scout skills config riduce le skill all'essenziale."
  t067: "/reasoning low o /reasoning minimal riduce la profondità di ragionamento sotto il valore predefinito (medium): risposte più rapide ed economiche."
  t068: "scout models instrada visione, compressione e attività ausiliarie verso modelli più economici: taglia il costo dei token in background dell'85% o più senza declassare il tuo modello di chat principale."
  t069: "Imposta display.bell_on_complete: true in config.yaml per sentire un segnale acustico quando le attività lunghe terminano."
  t070: "Imposta display.streaming: true per vedere i token comparire in tempo reale mentre il modello li genera."
  t071: "Imposta display.show_reasoning: true per osservare la catena di ragionamento del modello."
  t072: "Imposta display.compact: true per ridurre gli spazi vuoti nell'output e avere informazioni più dense."
  t073: "Imposta display.busy_input_mode: queue per mettere in coda i messaggi invece di interrompere l'agente, oppure steer per iniettarli durante l'esecuzione tramite /steer."
  t074: "Imposta display.resume_display: minimal per saltare il riepilogo completo della conversazione alla ripresa della sessione."
  t075: "Imposta compression.threshold: 0.50 per controllare quando scatta la compressione automatica (predefinito: 50% del contesto)."
  t076: "Imposta agent.max_turns: 1000 per consentire all'agente più passaggi di chiamata agli strumenti per turno."
  t077: "Imposta file_read_max_chars: 200000 per aumentare il contenuto massimo per ogni chiamata a read_file."
  t078: "Imposta approvals.mode: smart per lasciare che un LLM approvi automaticamente i comandi sicuri e neghi quelli pericolosi."
  t079: "Imposta fallback_model in config.yaml per passare automaticamente a un provider di riserva in caso di errore."
  t080: "Imposta privacy.redact_pii: true per trasformare in hash ID utente e numeri di telefono prima di inviarli all'LLM."
  t081: "Imposta browser.record_sessions: true per registrare automaticamente le sessioni del browser come video WebM."
  t082: "Imposta worktree: true in config.yaml per creare sempre un worktree git (equivale a scout -w)."
  t083: "Imposta security.website_blocklist.enabled: true per bloccare domini specifici negli strumenti web."
  t084: "Imposta cron.wrap_response: false per consegnare l'output grezzo dell'agente senza intestazione e piè di pagina del cron."
  t085: "SCOUT_TIMEZONE sostituisce il fuso orario del server con qualsiasi stringa di fuso orario IANA."
  t086: "La sostituzione delle variabili d'ambiente funziona in config.yaml: usa la sintassi ${VAR_NAME}."
  t087: "I comandi rapidi in config.yaml eseguono comandi shell all'istante senza consumare token."
  t088: "Puoi definire personalità personalizzate in config.yaml sotto agent.personalities."
  t089: "provider_routing controlla l'ordinamento, la whitelist e la blacklist dei provider di OpenRouter."
  t090: "execute_code esegue script Python che chiamano gli strumenti di Scout in modo programmatico: i risultati restano fuori dal contesto."
  t091: "delegate_task avvia fino a 10 subagenti concorrenti per impostazione predefinita (delegation.max_concurrent_children) con contesti isolati per il lavoro in parallelo."
  t092: "web_extract funziona anche con URL di PDF: passagli qualsiasi link a un PDF e lo converte in markdown."
  t093: "search_files si basa su ripgrep ed è più veloce di grep: usalo al posto di grep nel terminale."
  t094: "patch usa 9 strategie di corrispondenza fuzzy, così piccole differenze di spaziatura non rompono le modifiche."
  t095: "patch supporta il formato V4A per modifiche in blocco su più file in una singola chiamata."
  t096: "read_file suggerisce nomi di file simili quando un file non viene trovato."
  t097: "read_file deduplica automaticamente: rileggere un file invariato restituisce solo un breve segnaposto."
  t098: "browser_vision acquisisce uno screenshot e lo analizza con l'AI: funziona con CAPTCHA e contenuti visivi."
  t099: "browser_console può valutare espressioni JavaScript nel contesto della pagina."
  t100: "image_generate crea immagini con FLUX 2 Pro e upscaling automatico 2x."
  t101: "Lo strumento todo aiuta l'agente a tenere traccia di attività complesse in più passaggi durante una sessione."
  t102: "session_search esegue una ricerca full-text in TUTTE le conversazioni passate."
  t103: "L'agente salva automaticamente in memoria preferenze, correzioni e informazioni sull'ambiente."
  t104: "/moa instrada un singolo prompt difficile attraverso il set di modelli Mixture of Agents che hai configurato."
  t105: "I comandi del terminale supportano la modalità in background con notify_on_complete per le attività di lunga durata."
  t106: "I processi in background del terminale supportano watch_patterns per avvisarti su righe di output specifiche."
  t107: "Lo strumento terminal supporta 6 backend: local, Docker, SSH, Modal, Daytona e Singularity."
  t108: "Ogni profilo ha la propria configurazione, chiavi API, memoria, sessioni, skill e job cron."
  t109: "I nomi dei profili diventano comandi shell: 'scout profile create coder' crea il comando 'coder'."
  t110: "scout profile export coder -o backup.tar.gz crea un archivio portabile del profilo."
  t111: "Le sessioni generano automaticamente titoli descrittivi dopo il primo scambio: non serve assegnare nomi a mano."
  t112: "I titoli delle sessioni supportano la discendenza: \"mio progetto\" → \"mio progetto #2\" → \"mio progetto #3\"."
  t113: "All'uscita, Scout stampa un comando per riprendere con l'ID della sessione e le statistiche."
  t114: "scout sessions export backup.jsonl esporta tutte le sessioni per backup o analisi."
  t115: "scout -r SESSION_ID riprende una specifica sessione passata tramite il suo ID."
  t116: "La memoria è uno snapshot congelato: le modifiche compaiono nel prompt di sistema solo all'avvio della sessione successiva."
  t117: "Le voci di memoria vengono controllate automaticamente alla ricerca di pattern di prompt injection ed esfiltrazione."
  t118: "L'agente ha due archivi di memoria: note personali (~2200 caratteri) e profilo utente (~1375 caratteri)."
  t119: "Le correzioni che dai all'agente (\"no, fallo così\") vengono spesso salvate automaticamente in memoria."
  t120: "Oltre 80 skill integrate che coprono github, creatività, mlops, produttività, ricerca e altro ancora."
  t121: "Ogni skill installata diventa automaticamente un comando slash: digita / per vederle tutte."
  t122: "scout skills install official/security/1password installa skill opzionali dal repository."
  t123: "Le skill possono limitarsi a sistemi operativi specifici: alcune si caricano solo su macOS o Linux."
  t124: "skills.external_dirs in config.yaml ti permette di caricare skill da directory personalizzate."
  t125: "L'agente può creare le proprie skill come memoria procedurale usando skill_manage."
  t126: "/plan scrive un piano di implementazione in markdown in .scout/plans/ senza eseguire nulla."
  t127: "I job cron possono includere skill: scout cron add --skill blogwatcher \"Check for new posts\"."
  t128: "Se una risposta del cron inizia con [SILENT], la consegna viene soppressa: utile per i job di solo monitoraggio."
  t129: "Il cron supporta ritardi relativi (30m), intervalli (every 2h), espressioni cron e timestamp ISO."
  t130: "I job cron vengono eseguiti in sessioni agente completamente nuove: i prompt devono essere autosufficienti."
  t131: "La modalità voce funziona senza alcuna chiave API se faster-whisper è installato (riconoscimento vocale locale gratuito)."
  t132: "Cinque provider TTS disponibili: Edge TTS (gratuito), ElevenLabs, OpenAI, NeuTTS (locale gratuito), MiniMax."
  t133: "Il TTS in streaming riproduce le frasi man mano che vengono generate: non devi aspettare la risposta completa."
  t134: "scout gateway install lo configura come servizio di sistema che si avvia al boot."
  t135: "Le route webhook supportano validazione HMAC, limitazione della frequenza e filtraggio degli eventi."
  t136: "Il server API espone un endpoint compatibile con OpenAI, utilizzabile con Open WebUI e LibreChat."
  t137: "group_sessions_per_user: true assegna a ogni persona una sessione propria nelle chat di gruppo."
  t138: "Il gateway supporta timeout basati sull'inattività: gli agenti attivi possono lavorare senza limiti di tempo."
  t139: "L'approvazione dei comandi pericolosi ha 4 livelli: una volta, sessione, sempre (allowlist permanente), nega."
  t140: "La modalità di approvazione smart usa un LLM per approvare automaticamente i comandi sicuri e segnalare quelli pericolosi."
  t141: "La protezione SSRF blocca reti private, loopback, link-local e indirizzi dei metadati cloud."
  t142: "La scansione pre-esecuzione di Tirith rileva lo spoofing di URL con omoglifi e i pattern pipe-verso-interprete."
  t143: "I sottoprocessi MCP ricevono un ambiente filtrato: passano solo le variabili di sistema sicure."
  t144: "I file di contesto (.scout.md, AGENTS.md) vengono controllati per prompt injection prima del caricamento."
  t145: "command_allowlist in config.yaml approva in modo permanente pattern specifici di comandi shell."
  t146: "Il contesto viene compresso automaticamente al raggiungimento della soglia: le memorie vengono salvate e la cronologia riassunta."
  t147: "La barra di stato diventa gialla, poi arancione, poi rossa man mano che il contesto si riempie."
  t148: "SOUL.md è il file di identità principale dell'agente: personalizzalo per modellarne il comportamento."
  t149: "Scout carica il contesto del progetto da .scout.md, AGENTS.md, CLAUDE.md o .cursorrules (prima corrispondenza)."
  t150: "I file AGENTS.md nelle sottodirectory vengono scoperti progressivamente man mano che l'agente entra nelle cartelle."
  t151: "I file di contesto sono limitati a 20.000 caratteri con troncamento intelligente di testa e coda."
  t152: "Cinque provider browser: Chromium locale, Browserbase, Browser Use, Camofox e Firecrawl."
  t153: "Camofox è un browser anti-rilevamento: un fork di Firefox con spoofing delle impronte digitali in C++."
  t154: "browser_navigate restituisce automaticamente uno snapshot della pagina: non serve chiamare browser_snapshot subito dopo."
  t155: "browser_vision con annotate=true sovrappone etichette numerate agli elementi interattivi."
  t156: "scout mcp apre un selettore interattivo di MCP approvati da SpaceshipResearch che puoi installare con un solo tasto."
  t157: "scout mcp catalog elenca i server MCP approvati da SpaceshipResearch inclusi nel repository."
  t158: "scout mcp install <name> installa una voce del catalogo, chiede le credenziali e ti lascia scegliere quali dei suoi strumenti abilitare."
  t159: "I server MCP si configurano in config.yaml: sono supportati sia il trasporto stdio sia quello HTTP."
  t160: "Filtro degli strumenti per server: tools.include mette in whitelist e tools.exclude mette in blacklist strumenti specifici."
  t161: "I server MCP generano automaticamente toolset a runtime: scout tools può attivarli o disattivarli per piattaforma."
  t162: "Supporto OAuth per MCP: auth: oauth abilita l'autorizzazione tramite browser con PKCE."
  t163: "I checkpoint non hanno alcun overhead quando nessun file viene modificato — sono attivi per impostazione predefinita."
  t164: "Uno snapshot pre-rollback viene salvato automaticamente, così puoi annullare l'annullamento."
  t165: "/rollback annulla anche il turno di conversazione, quindi l'agente non ricorda le modifiche ripristinate."
  t166: "I checkpoint usano repository shadow in ~/.scout/checkpoints/ — il .git del tuo progetto non viene mai toccato."
  t167: "batch_runner.py elabora centinaia di prompt in parallelo per generare dati di addestramento."
  t168: "Il salvataggio delle traiettorie (--save-trajectories) cattura tracce complete dell'uso degli strumenti per l'addestramento dei modelli."
  t169: "Tre tipi di plugin: generali (strumenti/hook), provider di memoria e motori di contesto."
  t170: "scout plugins install owner/repo installa i plugin direttamente da GitHub."
  t171: "Provider di memoria esterni: Honcho, OpenViking e Mem0 sono inclusi; Hindsight e altri tramite scout plugins install."
  t172: "Gli hook dei plugin includono pre/post_tool_call, pre/post_llm_call e transform_terminal_output per la canonicalizzazione dell'output."
  t173: "Il prompt caching (Anthropic) riduce i costi riutilizzando i prefissi del prompt di sistema in cache."
  t174: "L'agente genera automaticamente i titoli delle sessioni in un thread in background — nessun impatto sulla latenza."
  t175: "Il routing intelligente dei modelli può indirizzare automaticamente le richieste semplici a un modello più economico."
  t176: "I comandi slash supportano la corrispondenza per prefisso: /h corrisponde a /help, /mod a /model."
  t177: "Trascinare il percorso di un file nel terminale allega automaticamente le immagini o lo invia come contesto."
  t178: ".worktreeinclude nella radice del repository elenca i file ignorati da git da copiare nei worktree."
  t179: "scout acp esegue Scout come server ACP per l'integrazione con VS Code, Zed e JetBrains."
  t180: "Provider personalizzati: salva endpoint con nome in config.yaml sotto custom_providers."
  t181: "SCOUT_EPHEMERAL_SYSTEM_PROMPT inietta un prompt di sistema che non viene mai salvato nella cronologia."
  t182: "credential_pool_strategies supporta le rotazioni fill_first, round_robin, least_used e random."
  t183: "scout auth add anthropic oppure scout auth add openai-codex configura i provider basati su OAuth."
  t184: "Il server API supporta sia la Chat Completions API sia la Responses API con stato lato server."
  t185: "tool_preview_length: 0 nella configurazione mostra i percorsi completi dei file nel feed di attività dello spinner."
  t186: "scout status --deep esegue controlli diagnostici più approfonditi su tutti i componenti."
  t187: "I job cron possono allegare uno script Python (--script) il cui stdout viene iniettato nel prompt come contesto."
  t188: "Gli script cron vivono in ~/.scout/scripts/ e vengono eseguiti prima dell'agente — perfetti per pipeline di raccolta dati."
  t189: "prefill_messages_file in config.yaml inietta esempi few-shot in ogni chiamata API, senza mai salvarli nella cronologia."
  t190: "SOUL.md sostituisce completamente l'identità predefinita dell'agente — riscrivilo per rendere Scout davvero tuo."
  t191: "SOUL.md viene inizializzato con una personalità predefinita al primo avvio. Modificalo per personalizzarlo."
  t192: "/compress <focus topic> destina il 60-70% del budget del riepilogo al tuo argomento e taglia con decisione il resto."
  t193: "Dalla seconda compressione in poi, il compressore aggiorna il riepilogo precedente invece di ripartire da zero."
  t194: "Prima di un reset della sessione gateway, Scout salva automaticamente in memoria i fatti importanti, in background."
  t195: "network.force_ipv4: true in config.yaml risolve i blocchi sui server con IPv6 difettoso — applica un monkey-patch a socket."
  t196: "Lo strumento terminal annota i codici di uscita comuni: grep che restituisce 1 = 'Nessuna corrispondenza (non è un errore)'."
  t197: "I comandi terminal in foreground non riusciti vengono ritentati automaticamente fino a 3 volte con backoff esponenziale (2s, 4s, 8s)."
  t198: "I comandi sudo semplici vengono riscritti automaticamente per ricevere SUDO_PASSWORD da .env tramite pipe — nessun prompt interattivo."
  t199: "Gli helper di execute_code richiedono import espliciti: from scout_tools import json_parse, shell_quote, retry."
  t200: "I 7 strumenti sandbox di execute_code (web_search, terminal, read/write/search/patch) usano RPC — non entrano mai nel contesto."
  t201: "Leggere la stessa regione di un file 3 o più volte genera un avviso. Dalla quarta volta viene bloccato per prevenire i loop."
  t202: "write_file e patch rilevano se un file è stato modificato dall'esterno dopo l'ultima lettura e avvisano che è obsoleto."
  t203: "Il formato patch V4A supporta le direttive Add File, Delete File e Move File — non solo Update."
  t204: "I server MCP possono richiedere completamenti LLM tramite sampling — l'agente diventa uno strumento per il server."
  t205: "I server MCP inviano notifications/tools/list_changed per attivare la ri-registrazione automatica degli strumenti senza riavvio."
  t206: "delegate_task con acp_command: 'claude' avvia Claude Code come agente figlio da qualsiasi piattaforma."
  t207: "La delega ha un thread heartbeat — l'attività del figlio si propaga al genitore, evitando i timeout del gateway."
  t208: "Quando un provider restituisce HTTP 402 (pagamento richiesto), il client ausiliario passa automaticamente al successivo."
  t209: "agent.tool_use_enforcement indirizza i modelli che descrivono le azioni invece di chiamare gli strumenti — automatico per GPT/Codex."
  t210: "agent.restart_after_turn_timeout lascia terminare i turni in corso prima che /restart entri in stop(); restart_drain_timeout è solo il budget per l'interruzione forzata una volta iniziato stop()."
  t211: "agent.api_max_retries (predefinito 3) controlla quante volte l'agente ritenta una chiamata API fallita prima di mostrare l'errore — abbassalo per un fallback rapido."
  t212: "Il gateway mette in cache le istanze AIAgent per sessione — distruggere questa cache rompe il prompt caching di Anthropic."
  t213: "Qualsiasi sito web può esporre skill tramite /.well-known/skills/index.json — l'hub delle skill le scopre automaticamente."
  t214: "Il log di audit delle skill in ~/.scout/skills/.hub/audit.log traccia ogni operazione di installazione e rimozione."
  t215: "I worktree git obsoleti vengono puliti automaticamente all'avvio: gli alberi puliti e completamente uniti vengono rimossi; il lavoro non committato o non pushato viene sempre preservato."
  t216: "I profili delimitano lo stato di Scout tramite SCOUT_HOME; i sottoprocessi degli strumenti host mantengono la tua HOME reale a meno che terminal.home_mode sia profile."
  t217: "La variabile d'ambiente SCOUT_HOME_MODE (ottale, es. 0701) imposta permessi di directory personalizzati per l'attraversamento da parte del server web."
  t218: "Modalità container: metti .container-mode in SCOUT_HOME e la CLI host passa automaticamente in esecuzione nel container."
  t219: "Ogni interruzione durante l'esecuzione dell'agente viene registrata in ~/.scout/interrupt_debug.log con timestamp."
  t220: "BROWSER_CDP_URL collega gli strumenti browser a qualsiasi browser della famiglia Chromium in esecuzione — accetta WebSocket, HTTP o host:port."
  t221: "BROWSERBASE_ADVANCED_STEALTH=true attiva l'anti-rilevamento avanzato con Chromium personalizzato (piano Scale)."
  t222: "La CLI passa automaticamente alla modalità compatta nei terminali più stretti di 80 colonne."
  t223: "I comandi rapidi supportano due tipi: exec (esegue direttamente un comando shell) e alias (reindirizza a un altro comando)."
  t224: "Modello di delega per attività: delegation.model e delegation.provider nella configurazione indirizzano i subagenti a modelli più economici."
  t225: "delegation.reasoning_effort controlla in modo indipendente la profondità di ragionamento dei subagenti."
  t226: "human_delay.mode nella configurazione simula la velocità di digitazione umana — intervallo min_ms/max_ms configurabile."
  t227: "Le migrazioni di versione della configurazione avvengono automaticamente al caricamento — le nuove chiavi compaiono senza intervento manuale."
  t228: "I modelli GPT e Codex ricevono indicazioni speciali nel prompt di sistema per la disciplina e l'uso obbligatorio degli strumenti."
  t229: "I modelli Gemini ricevono direttive su misura per percorsi assoluti, chiamate parallele agli strumenti e comandi non interattivi."
  t230: "context.engine in config.yaml può essere impostato al nome di un plugin per strategie alternative di gestione del contesto."
  t231: "Gli snapshot delle pagine browser oltre i 15.000 caratteri vengono troncati o riassunti automaticamente; lo snapshot completo viene salvato in cache/web per la lettura paginata con read_file."
  t232: "Il compressore esegue una pre-passata economica: gli output degli strumenti oltre i 200 caratteri vengono sostituiti da segnaposto prima di eseguire l'LLM."
  t233: "Quando la compressione fallisce, i tentativi successivi vengono sospesi per 10 minuti per non martellare l'API."
  t234: "I comandi pericolosi lunghi (>70 caratteri) hanno un'opzione 'view' nel prompt di approvazione per vedere prima il testo completo."
  t235: "La visualizzazione del livello audio mostra le barre ▁▂▃▄▅▆▇ durante la registrazione vocale in base ai livelli RMS del microfono."
  t236: "I nomi dei profili non possono coincidere con binari presenti nel PATH — 'scout profile create ls' verrebbe rifiutato."
  t237: "scout profile create backup --clone-all copia tutto (configurazione, chiavi, SOUL.md, memorie, skill, sessioni)."
  t238: "I file .cursorrules e .cursor/rules/*.mdc vengono rilevati e caricati automaticamente come contesto del progetto."
  t239: "I file di contesto supportano oltre 10 pattern di prompt injection — Unicode invisibile, 'ignore instructions', tentativi di esfiltrazione."
  t240: "GPT-5 e Codex usano il ruolo 'developer' invece di 'system' nel formato dei messaggi."
  t241: "Override ausiliari per attività: auxiliary.vision.provider, auxiliary.compression.model, ecc. in config.yaml."
  t242: "Il client ausiliario tratta 'main' come alias di provider — si risolve nel tuo provider primario + modello effettivi."
  t243: "scout claw migrate --dry-run mostra in anteprima la migrazione da OpenClaw senza scrivere nulla."
  t244: "I percorsi di file incollati con virgolette o spazi con escape vengono gestiti automaticamente — nessuna pulizia manuale."
  t245: "I comandi slash non attivano mai il collasso degli incolla lunghi — /command con argomenti grandi funziona correttamente."
  t246: "In modalità interrupt, i comandi slash digitati durante l'esecuzione dell'agente saltano la logica di interruzione e vengono eseguiti subito."
  t247: "SCOUT_DEV=1 salta il rilevamento della modalità container per lo sviluppo locale."
  t248: "Ogni server MCP ha il proprio toolset (mcp-servername) che può essere attivato o disattivato indipendentemente tramite scout tools."
  t249: "I segnaposto MCP ${ENV_VAR} nella configurazione vengono risolti all'avvio del server — incluse le variabili da ~/.scout/.env."
  t250: "Le skill da repository fidati (SpaceshipResearch) hanno il livello di sicurezza 'trusted'; le skill della community ricevono scansioni aggiuntive."
  t251: "La quarantena delle skill in ~/.scout/skills/.hub/quarantine/ contiene le skill in attesa di revisione di sicurezza."
  t252: "/steer <prompt> inietta una nota dopo la prossima chiamata a uno strumento — correggi la direzione a metà attività senza interrompere."
  t253: "/goal <text> imposta un obiettivo permanente in stile Ralph-loop — Scout continua automaticamente turno dopo turno finché un giudice non dichiara fatto."
  t254: "/snapshot create [label] salva uno snapshot completo dello stato della configurazione di Scout; /snapshot restore <id> lo ripristina in seguito."
  t255: "/copy [N] copia l'ultima risposta dell'assistente negli appunti, oppure l'N-esima dalla fine indicando un numero."
  t256: "/redraw forza un ridisegno completo dell'interfaccia, correggendo lo sfasamento del terminale dopo un ridimensionamento in tmux o artefatti da selezione col mouse."
  t257: "/agents (alias /tasks) mostra gli agenti attivi e le attività in background in esecuzione nella sessione corrente."
  t258: "/footer attiva o disattiva il footer del gateway sulle risposte finali, con modello, % di contesto e cwd."
  t259: "/busy queue|steer|interrupt controlla cosa fa la pressione di Enter mentre Scout sta lavorando."
  t260: "/approve session|always esegue un comando pericoloso in attesa con l'ambito di fiducia scelto; /deny lo rifiuta."
  t261: "/restart riavvia il gateway in modo controllato dopo aver lasciato terminare le esecuzioni attive, poi avvisa chi l'ha richiesto quando è di nuovo attivo."
  t262: "/kanban boards switch <slug> cambia la board Kanban multi-progetto attiva direttamente dalla chat."
  t263: "/reload ricarica ~/.scout/.env nella sessione in esecuzione — recupera nuove chiavi API senza riavviare."
  t264: "cronjob con no_agent=True esegue uno script a orario e invia direttamente il suo stdout — zero token, zero LLM."
  t265: "Uno stdout vuoto dello script cron significa tick silenzioso — non viene consegnato nulla, perfetto per watchdog a soglia."
  t266: "SCOUT_CRON_MAX_PARALLEL (predefinito 4) limita quanti job cron girano per tick, così i picchi non saturano le tue chiavi."
  t267: "Gli hook del gateway vivono in ~/.scout/hooks/<name>/ con HOOK.yaml + handler.py — l'handler deve chiamarsi `handle`."
  t268: "Gli eventi hook includono gateway:startup, session:start, agent:step e le sottoscrizioni con wildcard command:*."
  t269: "Metti una checklist in ~/.scout/BOOT.md e un hook gateway:startup la esegue come agente one-shot a ogni avvio."
  t270: "scout curator run --dry-run mostra in anteprima cosa il curatore archivierebbe o consoliderebbe senza modificare nulla."
  t271: "scout curator pin <skill> protegge una skill sia dall'archiviazione automatica sia dallo strumento skill_manage dell'agente."
  t272: "scout curator rollback ripristina le skill da uno snapshot pre-esecuzione — i backup stanno in skills/.curator_backups/."
  t273: "scout auth reset <provider> [target] azzera cooldown e flag di esaurimento su un intero pool di credenziali, o su una sola credenziale per indice, id o etichetta."
  t274: "credential_pool_strategies.<provider>: round_robin alterna le chiavi in modo uniforme invece del fill_first predefinito."
  t275: "scout tools sceglie un provider per strumento — ricerca web, immagini, TTS e browser — ciascuno con la tua chiave API."
  t276: "provider_routing.data_collection: deny esclude su OpenRouter i provider che conservano i dati."
  t277: "provider_routing.require_parameters: true instrada solo verso provider che supportano ogni parametro della tua richiesta."
  t278: "scout dashboard avvia un'interfaccia web locale su 127.0.0.1:9119 — nessun dato lascia localhost."
  t279: "Metti un YAML in ~/.scout/dashboard-themes/ con due colori di palette per cambiare l'aspetto dell'intera dashboard."
  t280: "I plugin della dashboard sono drop-in: manifest.json + bundle JS in ~/.scout/dashboard-plugins/ — nessuna build npm richiesta."
  t281: "layoutVariant: cockpit in un tema della dashboard aggiunge una barra laterale sinistra di 260px che i plugin possono popolare tramite lo slot sidebar."
  t282: "SCOUT_BACKGROUND_NOTIFICATIONS=result avvisa solo quando le attività in background terminano (rispetto a concise/all/error/off)."
  t283: "SCOUT_WRITE_SAFE_ROOT limita write_file/patch a prefissi di directory; più percorsi tramite os.pathsep (: o ;)."
  t284: "SCOUT_IGNORE_RULES salta l'iniezione automatica di AGENTS.md, SOUL.md, .cursorrules, memoria e skill precaricate."
  t285: "SCOUT_ACCEPT_HOOKS approva automaticamente gli hook shell mai visti dichiarati in config.yaml senza un prompt TTY."
  t286: "auxiliary.goal_judge.model instrada il giudice di /goal a un modello economico e veloce per tenere il costo del loop vicino a zero."
  t287: "I checkpoint saltano le directory con più di 50.000 file per evitare operazioni git lente su monorepo enormi."
  t288: "tts.provider: piper esegue un TTS locale su CPU in 44 lingue — le voci si scaricano automaticamente in ~/.scout/cache/piper-voices/."
  t289: "tts.providers.<name>.type: command collega qualsiasi motore TTS a riga di comando con i segnaposto {input_path} e {output_path}."
  t290: "API_SERVER_ENABLED=true esegue un endpoint compatibile OpenAI accanto al gateway per Open WebUI e LibreChat."
  t291: "batch_runner.py --resume riconosce i prompt completati in base al testo, così i riordini del dataset non rieseguono il lavoro già fatto."
  t292: "/new avvia una nuova sessione sul posto (alias /reset) — nuovo ID di sessione, cronologia pulita, la CLI resta aperta."
  t293: "/clear pulisce lo schermo del terminale E avvia una nuova sessione — una sola scorciatoia per un reset visivo."
  t294: "/save scrive la conversazione corrente su disco senza terminare la sessione."
  t295: "/status mostra le informazioni della sessione a colpo d'occhio: ID, titolo, modello, utilizzo dei token e tempo trascorso."
  t296: "/image <path> allega un file immagine locale al tuo prossimo prompt senza incollare o trascinare."
  t297: "/commands mostra paginato l'elenco completo dei comandi slash e delle skill installate — utile sulle piattaforme senza completamento con Tab."
  t298: "/toolsets elenca tutti i toolset disponibili, così sai cosa accetta -t/--toolsets."
  t299: "/reload-skills riesamina ~/.scout/skills/ così le skill aggiunte a mano compaiono senza riavviare la sessione."
  t300: "/debug carica un bundle di supporto (info di sistema + log) e restituisce link condivisibili — funziona anche in chat."
  t301: "scout dump --show-keys include le impronte oscurate delle chiavi API per un debug di supporto più approfondito."
  t302: "scout sessions rename <ID> \"new title\" rinomina qualsiasi sessione passata; scout sessions delete <ID> ne elimina una."
  t303: "scout import ripristina un backup zip completo di Scout; le esportazioni JSON/JSONL delle sessioni si importano dalla pagina Sessions della dashboard."
  t304: "scout fallback gestisce la catena fallback_model in modo interattivo — niente modifiche a mano a config.yaml."
  t305: "scout setup guida i nuovi utenti nella configurazione di provider, chiavi e piattaforme in un unico flusso interattivo."
  t306: "scout status --deep esegue il controllo di salute completo su ogni componente; scout status semplice è la vista rapida."
  t307: "SCOUT_AGENT_TIMEOUT=0 disattiva la terminazione per inattività del gateway per un agente in esecuzione — utile per lunghe sessioni di ricerca."
  t308: "SCOUT_ENABLE_PROJECT_PLUGINS=1 carica automaticamente i plugin locali del repository da ./.scout/plugins/ — protetti da un controllo di fiducia per design."
  t309: "SCOUT_DISABLE_FILE_STATE_GUARD=1 disattiva la protezione 'file modificato dopo la lettura' su patch e write_file."
  t310: "SCOUT_ALLOW_PRIVATE_URLS=true consente agli strumenti web di raggiungere localhost e reti private — disattivato per impostazione predefinita in modalità gateway."
  t311: "SCOUT_OPTIONAL_SKILLS=name1,name2 installa automaticamente skill extra del catalogo opzionale al primo avvio di ogni profilo."
  t312: "SCOUT_BUNDLED_SKILLS punta a un albero personalizzato di skill incluse — usato dal packaging Homebrew e Nix."
  t313: "SCOUT_DUMP_REQUEST_STDOUT=1 scarica su stdout il payload di ogni richiesta API invece che nei file di log."
  t314: "SCOUT_OAUTH_TRACE=1 registra, oscurati, gli scambi e i tentativi di refresh del token OAuth per il debug dell'autenticazione dei provider."
  t315: "SCOUT_STREAM_RETRIES (predefinito 3) controlla i tentativi di riconnessione a metà stream in caso di errori di rete transitori."
  t316: "SCOUT_GATEWAY_BUSY_ACK_ENABLED=false silenzia i messaggi di conferma ⚡/⏳/⏩ quando un utente scrive a un agente occupato."
  t317: "SCOUT_AGENT_NOTIFY_INTERVAL (predefinito 180s) imposta ogni quanto il gateway invia aggiornamenti di avanzamento sui turni lunghi."
  t318: "SCOUT_RESTART_DRAIN_TIMEOUT (predefinito 900s) limita quanto /restart attende le esecuzioni in corso prima di forzare."
  t319: "SCOUT_CHECKPOINT_TIMEOUT (predefinito 30s) limita il tempo di creazione dei checkpoint del filesystem — aumentalo su monorepo enormi."
  t320: "image_gen.model in config.yaml sceglie il modello FAL: flux-2/klein, gpt-image-2, nano-banana-pro e altri."
  t321: "image_gen.provider instrada la generazione di immagini attraverso un plugin (OpenAI Images, Codex, FAL) invece del predefinito."
  t322: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY puntano l'analisi visiva a qualsiasi endpoint compatibile OpenAI."
  t323: "security.tirith_fail_open: false fa sì che Scout blocchi i comandi quando lo scanner tirith stesso va in errore."
  t324: "La variabile d'ambiente TIRITH_FAIL_OPEN sovrascrive la configurazione tirith_fail_open — un interruttore rapido senza modificare config.yaml."
  t325: "Gli ID di sessione hanno un prefisso timestamp (20250305_091523_abcd), così l'ordinamento funziona naturalmente in ls e jq."
  t326: "API_SERVER_MODEL_NAME personalizza il nome del modello su /v1/models — essenziale per configurazioni Open WebUI multi-profilo."
  t327: "I plugin della dashboard vengono serviti da /dashboard-plugins/<name>/ — metti i file in ~/.scout/dashboard-plugins/."
  placeholder:
    p01: "Chiedi qualsiasi cosa, o digita / per i comandi…"
    p02: "Riassumi cosa c'è in questa cartella"
    p03: "Scrivi una bozza di risposta all'ultima email nella mia casella"
    p04: "Pianifica una funzionalità, poi costruiscila passo dopo passo"
    p05: "Trova e correggi un test che fallisce"
    p06: "Fai una ricerca su questo argomento e scrivimi una sintesi"
    p07: "Cosa è cambiato di recente in questo repository?"
    p08: "Trasforma questi appunti in una lista di cose da fare"
    p09: "Spiega questo errore e come risolverlo"
    p10: "Imposta un promemoria o pianifica un'attività ricorrente"
    p11: "Digita / per sfogliare i comandi, o Ctrl+P per la palette comandi"
