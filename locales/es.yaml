      skill: "Skill"
      memory: "Memoria"
      user: "Perfil de usuario"
    summary_cli: "  💾 Revisión de automejora: {summary}"
    summary_callback: "💾 Revisión de automejora: {summary}"
    aux_failure_label: "revisión en segundo plano"
  notice:
    uncompressed_context_overflow: "⚠️ El contexto de la sesión (~{tokens} tokens) supera la ventana de contexto del modelo (~{context_length} tokens) con la compresión desactivada (compression.enabled: false). Usa /compact para comprimir el historial o activa la compresión en config.yaml."
explainer:
  no_reply_prefix: "⚠️ Sin respuesta: "
  empty_response: "{model} no produjo una respuesta esta vez, ni siquiera tras los reintentos. Envía `continue` para intentarlo de nuevo, o cambia de modelo con /model."
  exit:
    all_retries_exhausted_no_response: "el proveedor del modelo no respondió tras agotar todos los reintentos. Envía /retry, o cambia de modelo con /model."
    partial_stream_recovery: "la transmisión se detuvo antes de tiempo y solo se recuperó una respuesta parcial. Envía `continue` para reanudar desde donde se detuvo."
    fallback_prior_turn_content: "no se produjo contenido nuevo en este turno; se muestra el contexto previo recuperado. Envía `continue` para reintentar."
    redirect_restart_limit_exceeded: "una nueva corrección canceló la solicitud en cada intento, así que el turno se detuvo en lugar de reintentar indefinidamente. Tu última corrección quedó en cola como el siguiente mensaje."
    rebuilt_restart_limit_exceeded: "todos los proveedores de la cadena de respaldo siguieron fallando, así que el turno se detuvo en lugar de reintentar indefinidamente. Envía `continue` o cambia de proveedor."
    budget_exhausted: "el presupuesto de iteraciones/costo por turno se agotó antes de llegar a una respuesta final. Envía `continue` para seguir."
    ollama_runtime_context_too_small: "la ventana de contexto del modelo local era demasiado pequeña para terminar. Aumenta el tamaño del contexto o usa un modelo más grande."
    pending_tool_result: "el turno se detuvo con un resultado de herramienta aún pendiente y el modelo no produjo texto de seguimiento. Envía `continue` para que lo resuma."
    interrupted_during_api_call: "la solicitud se interrumpió a mitad de la llamada, antes de recibir una respuesta. Envía `continue` para reintentar."
    max_iterations_reached: "se alcanzó el límite máximo de iteraciones de herramientas antes de una respuesta final. Envía `continue` para seguir, o aumenta `max_iterations`."
    error_near_max_iterations: "ocurrió un error cerca del límite de iteraciones antes de una respuesta final. Revisa la salida de la herramienta arriba y luego envía `continue`."
    repeated_outer_errors: "el turno siguió fallando con errores repetidos y se detuvo antes de tiempo en lugar de reintentar indefinidamente. Revisa los errores arriba y luego envía `continue` para reintentar."
  persistence:
    compression: "el turno se detuvo porque otro proceso estaba comprimiendo esta sesión. Tu mensaje ya debería estar guardado — vuelve a enviarlo cuando termine la compresión."
    compression_closed: "el turno se detuvo porque la compresión de contexto rotó esta sesión y no se pudo adoptar su continuación activa. El almacenamiento está en buen estado — actualiza el cliente (o inicia un nuevo turno) para que tome el nuevo id de sesión y vuelve a enviar tu mensaje."
    turn_lease: "el turno se detuvo porque otro proceso de Scout tomó el control de esta sesión. Tu respuesta no se guardó — espera a que el otro proceso termine y vuelve a enviar tu mensaje."
    session_row_missing: "esta sesión se eliminó del almacenamiento mientras el chat seguía abierto y Scout no pudo recrearla, así que este mensaje no se guardó. Vuelve a enviarlo; si sigue fallando, ejecuta `scout {profile_arg}doctor`."
    locked: "el turno se detuvo porque el almacenamiento de sesiones estaba ocupado (otro proceso de Scout estaba escribiendo en la base de datos de estado). Tu mensaje ya debería estar guardado — vuelve a enviarlo en un momento."
    replaced: "el archivo de la base de datos de sesiones fue reemplazado mientras Scout se ejecutaba, así que este mensaje no se guardó (se conserva una copia en {home}/sessions/). Detén Scout (`scout {profile_arg}gateway stop`), ejecuta `scout {profile_arg}doctor` — no `scout {profile_arg}doctor --fix`, que repararía el archivo equivocado en su lugar —, luego inícialo de nuevo y vuelve a enviar tu mensaje. Los pasos avanzados de recuperación están en el log."
    deleted_wal: "otro proceso de Scout aún conserva una copia antigua del write-ahead log de la base de datos de sesiones, así que Scout dejó de escribir para proteger el archivo y este mensaje no se guardó (se conserva una copia en {home}/sessions/). No se perdió nada. Cierra todos los procesos de Scout de este perfil (app de escritorio, `scout {profile_arg}gateway stop`, dashboard, cron), ejecuta `scout {profile_arg}doctor` — indica qué proceso sigue reteniendo el log —, luego inicia Scout de nuevo y vuelve a enviar tu mensaje. No ejecutes `doctor --fix` ni elimines archivos state.db mientras estén en ejecución. Guía: {recovery_docs}"
    corrupt: "el turno se detuvo porque la base de datos de estado reportó corrupción estructural (la transcripción se habría perdido al reiniciar). Liberar espacio en disco no ayudará. Opciones de recuperación:\n1. Ejecuta `scout {profile_arg}doctor --fix`\n2. Detén el gateway y luego recupera con:\n   scout {profile_arg}sessions recover --source {db_path} --inspect-only\n   (si indica que es recuperable) scout {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — la recuperación toma primero una instantánea del archivo dañado; NO ejecutes `sqlite3 ... \".recover\"` contra el state.db activo, una CLI de sqlite3 vulnerable puede corromperlo aún más\n3. Restaura una copia de seguridad desde {backups_dir}/\nDespués, vuelve a enviar tu mensaje."
    fts_index: "el turno se detuvo porque el índice de búsqueda de sesiones (FTS5) está corrupto y no se pudo desvincular, así que este mensaje no se guardó. El almacén de mensajes no está dañado: no ejecutes herramientas de recuperación ni restaures una copia de seguridad. Ejecuta `scout {profile_arg}doctor --fix` (o reinicia Scout, que repara el índice al abrir) y vuelve a enviar tu mensaje."
    disk: "Scout no pudo guardar esta conversación en el disco, así que se detuvo en lugar de perder tus mensajes. Probablemente el disco está lleno: libera espacio (o corrige los permisos de {home}/state.db) y vuelve a enviar tu mensaje."
    default: "Scout no pudo guardar esta conversación, así que se detuvo en lugar de perder tus mensajes. Causas posibles: la unidad se quedó sin espacio, u otro proceso de Scout está reteniendo la base de datos. Cierra las demás ventanas de Scout, ejecuta `scout {profile_arg}doctor` para revisar el almacenamiento y vuelve a enviar tu mensaje."
  file_mutation:
    header: "⚠️ Verificador de modificación de archivos: {count} edición(es) de archivo FALLARON en este turno, aunque el texto de arriba sugiera lo contrario. Ejecuta `git status` o `read_file` para confirmar qué se aplicó realmente."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "falló"
  shared:
    and_more: "  • … y {count} más"
    the_model: "El modelo"
tips:
  t001: "/bg <prompt> ejecuta una tarea en una sesión separada mientras la actual queda libre; /btw <question> responde una pregunta al margen sobre esta conversación sin interrumpirla."
  t002: "/branch bifurca la sesión actual para que explores otra dirección sin perder el progreso."
  t003: "/compress comprime manualmente el contexto de la conversación cuando se alarga demasiado."
  t004: "/rollback lista los puntos de control del sistema de archivos: restaura los archivos que modificó el agente a cualquier estado anterior."
  t005: "/rollback diff 2 muestra qué cambió desde el punto de control 2 sin restaurar nada."
  t006: "/rollback 2 src/file.py restaura un solo archivo desde un punto de control específico."
  t007: "/title \"mi proyecto\" da nombre a tu sesión; reanúdala después con /resume o scout -c."
  t008: "/resume retoma una sesión con nombre justo donde la dejaste."
  t009: "/queue <prompt> pone un mensaje en cola para el siguiente turno sin interrumpir el actual."
  t010: "/undo elimina el último intercambio usuario/asistente de la conversación."
  t011: "/retry reenvía tu último mensaje; útil cuando la respuesta del agente no fue del todo acertada."
  t012: "/verbose alterna la visualización del progreso de herramientas: off → new → all → verbose."
  t013: "/reasoning high aumenta la profundidad de razonamiento del modelo. /reasoning show muestra el razonamiento."
  t014: "/fast activa o desactiva el procesamiento prioritario para obtener respuestas de la API más rápidas (según el proveedor)."
  t015: "/yolo omite todas las solicitudes de aprobación de comandos peligrosos durante el resto de la sesión."
  t016: "/model te permite cambiar de modelo a mitad de sesión; prueba /model sonnet o /model gpt-5."
  t017: "/model --global cambia tu modelo predeterminado de forma permanente."
  t018: "/personality pirate activa una personalidad divertida: 14 opciones integradas, de kawaii a shakespeare."
  t019: "/tools disable browser quita temporalmente las herramientas del navegador durante la sesión actual."
  t020: "/browser connect conecta las herramientas del navegador a tu navegador basado en Chromium en ejecución mediante CDP."
  t021: "/plugins lista los plugins instalados y su estado."
  t022: "/reload-mcp recarga en caliente la configuración de los servidores MCP sin reiniciar."
  t023: "/usage muestra el uso de tokens, el desglose de costos y la duración de la sesión."
  t024: "/insights muestra el análisis de uso de los últimos 30 días."
  t025: "/paste busca una imagen en tu portapapeles y la adjunta a tu siguiente mensaje."
  t026: "/profile muestra qué perfil está activo y su directorio home."
  t027: "/config muestra tu configuración actual de un vistazo."
  t028: "/stop termina todos los procesos en segundo plano iniciados por el agente."
  t029: "@file:path/to/file.py inserta el contenido de un archivo directamente en tu mensaje."
  t030: "@file:main.py:10-50 inserta solo las líneas 10-50 de un archivo."
  t031: "@folder:src/ inserta el listado del árbol de un directorio."
  t032: "@diff inserta en el mensaje tus cambios de git sin preparar (unstaged)."
  t033: "@staged inserta tus cambios de git preparados (git diff --staged)."
  t034: "@git:5 inserta los últimos 5 commits con sus parches completos."
  t035: "@url:https://example.com descarga e inserta el contenido de una página web."
  t036: "Escribir @ activa el autocompletado de rutas del sistema de archivos: navega a cualquier archivo de forma interactiva."
  t037: "Combina varias referencias: \"Revisa @file:main.py y @file:test.py para comprobar la consistencia\"."
  t038: "Escribe un mensaje nuevo mientras el agente trabaja para interrumpirlo y redirigirlo."
  t039: "Al pegar 5 líneas o más, el texto se guarda automáticamente en un archivo y se inserta una referencia compacta en su lugar."
  t040: "scout -c reanuda tu sesión de CLI más reciente. scout -c \"nombre del proyecto\" reanuda por título."
  t041: "scout -w crea un worktree de git aislado, ideal para flujos de trabajo con agentes en paralelo."
  t042: "scout -p work chat se ejecuta con un perfil específico sin cambiar tu perfil predeterminado."
  t043: "scout doctor --fix diagnostica y repara automáticamente problemas de configuración y dependencias."
  t044: "scout dump genera un resumen compacto de tu instalación, ideal para reportes de errores."
  t045: "scout config set KEY VALUE envía automáticamente los secretos a .env y todo lo demás a config.yaml."
  t046: "scout config edit abre config.yaml en tu editor predeterminado."
  t047: "scout config check busca opciones de configuración faltantes u obsoletas."
  t048: "scout sessions browse abre un selector interactivo de sesiones con búsqueda."
  t049: "scout sessions stats muestra el número de sesiones por plataforma y el tamaño de la base de datos."
  t050: "scout sessions prune --older-than 30 limpia las sesiones antiguas."
  t051: "scout skills search react --source skills-sh busca en el directorio público skills.sh."
  t052: "scout skills check revisa si las skills instaladas desde el hub tienen actualizaciones."
  t053: "scout skills tap add myorg/skills-repo agrega una fuente de skills personalizada de GitHub."
  t054: "scout skills snapshot export setup.json exporta tu configuración de skills para respaldarla o compartirla."
  t055: "scout mcp add github --command npx agrega servidores MCP desde la línea de comandos."
  t056: "scout mcp serve ejecuta Scout como servidor MCP para otros agentes."
  t057: "scout auth add te permite agregar varias claves de API para rotar un grupo de credenciales."
  t058: "scout logs -f sigue agent.log en tiempo real. --level WARNING --since 1h filtra la salida."
  t059: "scout backup crea una copia de seguridad en zip de todo tu directorio home de Scout."
  t060: "scout profile create coder crea un perfil aislado que se convierte en su propio comando."
  t061: "scout profile create work --clone copia tu configuración y claves actuales a un perfil nuevo."
  t062: "scout update sincroniza automáticamente las nuevas skills incluidas en TODOS los perfiles."
  t063: "scout gateway install configura Scout como servicio del sistema (systemd/launchd)."
  t064: "scout memory setup te permite configurar un proveedor de memoria externo (Honcho, Mem0, etc.)."
  t065: "scout webhook subscribe crea rutas de webhook basadas en eventos con validación HMAC."
  t066: "Ahorra dinero: scout tools desactiva herramientas que no usas y scout skills config recorta las skills."
  t067: "/reasoning low o /reasoning minimal reduce la profundidad de razonamiento por debajo del valor predeterminado (medium): respuestas más rápidas y baratas."
  t068: "scout models envía las tareas de visión, compresión y auxiliares a modelos más baratos: reduce el costo de tokens en segundo plano en más de un 85% sin degradar tu modelo de chat principal."
  t069: "Configura display.bell_on_complete: true en config.yaml para oír una campana cuando terminen las tareas largas."
  t070: "Configura display.streaming: true para ver los tokens aparecer en tiempo real mientras el modelo genera."
  t071: "Configura display.show_reasoning: true para observar la cadena de razonamiento del modelo."
  t072: "Configura display.compact: true para reducir los espacios en la salida y mostrar la información más densa."
  t073: "Configura display.busy_input_mode: queue para poner los mensajes en cola en lugar de interrumpir al agente, o steer para inyectarlos a mitad de ejecución mediante /steer."
  t074: "Configura display.resume_display: minimal para omitir el resumen completo de la conversación al reanudar una sesión."
  t075: "Configura compression.threshold: 0.50 para controlar cuándo se activa la compresión automática (predeterminado: 50% del contexto)."
  t076: "Configura agent.max_turns: 1000 para que el agente pueda dar más pasos de llamadas a herramientas por turno."
  t077: "Configura file_read_max_chars: 200000 para aumentar el contenido máximo por llamada a read_file."
  t078: "Configura approvals.mode: smart para que un LLM apruebe automáticamente los comandos seguros y deniegue los peligrosos."
  t079: "Configura fallback_model en config.yaml para conmutar automáticamente a un proveedor de respaldo."
  t080: "Configura privacy.redact_pii: true para aplicar hash a los IDs de usuario y números de teléfono antes de enviarlos al LLM."
  t081: "Configura browser.record_sessions: true para grabar automáticamente las sesiones del navegador como videos WebM."
  t082: "Configura worktree: true en config.yaml para crear siempre un worktree de git (igual que scout -w)."
  t083: "Configura security.website_blocklist.enabled: true para bloquear dominios específicos en las herramientas web."
  t084: "Configura cron.wrap_response: false para entregar la salida del agente sin el encabezado ni el pie de cron."
  t085: "SCOUT_TIMEZONE reemplaza la zona horaria del servidor con cualquier cadena de zona horaria IANA."
  t086: "La sustitución de variables de entorno funciona en config.yaml: usa la sintaxis ${VAR_NAME}."
  t087: "Los comandos rápidos en config.yaml ejecutan comandos de shell al instante sin gastar tokens."
  t088: "Puedes definir personalidades personalizadas en config.yaml bajo agent.personalities."
  t089: "provider_routing controla el orden, la lista de permitidos y la lista de bloqueo de proveedores en OpenRouter."
  t090: "execute_code ejecuta scripts de Python que llaman a las herramientas de Scout de forma programática; los resultados quedan fuera del contexto."
  t091: "delegate_task lanza hasta 10 subagentes concurrentes de forma predeterminada (delegation.max_concurrent_children) con contextos aislados para trabajar en paralelo."
  t092: "web_extract funciona con URLs de PDF: pásale cualquier enlace a un PDF y lo convierte a markdown."
  t093: "search_files se basa en ripgrep y es más rápido que grep; úsalo en lugar de grep en la terminal."
  t094: "patch usa 9 estrategias de coincidencia aproximada, así que las pequeñas diferencias de espacios no rompen las ediciones."
  t095: "patch admite el formato V4A para editar varios archivos en bloque en una sola llamada."
  t096: "read_file sugiere nombres de archivo similares cuando no encuentra el archivo."
  t097: "read_file deduplica automáticamente: volver a leer un archivo sin cambios devuelve un marcador ligero."
  t098: "browser_vision toma una captura de pantalla y la analiza con IA; funciona con CAPTCHAs y contenido visual."
  t099: "browser_console puede evaluar expresiones de JavaScript en el contexto de la página."
  t100: "image_generate crea imágenes con FLUX 2 Pro y escalado automático 2x."
  t101: "La herramienta todo ayuda al agente a seguir tareas complejas de varios pasos durante una sesión."
  t102: "session_search realiza búsquedas de texto completo en TODAS las conversaciones anteriores."
  t103: "El agente guarda automáticamente en memoria tus preferencias, correcciones y datos del entorno."
  t104: "/moa envía un prompt difícil a través del conjunto de modelos Mixture of Agents que hayas configurado."
  t105: "Los comandos de terminal admiten el modo en segundo plano con notify_on_complete para tareas de larga duración."
  t106: "Los procesos de terminal en segundo plano admiten watch_patterns para avisar cuando aparecen líneas de salida específicas."
  t107: "La herramienta terminal admite 6 backends: local, Docker, SSH, Modal, Daytona y Singularity."
  t108: "Cada perfil tiene su propia configuración, claves de API, memoria, sesiones, skills y tareas programadas (cron)."
  t109: "Los nombres de perfil se convierten en comandos de shell: 'scout profile create coder' crea el comando 'coder'."
  t110: "scout profile export coder -o backup.tar.gz crea un archivo portátil del perfil."
  t111: "Las sesiones generan títulos descriptivos automáticamente tras el primer intercambio; no hace falta nombrarlas a mano."
  t112: "Los títulos de sesión admiten linaje: \"mi proyecto\" → \"mi proyecto #2\" → \"mi proyecto #3\"."
  t113: "Al salir, Scout imprime un comando para reanudar con el ID de la sesión y sus estadísticas."
  t114: "scout sessions export backup.jsonl exporta todas las sesiones para respaldo o análisis."
  t115: "scout -r SESSION_ID reanuda cualquier sesión anterior específica por su ID."
  t116: "La memoria es una instantánea congelada: los cambios aparecen en el prompt del sistema solo al iniciar la siguiente sesión."
  t117: "Las entradas de memoria se analizan automáticamente en busca de patrones de inyección de prompts y exfiltración."
  t118: "El agente tiene dos almacenes de memoria: notas personales (~2200 caracteres) y perfil de usuario (~1375 caracteres)."
  t119: "Las correcciones que le das al agente (\"no, hazlo así\") suelen guardarse automáticamente en memoria."
  t120: "Más de 80 skills incluidas que cubren github, creative, mlops, productivity, research y más."
  t121: "Cada skill instalada se convierte automáticamente en un comando con barra; escribe / para verlas todas."
  t122: "scout skills install official/security/1password instala skills opcionales desde el repositorio."
  t123: "Las skills pueden limitarse a sistemas operativos específicos; algunas solo se cargan en macOS o Linux."
  t124: "skills.external_dirs en config.yaml te permite cargar skills desde directorios personalizados."
  t125: "El agente puede crear sus propias skills como memoria procedimental usando skill_manage."
  t126: "/plan escribe un plan de implementación en markdown en .scout/plans/ sin ejecutar nada."
  t127: "Las tareas programadas pueden adjuntar skills: scout cron add --skill blogwatcher \"Check for new posts\"."
  t128: "Si una respuesta de cron empieza con [SILENT], se suprime la entrega; útil para tareas de solo monitoreo."
  t129: "Cron admite retrasos relativos (30m), intervalos (every 2h), expresiones cron y marcas de tiempo ISO."
  t130: "Las tareas programadas (cron) se ejecutan en sesiones de agente completamente nuevas: los prompts deben ser autocontenidos."
  t131: "El modo de voz funciona sin ninguna clave de API si faster-whisper está instalado (voz a texto local y gratuito)."
  t132: "Hay cinco proveedores de TTS disponibles: Edge TTS (gratis), ElevenLabs, OpenAI, NeuTTS (local y gratis) y MiniMax."
  t133: "El TTS en streaming reproduce las frases a medida que se generan: no tienes que esperar la respuesta completa."
  t134: "scout gateway install lo configura como servicio del sistema que arranca al iniciar el equipo."
  t135: "Las rutas de webhook admiten validación HMAC, límite de tasa y filtrado de eventos."
  t136: "El servidor de API expone un endpoint compatible con OpenAI que funciona con Open WebUI y LibreChat."
  t137: "group_sessions_per_user: true da a cada persona su propia sesión en los chats grupales."
  t138: "El gateway admite tiempos de espera basados en inactividad: los agentes activos pueden ejecutarse indefinidamente."
  t139: "La aprobación de comandos peligrosos tiene 4 niveles: once, session, always (lista de permitidos permanente) y deny."
  t140: "El modo de aprobación inteligente usa un LLM para aprobar automáticamente los comandos seguros y marcar los peligrosos."
  t141: "La protección SSRF bloquea redes privadas, loopback, direcciones link-local y direcciones de metadatos de la nube."
  t142: "El escaneo previo a la ejecución de Tirith detecta URLs falsificadas con homógrafos y patrones de tubería a intérprete."
  t143: "Los subprocesos MCP reciben un entorno filtrado: solo pasan las variables seguras del sistema."
  t144: "Los archivos de contexto (.scout.md, AGENTS.md) se escanean en busca de inyección de prompts antes de cargarse."
  t145: "command_allowlist en config.yaml aprueba de forma permanente patrones concretos de comandos de shell."
  t146: "El contexto se comprime automáticamente al alcanzar el umbral: se vuelcan las memorias y se resume el historial."
  t147: "La barra de estado pasa a amarillo, luego a naranja y después a rojo a medida que se llena el contexto."
  t148: "SOUL.md es el archivo de identidad principal del agente: personalízalo para moldear su comportamiento."
  t149: "Scout carga el contexto del proyecto desde .scout.md, AGENTS.md, CLAUDE.md o .cursorrules (la primera coincidencia)."
  t150: "Los archivos AGENTS.md de subdirectorios se descubren progresivamente a medida que el agente entra en las carpetas."
  t151: "Los archivos de contexto se limitan a 20 000 caracteres con truncado inteligente de inicio/final."
  t152: "Cinco proveedores de navegador: Chromium local, Browserbase, Browser Use, Camofox y Firecrawl."
  t153: "Camofox es un navegador antidetección: un fork de Firefox con suplantación de huella digital en C++."
  t154: "browser_navigate devuelve automáticamente una captura de la página: no hace falta llamar a browser_snapshot después."
  t155: "browser_vision con annotate=true superpone etiquetas numeradas sobre los elementos interactivos."
  t156: "scout mcp abre un selector interactivo de MCPs aprobados por SpaceshipResearch que puedes instalar con una sola tecla."
  t157: "scout mcp catalog lista los servidores MCP aprobados por SpaceshipResearch que se incluyen con el repositorio."
  t158: "scout mcp install <name> instala una entrada del catálogo, pide las credenciales y te deja elegir cuáles de sus herramientas activar."
  t159: "Los servidores MCP se configuran en config.yaml: se admiten los transportes stdio y HTTP."
  t160: "Filtrado de herramientas por servidor: tools.include permite y tools.exclude bloquea herramientas concretas."
  t161: "Los servidores MCP generan sus conjuntos de herramientas al arrancar; scout tools los activa o desactiva por plataforma."
  t162: "Compatibilidad con OAuth en MCP: auth: oauth activa la autorización desde el navegador con PKCE."
  t163: "Los puntos de control no tienen ningún costo cuando no se modifican archivos: están activados de forma predeterminada."
  t164: "Se guarda automáticamente una instantánea previa a la reversión para que puedas deshacer el deshacer."
  t165: "/rollback también deshace el turno de la conversación, así que el agente no recuerda los cambios revertidos."
  t166: "Los puntos de control usan repositorios sombra en ~/.scout/checkpoints/: el .git de tu proyecto nunca se toca."
  t167: "batch_runner.py procesa cientos de prompts en paralelo para generar datos de entrenamiento."
  t168: "El guardado de trayectorias (--save-trajectories) captura trazas completas de uso de herramientas para entrenar modelos."
  t169: "Tres tipos de plugin: generales (herramientas/hooks), proveedores de memoria y motores de contexto."
  t170: "scout plugins install owner/repo instala plugins directamente desde GitHub."
  t171: "Proveedores de memoria externos: Honcho, OpenViking y Mem0 vienen incluidos; Hindsight y otros vía scout plugins install."
  t172: "Los hooks de plugin incluyen pre/post_tool_call, pre/post_llm_call y transform_terminal_output para canonicalizar la salida."
  t173: "El caché de prompts (Anthropic) reduce costos reutilizando prefijos del prompt del sistema ya cacheados."
  t174: "El agente genera los títulos de sesión automáticamente en un hilo en segundo plano: sin impacto en la latencia."
  t175: "El enrutamiento inteligente puede enviar las consultas simples a un modelo más barato."
  t176: "Los comandos de barra admiten coincidencia por prefijo: /h se resuelve como /help y /mod como /model."
  t177: "Arrastrar una ruta de archivo a la terminal adjunta imágenes automáticamente o la envía como contexto."
  t178: ".worktreeinclude en la raíz de tu repositorio lista los archivos ignorados por git que se copiarán a los worktrees."
  t179: "scout acp ejecuta Scout como servidor ACP para integrarlo con VS Code, Zed y JetBrains."
  t180: "Proveedores personalizados: guarda endpoints con nombre en config.yaml bajo custom_providers."
  t181: "SCOUT_EPHEMERAL_SYSTEM_PROMPT inyecta un prompt del sistema que nunca se guarda en el historial."
  t182: "credential_pool_strategies admite las rotaciones fill_first, round_robin, least_used y random."
  t183: "scout auth add anthropic o scout auth add openai-codex configuran proveedores basados en OAuth."
  t184: "El servidor de API admite tanto Chat Completions como la Responses API con estado del lado del servidor."
  t185: "tool_preview_length: 0 en la configuración muestra las rutas de archivo completas en el feed de actividad del spinner."
  t186: "scout status --deep ejecuta comprobaciones de diagnóstico más profundas en todos los componentes."
  t187: "Las tareas programadas (cron) pueden adjuntar un script de Python (--script) cuya salida estándar se inyecta en el prompt como contexto."
  t188: "Los scripts de cron viven en ~/.scout/scripts/ y se ejecutan antes que el agente: perfectos para pipelines de recolección de datos."
  t189: "prefill_messages_file en config.yaml inyecta ejemplos few-shot en cada llamada a la API, sin guardarlos nunca en el historial."
  t190: "SOUL.md reemplaza por completo la identidad predeterminada del agente: reescríbelo para hacer a Scout tuyo."
  t191: "SOUL.md se rellena automáticamente con una personalidad predeterminada en la primera ejecución. Edítalo para personalizarlo."
  t192: "/compress <focus topic> asigna el 60-70 % del presupuesto del resumen a tu tema y recorta agresivamente el resto."
  t193: "A partir de la segunda compresión, el compresor actualiza el resumen anterior en lugar de empezar desde cero."
  t194: "Antes de reiniciar una sesión del gateway, Scout vuelca automáticamente los hechos importantes a la memoria en segundo plano."
  t195: "network.force_ipv4: true en config.yaml corrige los bloqueos en servidores con IPv6 defectuoso: aplica un monkey-patch a socket."
  t196: "La herramienta terminal anota los códigos de salida comunes: grep devolviendo 1 = 'Sin coincidencias (no es un error)'."
  t197: "Los comandos de terminal en primer plano que fallan se reintentan automáticamente hasta 3 veces con retroceso exponencial (2 s, 4 s, 8 s)."
  t198: "Los comandos sudo sin más se reescriben automáticamente para canalizar SUDO_PASSWORD desde .env: no hace falta ningún prompt interactivo."
  t199: "Los helpers de execute_code requieren importaciones explícitas: from scout_tools import json_parse, shell_quote, retry."
  t200: "Las 7 herramientas del sandbox de execute_code (web_search, terminal, read/write/search/patch) usan RPC: nunca entran en el contexto."
  t201: "Leer la misma región de un archivo 3 o más veces genera una advertencia. A partir de 4, se bloquea por completo para evitar bucles."
  t202: "write_file y patch detectan si un archivo se modificó externamente desde la última lectura y avisan de que está desactualizado."
  t203: "El formato de parche V4A admite las directivas Add File, Delete File y Move File, no solo Update."
  t204: "Los servidores MCP pueden pedir completados del LLM mediante sampling: el agente se convierte en una herramienta para el servidor."
  t205: "Los servidores MCP envían notifications/tools/list_changed para volver a registrar las herramientas automáticamente sin reiniciar."
  t206: "delegate_task con acp_command: 'claude' lanza Claude Code como agente hijo desde cualquier plataforma."
  t207: "La delegación tiene un hilo de heartbeat: la actividad del hijo se propaga al padre y evita los tiempos de espera del gateway."
  t208: "Cuando un proveedor devuelve HTTP 402 (pago requerido), el cliente auxiliar pasa automáticamente al siguiente."
  t209: "agent.tool_use_enforcement corrige a los modelos que describen acciones en lugar de llamar a herramientas: automático para GPT/Codex."
  t210: "agent.restart_after_turn_timeout deja que los turnos en curso terminen antes de que /restart entre en stop(); restart_drain_timeout es solo el margen de interrupción forzada una vez que empieza stop()."
  t211: "agent.api_max_retries (predeterminado 3) controla cuántas veces el agente reintenta una llamada a la API fallida antes de mostrar el error: bájalo para un fallback rápido."
  t212: "El gateway cachea las instancias de AIAgent por sesión: destruir este caché rompe el caché de prompts de Anthropic."
  t213: "Cualquier sitio web puede exponer skills vía /.well-known/skills/index.json: el hub de skills las descubre automáticamente."
  t214: "El registro de auditoría de skills en ~/.scout/skills/.hub/audit.log rastrea cada operación de instalación y eliminación."
  t215: "Los worktrees de git obsoletos se limpian automáticamente al iniciar: los árboles limpios y totalmente fusionados se eliminan; el trabajo sucio o sin push siempre se conserva."
  t216: "Los perfiles delimitan el estado de Scout mediante SCOUT_HOME; los subprocesos de herramientas del host conservan tu HOME real salvo que terminal.home_mode sea profile."
  t217: "La variable de entorno SCOUT_HOME_MODE (octal, p. ej. 0701) fija permisos de directorio personalizados para el acceso del servidor web."
  t218: "Modo contenedor: coloca .container-mode en SCOUT_HOME y la CLI del host se ejecutará automáticamente dentro del contenedor."
  t219: "Cada interrupción durante la ejecución de un agente se registra en ~/.scout/interrupt_debug.log con marcas de tiempo."
  t220: "BROWSER_CDP_URL conecta las herramientas de navegador a cualquier navegador de la familia Chromium en ejecución: acepta WebSocket, HTTP o host:port."
  t221: "BROWSERBASE_ADVANCED_STEALTH=true activa la antidetección avanzada con Chromium personalizado (Scale Plan)."
  t222: "La CLI cambia automáticamente al modo compacto en terminales de menos de 80 columnas."
  t223: "Los comandos rápidos admiten dos tipos: exec (ejecuta un comando de shell directamente) y alias (redirige a otro comando)."
  t224: "Modelo de delegación por tarea: delegation.model y delegation.provider en la configuración envían los subagentes a modelos más baratos."
  t225: "delegation.reasoning_effort controla de forma independiente la profundidad de razonamiento de los subagentes."
  t226: "human_delay.mode en la configuración simula la velocidad de escritura humana: rango min_ms/max_ms configurable."
  t227: "Las migraciones de versión de la configuración se ejecutan automáticamente al cargar: las claves nuevas aparecen sin intervención manual."
  t228: "Los modelos GPT y Codex reciben indicaciones especiales en el prompt del sistema sobre disciplina y uso obligatorio de herramientas."
  t229: "Los modelos Gemini reciben directivas específicas sobre rutas absolutas, llamadas paralelas a herramientas y comandos no interactivos."
  t230: "context.engine en config.yaml puede apuntar al nombre de un plugin para usar estrategias alternativas de gestión del contexto."
  t231: "Las capturas de página del navegador de más de 15 000 caracteres se truncan o se resumen automáticamente; la captura completa se guarda en cache/web para paginarla con read_file."
  t232: "El compresor hace una pasada previa barata: las salidas de herramientas de más de 200 caracteres se reemplazan por marcadores antes de ejecutar el LLM."
  t233: "Cuando la compresión falla, los siguientes intentos se pausan 10 minutos para no saturar la API."
  t234: "Los comandos peligrosos largos (>70 caracteres) tienen una opción 'view' en el prompt de aprobación para ver antes el texto completo."
  t235: "La visualización del nivel de audio muestra barras ▁▂▃▄▅▆▇ durante la grabación de voz según el nivel RMS del micrófono."
  t236: "Los nombres de perfil no pueden coincidir con binarios existentes en el PATH: 'scout profile create ls' sería rechazado."
  t237: "scout profile create backup --clone-all copia todo (configuración, claves, SOUL.md, memorias, skills, sesiones)."
  t238: "Los archivos .cursorrules y .cursor/rules/*.mdc se detectan y cargan automáticamente como contexto del proyecto."
  t239: "Los archivos de contexto se revisan contra más de 10 patrones de inyección de prompts: Unicode invisible, 'ignore instructions', intentos de exfiltración."
  t240: "GPT-5 y Codex usan el rol 'developer' en lugar de 'system' en el formato de mensajes."
  t241: "Anulaciones auxiliares por tarea: auxiliary.vision.provider, auxiliary.compression.model, etc. en config.yaml."
  t242: "El cliente auxiliar trata 'main' como alias de proveedor: se resuelve a tu proveedor y modelo principales reales."
  t243: "scout claw migrate --dry-run muestra una vista previa de la migración desde OpenClaw sin escribir nada."
  t244: "Las rutas de archivo pegadas con comillas o espacios escapados se procesan automáticamente: no hace falta limpiarlas a mano."
  t245: "Los comandos de barra nunca activan el colapso de pegados grandes: /command con argumentos largos funciona correctamente."
  t246: "En modo interrupción, los comandos de barra escritos durante la ejecución del agente omiten la lógica de interrupción y se ejecutan de inmediato."
  t247: "SCOUT_DEV=1 omite la detección del modo contenedor para el desarrollo local."
  t248: "Cada servidor MCP tiene su propio conjunto de herramientas (mcp-servername) que se puede activar o desactivar de forma independiente con scout tools."
  t249: "Los marcadores ${ENV_VAR} de MCP en la configuración se resuelven al lanzar el servidor, incluidas las variables de ~/.scout/.env."
  t250: "Las skills de repositorios de confianza (SpaceshipResearch) reciben el nivel de seguridad 'trusted'; las skills de la comunidad pasan por un escaneo adicional."
  t251: "La cuarentena de skills en ~/.scout/skills/.hub/quarantine/ guarda las skills pendientes de revisión de seguridad."
  t252: "/steer <prompt> inyecta una nota después de la siguiente llamada a herramienta: redirige el rumbo a mitad de tarea sin interrumpir."
  t253: "/goal <text> fija un objetivo permanente tipo bucle Ralph: Scout continúa turno tras turno hasta que un juez da la tarea por terminada."
  t254: "/snapshot create [label] guarda una instantánea completa del estado de la configuración de Scout; /snapshot restore <id> la restaura más tarde."
  t255: "/copy [N] copia la última respuesta del asistente a tu portapapeles, o la N-ésima desde el final si indicas un número."
  t256: "/redraw fuerza un repintado completo de la interfaz y corrige el desajuste de la terminal tras redimensionar tmux o seleccionar con el mouse."
  t257: "/agents (alias /tasks) muestra los agentes activos y las tareas en segundo plano en ejecución en la sesión actual."
  t258: "/footer activa o desactiva el pie del gateway en las respuestas finales, que muestra el modelo, el % de contexto y el cwd."
  t259: "/busy queue|steer|interrupt controla qué hace presionar Enter mientras Scout está trabajando."
  t260: "/approve session|always ejecuta un comando peligroso pendiente con el alcance de confianza que elijas; /deny lo rechaza."
  t261: "/restart reinicia el gateway de forma ordenada tras drenar las ejecuciones activas y luego avisa a quien lo solicitó cuando vuelve a estar en línea."
  t262: "/kanban boards switch <slug> cambia el tablero kanban multiproyecto activo desde el propio chat."
  t263: "/reload recarga ~/.scout/.env en la sesión en curso: incorpora claves de API nuevas sin reiniciar."
  t264: "cronjob con no_agent=True ejecuta un script según la programación y envía su salida estándar directamente: cero tokens, cero LLM."
  t265: "Una salida vacía del script de cron significa un tick silencioso: no se entrega nada, perfecto para vigilantes de umbral."
  t266: "SCOUT_CRON_MAX_PARALLEL (predeterminado 4) limita cuántas tareas programadas se ejecutan por tick para que las ráfagas no saturen tus claves."
  t267: "Los hooks del gateway viven en ~/.scout/hooks/<name>/ con HOOK.yaml + handler.py: el handler debe llamarse `handle`."
  t268: "Los eventos de hooks incluyen gateway:startup, session:start, agent:step y suscripciones con comodín command:*."
  t269: "Deja una lista de tareas en ~/.scout/BOOT.md y un hook gateway:startup la ejecutará como agente de una sola pasada en cada arranque."
  t270: "scout curator run --dry-run muestra qué archivaría o consolidaría el curador sin modificar nada."
  t271: "scout curator pin <skill> blinda una skill tanto contra el archivado automático como contra la herramienta skill_manage del agente."
  t272: "scout curator rollback restaura las skills desde una instantánea previa a la ejecución — los respaldos viven en skills/.curator_backups/."
  t273: "scout auth reset <provider> [target] limpia los enfriamientos y las marcas de agotamiento de todo un pool de credenciales, o de una sola credencial por índice, id o etiqueta."
  t274: "credential_pool_strategies.<provider>: round_robin rota las claves de forma equitativa en lugar del fill_first predeterminado."
  t275: "scout tools elige un proveedor por herramienta —búsqueda web, imágenes, TTS y navegador—, cada uno con tu propia clave de API."
  t276: "provider_routing.data_collection: deny excluye a los proveedores que almacenan datos en OpenRouter."
  t277: "provider_routing.require_parameters: true solo enruta a proveedores que admiten todos los parámetros de tu solicitud."
  t278: "scout dashboard lanza una interfaz web local en 127.0.0.1:9119 — ningún dato sale de localhost."
  t279: "Deja un YAML en ~/.scout/dashboard-themes/ con dos colores de paleta para cambiar la apariencia de todo el dashboard."
  t280: "Los plugins del dashboard se instalan con solo copiarlos: manifest.json + bundle JS en ~/.scout/dashboard-plugins/ — sin necesidad de compilar con npm."
  t281: "layoutVariant: cockpit en un tema del dashboard añade un panel izquierdo de 260px que los plugins pueden llenar mediante el slot sidebar."
  t282: "SCOUT_BACKGROUND_NOTIFICATIONS=result solo avisa cuando terminan las tareas en segundo plano (frente a concise/all/error/off)."
  t283: "SCOUT_WRITE_SAFE_ROOT restringe write_file/patch a ciertos prefijos de directorio; varias rutas separadas con os.pathsep (: o ;)."
  t284: "SCOUT_IGNORE_RULES omite la inyección automática de AGENTS.md, SOUL.md, .cursorrules, la memoria y las skills precargadas."
  t285: "SCOUT_ACCEPT_HOOKS aprueba automáticamente los hooks de shell no vistos declarados en config.yaml sin pedir confirmación en la TTY."
  t286: "auxiliary.goal_judge.model enruta el juez de /goal a un modelo rápido y barato para mantener el costo del bucle casi en cero."
  t287: "Los puntos de control omiten directorios con más de 50,000 archivos para evitar operaciones git lentas en monorepos enormes."
  t288: "tts.provider: piper ejecuta TTS local en 44 idiomas sobre CPU — las voces se descargan automáticamente en ~/.scout/cache/piper-voices/."
  t289: "tts.providers.<name>.type: command conecta cualquier motor TTS de línea de comandos con los marcadores {input_path} y {output_path}."
  t290: "API_SERVER_ENABLED=true ejecuta un endpoint compatible con OpenAI junto al gateway para Open WebUI y LibreChat."
  t291: "batch_runner.py --resume compara por texto los prompts ya completados, así que reordenar el dataset no vuelve a ejecutar el trabajo terminado."
  t292: "/new inicia una sesión nueva en el mismo lugar (alias /reset) — ID de sesión nuevo, historial limpio y la CLI sigue abierta."
  t293: "/clear limpia la pantalla del terminal Y además inicia una sesión nueva — un solo atajo para un reinicio visual."
  t294: "/save guarda la conversación actual en disco sin terminar la sesión."
  t295: "/status muestra la información de la sesión de un vistazo: ID, título, modelo, uso de tokens y tiempo transcurrido."
  t296: "/image <path> adjunta un archivo de imagen local para tu siguiente prompt sin pegar ni arrastrar y soltar."
  t297: "/commands pagina la lista completa de comandos slash + skills instaladas — útil en plataformas sin autocompletado con Tab."
  t298: "/toolsets enumera todos los conjuntos de herramientas disponibles para que sepas qué acepta -t/--toolsets."
  t299: "/reload-skills vuelve a escanear ~/.scout/skills/ para que las skills copiadas a mano aparezcan sin reiniciar la sesión."
  t300: "/debug sube un paquete de soporte (información del sistema + logs) y devuelve enlaces para compartir — también funciona en el chat."
  t301: "scout dump --show-keys incluye huellas censuradas de las claves de API para una depuración de soporte más profunda."
  t302: "scout sessions rename <ID> \"nuevo título\" renombra cualquier sesión pasada; scout sessions delete <ID> elimina una."
  t303: "scout import restaura un zip de respaldo completo de Scout; las exportaciones de sesión en JSON/JSONL se importan desde la página Sessions del dashboard."
  t304: "scout fallback gestiona la cadena fallback_model de forma interactiva — sin editar config.yaml a mano."
  t305: "scout setup guía a quienes empiezan por el proveedor, las claves y la conexión de plataformas en un solo flujo interactivo."
  t306: "scout status --deep ejecuta la revisión de salud completa de cada componente; scout status a secas es la vista rápida."
  t307: "SCOUT_AGENT_TIMEOUT=0 desactiva la terminación por inactividad del gateway para un agente en ejecución — úsalo en investigaciones largas."
  t308: "SCOUT_ENABLE_PROJECT_PLUGINS=1 carga automáticamente los plugins locales del repositorio desde ./.scout/plugins/ — con control de confianza por diseño."
  t309: "SCOUT_DISABLE_FILE_STATE_GUARD=1 desactiva la protección 'el archivo cambió desde que lo leíste' en patch y write_file."
  t310: "SCOUT_ALLOW_PRIVATE_URLS=true permite que las herramientas web accedan a localhost y redes privadas — desactivado por defecto en modo gateway."
  t311: "SCOUT_OPTIONAL_SKILLS=name1,name2 instala automáticamente skills adicionales del catálogo opcional en la primera ejecución de cada perfil."
  t312: "SCOUT_BUNDLED_SKILLS apunta a un árbol personalizado de skills incluidas — lo usan los paquetes de Homebrew y Nix."
  t313: "SCOUT_DUMP_REQUEST_STDOUT=1 vuelca el payload de cada solicitud a la API en stdout en lugar de en archivos de log."
  t314: "SCOUT_OAUTH_TRACE=1 registra, con datos censurados, los intercambios de tokens OAuth y los intentos de renovación para depurar la autenticación del proveedor."
  t315: "SCOUT_STREAM_RETRIES (3 por defecto) controla los intentos de reconexión a mitad de la transmisión ante errores de red transitorios."
  t316: "SCOUT_GATEWAY_BUSY_ACK_ENABLED=false silencia los mensajes de acuse ⚡/⏳/⏩ cuando un usuario escribe a un agente ocupado."
  t317: "SCOUT_AGENT_NOTIFY_INTERVAL (180s por defecto) define cada cuánto el gateway avisa del progreso en turnos largos."
  t318: "SCOUT_RESTART_DRAIN_TIMEOUT (900s por defecto) limita cuánto espera /restart a las ejecuciones en curso antes de forzar el reinicio."
  t319: "SCOUT_CHECKPOINT_TIMEOUT (30s por defecto) limita la creación de puntos de control del sistema de archivos — súbelo en monorepos enormes."
  t320: "image_gen.model en config.yaml elige el modelo de FAL: flux-2/klein, gpt-image-2, nano-banana-pro y más."
  t321: "image_gen.provider enruta la generación de imágenes a través de un plugin (OpenAI Images, Codex, FAL) en lugar del predeterminado."
  t322: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY apuntan el análisis de visión a cualquier endpoint compatible con OpenAI."
  t323: "security.tirith_fail_open: false hace que Scout bloquee los comandos cuando el propio escáner tirith falla."
  t324: "La variable de entorno TIRITH_FAIL_OPEN anula la configuración tirith_fail_open — un interruptor rápido sin editar config.yaml."
  t325: "Los IDs de sesión llevan la marca de tiempo como prefijo (20250305_091523_abcd), así que ordenar con ls y jq funciona de forma natural."
  t326: "API_SERVER_MODEL_NAME personaliza el nombre del modelo en /v1/models — esencial en configuraciones de Open WebUI con varios perfiles."
  t327: "Los plugins del dashboard se sirven desde /dashboard-plugins/<name>/ — copia los archivos en ~/.scout/dashboard-plugins/."
  placeholder:
    p01: "Pregunta lo que quieras, o escribe / para ver los comandos…"
    p02: "Resume el contenido de esta carpeta"
    p03: "Redacta una respuesta al último correo de mi bandeja de entrada"
    p04: "Planifica una función y luego constrúyela paso a paso"
    p05: "Encuentra y corrige una prueba que falla"
    p06: "Investiga este tema y escríbeme un resumen"
    p07: "¿Qué ha cambiado en este repositorio recientemente?"
    p08: "Convierte estas notas en una lista de tareas"
    p09: "Explica este error y cómo solucionarlo"
    p10: "Crea un recordatorio o programa una tarea recurrente"
    p11: "Escribe / para explorar los comandos, o Ctrl+P para la paleta"
