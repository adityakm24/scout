  no_reply_prefix: "⚠️ Нет ответа: "
  empty_response: "{model} в этот раз не дала ответа даже после повторных попыток. Отправьте `continue`, чтобы попробовать ещё раз, или смените модель через /model."
  exit:
    all_retries_exhausted_no_response: "провайдер модели не ответил после всех повторных попыток. Отправьте /retry или смените модель через /model."
    partial_stream_recovery: "потоковый вывод прервался раньше времени, удалось восстановить только часть ответа. Отправьте `continue`, чтобы продолжить с места остановки."
    fallback_prior_turn_content: "в этом ходе не было создано нового содержимого; показан восстановленный предыдущий контекст. Отправьте `continue`, чтобы повторить."
    redirect_restart_limit_exceeded: "запрос отменялся новой корректировкой при каждой попытке, поэтому ход остановлен вместо бесконечных повторов. Ваша последняя корректировка поставлена в очередь как следующее сообщение."
    rebuilt_restart_limit_exceeded: "каждый провайдер в цепочке резервных постоянно переключался на следующий, поэтому ход остановлен вместо бесконечных повторов. Отправьте `continue` или смените провайдера."
    budget_exhausted: "бюджет итераций/стоимости на ход исчерпан до получения окончательного ответа. Отправьте `continue`, чтобы продолжить."
    ollama_runtime_context_too_small: "окно контекста локальной модели оказалось слишком маленьким, чтобы завершить работу. Увеличьте размер контекста или используйте более крупную модель."
    pending_tool_result: "ход остановлен, пока результат инструмента ещё ожидался, а модель не выдала продолжения. Отправьте `continue`, чтобы она подвела итог."
    interrupted_during_api_call: "запрос был прерван во время вызова до получения ответа. Отправьте `continue`, чтобы повторить."
    max_iterations_reached: "достигнут лимит итераций инструментов до получения окончательного ответа. Отправьте `continue`, чтобы продолжить, или увеличьте `max_iterations`."
    error_near_max_iterations: "возникла ошибка вблизи лимита итераций до получения окончательного ответа. Проверьте вывод инструмента выше, затем отправьте `continue`."
    repeated_outer_errors: "ход раз за разом завершался ошибками и был остановлен досрочно вместо бесконечных повторов. Проверьте ошибки выше, затем отправьте `continue`, чтобы повторить."
  persistence:
    compression: "ход остановлен, потому что другой процесс сжимал этот сеанс. Ваше сообщение уже должно быть сохранено — отправьте его ещё раз после завершения сжатия."
    compression_closed: "ход остановлен, потому что этот сеанс был ротирован сжатием контекста, а его живое продолжение не удалось подхватить. Само хранилище в порядке — обновите клиент (или начните новый ход), чтобы он подхватил новый id сеанса, затем отправьте сообщение ещё раз."
    turn_lease: "ход остановлен, потому что другой процесс Scout перехватил этот сеанс. Ваш ответ не был сохранён — дождитесь завершения другого процесса, затем отправьте сообщение ещё раз."
    session_row_missing: "этот сеанс был удалён из хранилища, пока чат был ещё открыт, и Scout не смог его пересоздать, поэтому это сообщение не сохранено. Отправьте сообщение ещё раз; если ошибка повторяется, запустите `scout {profile_arg}doctor`."
    locked: "ход остановлен, потому что хранилище сеансов было занято (другой процесс Scout записывал в базу состояния). Ваше сообщение уже должно быть сохранено — отправьте его ещё раз чуть позже."
    replaced: "файл базы данных сеансов был заменён во время работы Scout, поэтому это сообщение не сохранено (копия хранится в {home}/sessions/). Остановите Scout (`scout {profile_arg}gateway stop`), запустите `scout {profile_arg}doctor` — не `scout {profile_arg}doctor --fix`, который починил бы не тот файл на месте, — затем запустите снова и отправьте сообщение ещё раз. Подробные шаги восстановления есть в логе."
    deleted_wal: "другой процесс Scout всё ещё держит старую копию журнала упреждающей записи базы сеансов, поэтому Scout прекратил запись ради сохранности файла, и это сообщение не сохранено (копия хранится в {home}/sessions/). Ничего не потеряно. Закройте все процессы Scout этого профиля (приложение Desktop, `scout {profile_arg}gateway stop`, панель управления, cron), запустите `scout {profile_arg}doctor` — он назовёт процесс, который ещё держит журнал, — затем запустите Scout снова и отправьте сообщение ещё раз. Не запускайте `doctor --fix` и не удаляйте файлы state.db, пока они работают. Руководство: {recovery_docs}"
    corrupt: "ход остановлен, потому что база состояния сообщила о структурном повреждении (транскрипт был бы утерян при перезапуске). Освобождение места на диске не поможет. Варианты восстановления:\n1. Запустите `scout {profile_arg}doctor --fix`\n2. Остановите шлюз, затем восстановите командой:\n   scout {profile_arg}sessions recover --source {db_path} --inspect-only\n   (если она сообщает, что восстановление возможно) scout {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — восстановление сначала делает снимок повреждённого файла; НЕ запускайте `sqlite3 ... \".recover\"` на живом state.db: уязвимая версия sqlite3 CLI может повредить его ещё сильнее\n3. Восстановите из резервной копии в {backups_dir}/\nЗатем отправьте сообщение ещё раз."
    fts_index: "ход остановлен, потому что индекс поиска по сеансам (FTS5) повреждён и его не удалось отключить, поэтому это сообщение не сохранено. Само хранилище сообщений не повреждено: не запускайте инструменты восстановления и не откатывайтесь на резервную копию. Запустите `scout {profile_arg}doctor --fix` (или перезапустите Scout — индекс восстанавливается при открытии), затем отправьте сообщение ещё раз."
    disk: "Scout не смог сохранить этот разговор на диск и остановился, чтобы не потерять ваши сообщения. Скорее всего, диск переполнен: освободите место (или исправьте права доступа к {home}/state.db), затем отправьте сообщение ещё раз."
    default: "Scout не смог сохранить этот разговор и остановился, чтобы не потерять ваши сообщения. Возможные причины: на диске закончилось место или базу данных держит другой процесс Scout. Закройте другие окна Scout, запустите `scout {profile_arg}doctor` для проверки хранилища, затем отправьте сообщение ещё раз."
  file_mutation:
    header: "⚠️ Проверка изменений файлов: {count} правок файлов в этом ходе НЕ УДАЛИСЬ, что бы ни говорилось в тексте выше. Запустите `git status` или `read_file`, чтобы проверить, что реально применилось."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "не удалось"
  shared:
    and_more: "  • … и ещё {count}"
    the_model: "Модель"
tips:
  t001: "/bg <промпт> запускает задачу в отдельном сеансе, не занимая текущий; /btw <вопрос> отвечает на побочный вопрос об этом разговоре, не прерывая его."
  t002: "/branch создаёт ответвление текущего сеанса, чтобы попробовать другое направление, не теряя прогресс."
  t003: "/compress вручную сжимает контекст разговора, когда он становится слишком длинным."
  t004: "/rollback показывает контрольные точки файловой системы — верните файлы, изменённые агентом, к любому прежнему состоянию."
  t005: "/rollback diff 2 показывает, что изменилось с контрольной точки 2, ничего не восстанавливая."
  t006: "/rollback 2 src/file.py восстанавливает один файл из указанной контрольной точки."
  t007: "/title \"мой проект\" даёт сеансу имя — потом его можно возобновить через /resume или scout -c."
  t008: "/resume продолжает ранее названный сеанс с того места, где вы остановились."
  t009: "/queue <промпт> ставит сообщение в очередь на следующий ход, не прерывая текущий."
  t010: "/undo убирает из разговора последний обмен репликами пользователя и ассистента."
  t011: "/retry заново отправляет ваше последнее сообщение — полезно, когда ответ агента получился не совсем тем."
  t012: "/verbose переключает режим отображения хода инструментов по кругу: off → new → all → verbose."
  t013: "/reasoning high увеличивает глубину размышлений модели. /reasoning show показывает сами рассуждения."
  t014: "/fast включает и выключает приоритетную обработку для более быстрых ответов API (зависит от провайдера)."
  t015: "/yolo отключает все запросы одобрения опасных команд до конца сеанса."
  t016: "/model позволяет сменить модель прямо в сеансе — попробуйте /model sonnet или /model gpt-5."
  t017: "/model --global навсегда меняет вашу модель по умолчанию."
  t018: "/personality pirate задаёт забавную личность — 14 встроенных вариантов, от kawaii до shakespeare."
  t019: "/tools disable browser временно убирает инструменты браузера на текущий сеанс."
  t020: "/browser connect подключает инструменты браузера к вашему запущенному браузеру семейства Chromium через CDP."
  t021: "/plugins показывает установленные плагины и их состояние."
  t022: "/reload-mcp перезагружает конфигурацию MCP-серверов на лету, без перезапуска."
  t023: "/usage показывает расход токенов, разбивку стоимости и длительность сеанса."
  t024: "/insights показывает аналитику использования за последние 30 дней."
  t025: "/paste ищет в буфере обмена изображение и прикрепляет его к вашему следующему сообщению."
  t026: "/profile показывает, какой профиль активен, и его домашний каталог."
  t027: "/config показывает вашу текущую конфигурацию одним взглядом."
  t028: "/stop завершает все фоновые процессы, запущенные агентом."
  t029: "@file:path/to/file.py вставляет содержимое файла прямо в ваше сообщение."
  t030: "@file:main.py:10-50 вставляет только строки 10–50 файла."
  t031: "@folder:src/ вставляет дерево каталога."
  t032: "@diff вставляет в сообщение ваши непроиндексированные изменения git."
  t033: "@staged вставляет ваши проиндексированные изменения git (git diff --staged)."
  t034: "@git:5 вставляет последние 5 коммитов с полными патчами."
  t035: "@url:https://example.com загружает веб-страницу и вставляет её содержимое."
  t036: "Ввод @ включает автодополнение путей файловой системы — переходите к любому файлу интерактивно."
  t037: "Комбинируйте несколько ссылок: \"Проверь @file:main.py и @file:test.py на согласованность.\""
  t038: "Введите новое сообщение, пока агент работает, чтобы прервать его и перенаправить."
  t039: "При вставке 5+ строк текст автоматически сохраняется в файл, а в поле ввода подставляется компактная ссылка на него."
  t040: "scout -c возобновляет последний CLI-сеанс. scout -c \"project name\" возобновляет сеанс по названию."
  t041: "scout -w создаёт изолированный git worktree — идеально для параллельной работы нескольких агентов."
  t042: "scout -p work chat запускает Scout под указанным профилем, не меняя профиль по умолчанию."
  t043: "scout doctor --fix диагностирует и автоматически исправляет проблемы с конфигурацией и зависимостями."
  t044: "scout dump выводит компактную сводку по вашей установке — удобно для отчётов об ошибках."
  t045: "scout config set KEY VALUE автоматически записывает секреты в .env, а всё остальное — в config.yaml."
  t046: "scout config edit открывает config.yaml в вашем редакторе по умолчанию."
  t047: "scout config check ищет отсутствующие или устаревшие параметры конфигурации."
  t048: "scout sessions browse открывает интерактивный выбор сеанса с поиском."
  t049: "scout sessions stats показывает число сеансов по платформам и размер базы данных."
  t050: "scout sessions prune --older-than 30 удаляет старые сеансы."
  t051: "scout skills search react --source skills-sh ищет в публичном каталоге skills.sh."
  t052: "scout skills check проверяет установленные из хаба навыки на наличие обновлений."
  t053: "scout skills tap add myorg/skills-repo добавляет собственный источник навыков на GitHub."
  t054: "scout skills snapshot export setup.json экспортирует конфигурацию навыков для резервной копии или обмена."
  t055: "scout mcp add github --command npx добавляет MCP-серверы из командной строки."
  t056: "scout mcp serve запускает сам Scout как MCP-сервер для других агентов."
  t057: "scout auth add позволяет добавить несколько API-ключей для ротации пула учётных данных."
  t058: "scout logs -f показывает agent.log в реальном времени. --level WARNING --since 1h фильтрует вывод."
  t059: "scout backup создаёт zip-архив со всем домашним каталогом Scout."
  t060: "scout profile create coder создаёт изолированный профиль, который становится отдельной командой."
  t061: "scout profile create work --clone копирует текущую конфигурацию и ключи в новый профиль."
  t062: "scout update автоматически синхронизирует новые встроенные навыки во ВСЕ профили."
  t063: "scout gateway install настраивает Scout как системную службу (systemd/launchd)."
  t064: "scout memory setup позволяет настроить внешний провайдер памяти (Honcho, Mem0 и др.)."
  t065: "scout webhook subscribe создаёт событийные webhook-маршруты с проверкой HMAC."
  t066: "Экономьте: scout tools отключает неиспользуемые инструменты, scout skills config сокращает набор навыков."
  t067: "/reasoning low или /reasoning minimal уменьшает глубину размышлений ниже уровня по умолчанию (medium) — ответы быстрее и дешевле."
  t068: "scout models направляет зрение, сжатие и вспомогательные задачи на более дешёвые модели — сокращает фоновый расход токенов на 85%+ без понижения основной модели чата."
  t069: "Задайте display.bell_on_complete: true в config.yaml, чтобы слышать сигнал по завершении долгих задач."
  t070: "Задайте display.streaming: true, чтобы видеть токены в реальном времени по мере генерации."
  t071: "Задайте display.show_reasoning: true, чтобы наблюдать цепочку рассуждений модели."
  t072: "Задайте display.compact: true, чтобы убрать лишние пустые строки и уплотнить вывод."
  t073: "Задайте display.busy_input_mode: queue, чтобы ставить сообщения в очередь вместо прерывания агента, или steer, чтобы вставлять их по ходу работы через /steer."
  t074: "Задайте display.resume_display: minimal, чтобы не выводить полный пересказ разговора при возобновлении сеанса."
  t075: "Задайте compression.threshold: 0.50, чтобы управлять моментом срабатывания автосжатия (по умолчанию: 50% контекста)."
  t076: "Задайте agent.max_turns: 1000, чтобы позволить агенту делать больше шагов с вызовами инструментов за ход."
  t077: "Задайте file_read_max_chars: 200000, чтобы увеличить максимальный объём содержимого на один вызов read_file."
  t078: "Задайте approvals.mode: smart, чтобы LLM автоматически одобряла безопасные команды и отклоняла опасные."
  t079: "Задайте fallback_model в config.yaml, чтобы автоматически переключаться на резервного провайдера."
  t080: "Задайте privacy.redact_pii: true, чтобы хэшировать ID пользователей и номера телефонов перед отправкой в LLM."
  t081: "Задайте browser.record_sessions: true, чтобы автоматически записывать сеансы браузера в видео WebM."
  t082: "Задайте worktree: true в config.yaml, чтобы всегда создавать git worktree (то же, что scout -w)."
  t083: "Задайте security.website_blocklist.enabled: true, чтобы заблокировать определённые домены для веб-инструментов."
  t084: "Задайте cron.wrap_response: false, чтобы доставлять чистый вывод агента без заголовка и подвала cron."
  t085: "SCOUT_TIMEZONE переопределяет часовой пояс сервера любым идентификатором часового пояса IANA."
  t086: "В config.yaml работает подстановка переменных окружения: используйте синтаксис ${VAR_NAME}."
  t087: "Быстрые команды в config.yaml мгновенно выполняют команды оболочки без расхода токенов."
  t088: "Собственные личности можно описать в config.yaml в разделе agent.personalities."
  t089: "provider_routing управляет сортировкой, белым и чёрным списками провайдеров OpenRouter."
  t090: "execute_code запускает Python-скрипты, программно вызывающие инструменты Scout, — результаты не попадают в контекст."
  t091: "delegate_task по умолчанию запускает до 10 параллельных подагентов (delegation.max_concurrent_children) с изолированными контекстами для параллельной работы."
  t092: "web_extract работает с URL PDF-файлов — передайте любую ссылку на PDF, и он преобразует его в markdown."
  t093: "search_files работает на ripgrep и быстрее grep — используйте его вместо grep в терминале."
  t094: "patch использует 9 стратегий нечёткого сопоставления, поэтому небольшие различия в пробелах не ломают правки."
  t095: "patch поддерживает формат V4A для массовых правок нескольких файлов одним вызовом."
  t096: "read_file предлагает похожие имена файлов, если файл не найден."
  t097: "read_file автоматически устраняет дубли — повторное чтение неизменённого файла возвращает лёгкую заглушку."
  t098: "browser_vision делает снимок экрана и анализирует его с помощью ИИ — работает для CAPTCHA и визуального контента."
  t099: "browser_console может вычислять выражения JavaScript в контексте страницы."
  t100: "image_generate создаёт изображения с помощью FLUX 2 Pro и автоматически увеличивает их в 2 раза."
  t101: "Инструмент todo помогает агенту отслеживать сложные многошаговые задачи в течение сеанса."
  t102: "session_search выполняет полнотекстовый поиск по ВСЕМ прошлым разговорам."
  t103: "Агент автоматически сохраняет в память предпочтения, исправления и факты об окружении."
  t104: "/moa прогоняет один сложный промпт через настроенный вами набор моделей Mixture of Agents."
  t105: "Команды терминала поддерживают фоновый режим с notify_on_complete для долгих задач."
  t106: "Фоновые процессы терминала поддерживают watch_patterns для оповещения о нужных строках вывода."
  t107: "Инструмент terminal поддерживает 6 бэкендов: local, Docker, SSH, Modal, Daytona и Singularity."
  t108: "У каждого профиля свои конфигурация, API-ключи, память, сеансы, навыки и cron-задачи."
  t109: "Имена профилей становятся командами оболочки — 'scout profile create coder' создаёт команду 'coder'."
  t110: "scout profile export coder -o backup.tar.gz создаёт переносимый архив профиля."
  t111: "Сеансы автоматически получают осмысленные названия после первого обмена сообщениями — называть их вручную не нужно."
  t112: "Названия сеансов поддерживают преемственность: \"my project\" → \"my project #2\" → \"my project #3\"."
  t113: "При выходе Scout выводит команду для возобновления с ID сеанса и статистикой."
  t114: "scout sessions export backup.jsonl экспортирует все сеансы для резервной копии или анализа."
  t115: "scout -r SESSION_ID возобновляет любой прошлый сеанс по его ID."
  t116: "Память — это замороженный снимок: изменения попадают в системный промпт только при следующем запуске сеанса."
  t117: "Записи памяти автоматически проверяются на признаки промпт-инъекций и утечки данных."
  t118: "У агента два хранилища памяти: личные заметки (~2200 символов) и профиль пользователя (~1375 символов)."
  t119: "Поправки, которые вы даёте агенту (\"нет, сделай вот так\"), часто автоматически сохраняются в память."
  t120: "Более 80 встроенных навыков: github, creative, mlops, productivity, research и другие."
  t121: "Каждый установленный навык автоматически становится слеш-командой — введите /, чтобы увидеть их все."
  t122: "scout skills install official/security/1password устанавливает дополнительные навыки из репозитория."
  t123: "Навыки могут быть ограничены определёнными ОС — некоторые загружаются только на macOS или Linux."
  t124: "skills.external_dirs в config.yaml позволяет загружать навыки из своих каталогов."
  t125: "Агент может создавать собственные навыки как процедурную память с помощью skill_manage."
  t126: "/plan записывает план реализации в markdown в .scout/plans/, ничего не выполняя."
  t127: "К cron-задачам можно прикреплять навыки: scout cron add --skill blogwatcher \"Check for new posts\"."
  t128: "Если ответ cron-задачи начинается с [SILENT], доставка подавляется — удобно для задач чистого мониторинга."
  t129: "Cron поддерживает относительные задержки (30m), интервалы (every 2h), cron-выражения и ISO-метки времени."
  t130: "Cron-задачи выполняются в полностью новых сеансах агента — промпты должны быть самодостаточными."
  t131: "Голосовой режим работает без единого API-ключа, если установлен faster-whisper (бесплатное локальное распознавание речи)."
  t132: "Доступно пять TTS-провайдеров: Edge TTS (бесплатно), ElevenLabs, OpenAI, NeuTTS (бесплатно, локально), MiniMax."
  t133: "Потоковый TTS озвучивает предложения по мере их генерации — не нужно ждать полного ответа."
  t134: "scout gateway install настраивает шлюз как системную службу, запускающуюся при загрузке."
  t135: "Маршруты вебхуков поддерживают проверку HMAC, ограничение частоты запросов и фильтрацию событий."
  t136: "API-сервер предоставляет OpenAI-совместимую конечную точку, работающую с Open WebUI и LibreChat."
  t137: "group_sessions_per_user: true даёт каждому участнику группового чата собственный сеанс."
  t138: "Шлюз поддерживает тайм-ауты по бездействию — активные агенты могут работать сколь угодно долго."
  t139: "Одобрение опасных команд имеет 4 уровня: однократно, на сеанс, всегда (постоянный allowlist), отклонить."
  t140: "Умный режим одобрения использует LLM, чтобы автоматически одобрять безопасные команды и помечать опасные."
  t141: "Защита от SSRF блокирует приватные сети, loopback, link-local и адреса облачных метаданных."
  t142: "Предварительное сканирование Tirith выявляет подмену URL омоглифами и конструкции вида «pipe в интерпретатор»."
  t143: "Подпроцессы MCP получают отфильтрованное окружение — передаются только безопасные системные переменные."
  t144: "Файлы контекста (.scout.md, AGENTS.md) перед загрузкой проверяются на промпт-инъекции."
  t145: "command_allowlist в config.yaml навсегда одобряет указанные шаблоны shell-команд."
  t146: "Контекст автоматически сжимается при достижении порога — память сбрасывается в хранилище, а история сводится в сводку."
  t147: "По мере заполнения контекста строка состояния становится жёлтой, затем оранжевой, затем красной."
  t148: "SOUL.md — основной файл идентичности агента; отредактируйте его, чтобы задать поведение."
  t149: "Scout загружает контекст проекта из .scout.md, AGENTS.md, CLAUDE.md или .cursorrules (первый найденный)."
  t150: "Файлы AGENTS.md в подкаталогах обнаруживаются постепенно, по мере того как агент переходит в папки."
  t151: "Файлы контекста ограничены 20 000 символами с умной обрезкой начала и конца."
  t152: "Пять браузерных провайдеров: локальный Chromium, Browserbase, Browser Use, Camofox и Firecrawl."
  t153: "Camofox — браузер с защитой от обнаружения: форк Firefox с подменой отпечатка на C++."
  t154: "browser_navigate автоматически возвращает снимок страницы — вызывать browser_snapshot после него не нужно."
  t155: "browser_vision с annotate=true накладывает нумерованные метки на интерактивные элементы."
  t156: "scout mcp открывает интерактивный выбор одобренных SpaceshipResearch MCP-серверов, которые устанавливаются одним нажатием."
  t157: "scout mcp catalog выводит список одобренных SpaceshipResearch MCP-серверов, поставляемых с репозиторием."
  t158: "scout mcp install <name> устанавливает запись из каталога, запрашивает учётные данные и позволяет выбрать, какие из его инструментов включить."
  t159: "MCP-серверы настраиваются в config.yaml — поддерживаются транспорты stdio и HTTP."
  t160: "Фильтрация инструментов для каждого сервера: tools.include разрешает, а tools.exclude запрещает конкретные инструменты."
  t161: "MCP-серверы автоматически создают наборы инструментов во время работы — scout tools может включать их для каждой платформы отдельно."
  t162: "Поддержка OAuth в MCP: auth: oauth включает авторизацию через браузер с PKCE."
  t163: "Контрольные точки не создают накладных расходов, пока файлы не изменяются — включены по умолчанию."
  t164: "Снимок перед откатом сохраняется автоматически, так что вы можете отменить саму отмену."
  t165: "/rollback также отменяет ход разговора, поэтому агент не помнит откаченных изменений."
  t166: "Контрольные точки используют теневые репозитории в ~/.scout/checkpoints/ — .git вашего проекта не затрагивается."
  t167: "batch_runner.py параллельно обрабатывает сотни промптов для генерации обучающих данных."
  t168: "Сохранение траекторий (--save-trajectories) записывает полные трассы использования инструментов для обучения моделей."
  t169: "Три типа плагинов: общие (инструменты/хуки), провайдеры памяти и движки контекста."
  t170: "scout plugins install owner/repo устанавливает плагины напрямую с GitHub."
  t171: "Внешние провайдеры памяти: Honcho, OpenViking, Mem0 встроены; Hindsight и другие — через scout plugins install."
  t172: "Хуки плагинов включают pre/post_tool_call, pre/post_llm_call и transform_terminal_output для нормализации вывода."
  t173: "Кэширование промптов (Anthropic) снижает стоимость за счёт повторного использования кэшированных префиксов системного промпта."
  t174: "Агент генерирует названия сеансов в фоновом потоке — без влияния на задержку."
  t175: "Умная маршрутизация моделей может автоматически направлять простые запросы более дешёвой модели."
  t176: "Слеш-команды поддерживают сопоставление по префиксу: /h раскрывается в /help, /mod — в /model."
  t177: "Перетаскивание пути к файлу в терминал автоматически прикрепляет изображения или отправляет файл как контекст."
  t178: ".worktreeinclude в корне репозитория перечисляет игнорируемые git файлы, которые нужно копировать в worktree."
  t179: "scout acp запускает Scout как ACP-сервер для интеграции с VS Code, Zed и JetBrains."
  t180: "Пользовательские провайдеры: сохраняйте именованные конечные точки в config.yaml в разделе custom_providers."
  t181: "SCOUT_EPHEMERAL_SYSTEM_PROMPT внедряет системный промпт, который никогда не сохраняется в историю."
  t182: "credential_pool_strategies поддерживает ротацию fill_first, round_robin, least_used и random."
  t183: "scout auth add anthropic или scout auth add openai-codex настраивает провайдеров на основе OAuth."
  t184: "API-сервер поддерживает и Chat Completions, и Responses API с состоянием на стороне сервера."
  t185: "tool_preview_length: 0 в конфигурации показывает полные пути к файлам в ленте активности спиннера."
  t186: "scout status --deep выполняет углублённые диагностические проверки всех компонентов."
  t187: "К cron-задаче можно прикрепить Python-скрипт (--script), чей stdout внедряется в промпт как контекст."
  t188: "Cron-скрипты лежат в ~/.scout/scripts/ и выполняются до запуска агента — идеально для конвейеров сбора данных."
  t189: "prefill_messages_file в config.yaml внедряет few-shot-примеры в каждый вызов API, не сохраняя их в историю."
  t190: "SOUL.md полностью заменяет стандартную идентичность агента — перепишите его, чтобы сделать Scout своим."
  t191: "SOUL.md при первом запуске автоматически заполняется личностью по умолчанию. Отредактируйте его под себя."
  t192: "/compress <тема> отводит 60–70% бюджета сводки вашей теме и агрессивно сокращает всё остальное."
  t193: "При втором и последующих сжатиях компрессор обновляет предыдущую сводку, а не начинает с нуля."
  t194: "Перед сбросом сеанса шлюза Scout в фоне автоматически сохраняет важные факты в память."
  t195: "network.force_ipv4: true в config.yaml устраняет зависания на серверах со сломанным IPv6 — патчит socket на лету."
  t196: "Инструмент terminal поясняет распространённые коды выхода: grep, вернувший 1, = «Совпадений не найдено (не ошибка)»."
  t197: "Неудавшиеся команды терминала в переднем плане автоматически повторяются до 3 раз с экспоненциальной задержкой (2с, 4с, 8с)."
  t198: "Команды sudo без пароля автоматически переписываются так, чтобы передавать SUDO_PASSWORD из .env — интерактивный запрос не нужен."
  t199: "Хелперы execute_code требуют явного импорта: from scout_tools import json_parse, shell_quote, retry."
  t200: "7 sandbox-инструментов execute_code (web_search, terminal, read/write/search/patch) работают через RPC — их вывод никогда не попадает в контекст."
  t201: "Чтение одной и той же области файла 3+ раз вызывает предупреждение. При 4+ оно жёстко блокируется, чтобы предотвратить зацикливание."
  t202: "write_file и patch определяют, был ли файл изменён извне после последнего чтения, и предупреждают об устаревших данных."
  t203: "Формат патчей V4A поддерживает директивы Add File, Delete File и Move File — не только Update."
  t204: "MCP-серверы могут запрашивать у LLM ответы через sampling — агент сам становится инструментом для сервера."
  t205: "MCP-серверы отправляют notifications/tools/list_changed, чтобы инструменты перерегистрировались автоматически без перезапуска."
  t206: "delegate_task с acp_command: 'claude' запускает Claude Code как дочернего агента с любой платформы."
  t207: "У делегирования есть heartbeat-поток — активность дочернего агента передаётся родителю и предотвращает тайм-ауты шлюза."
  t208: "Если провайдер возвращает HTTP 402 (требуется оплата), вспомогательный клиент автоматически переключается на следующего."
  t209: "agent.tool_use_enforcement подталкивает модели, которые описывают действия вместо вызова инструментов — для GPT/Codex включается автоматически."
  t210: "agent.restart_after_turn_timeout даёт текущим ходам завершиться до того, как /restart вызовет stop(); restart_drain_timeout — лишь лимит принудительного прерывания после начала stop()."
  t211: "agent.api_max_retries (по умолчанию 3) задаёт, сколько раз агент повторяет неудавшийся вызов API перед показом ошибки — уменьшите для быстрого переключения на резерв."
  t212: "Шлюз кэширует экземпляры AIAgent по сеансам — сброс этого кэша ломает кэширование промптов Anthropic."
  t213: "Любой сайт может публиковать навыки через /.well-known/skills/index.json — хаб навыков находит их автоматически."
  t214: "Журнал аудита навыков в ~/.scout/skills/.hub/audit.log фиксирует каждую установку и удаление."
  t215: "Устаревшие git worktree очищаются при запуске автоматически: чистые, полностью слитые деревья удаляются; незакоммиченная или неотправленная работа всегда сохраняется."
  t216: "Профили изолируют состояние Scout через SCOUT_HOME; подпроцессы инструментов на хосте сохраняют ваш настоящий HOME, если terminal.home_mode не равен profile."
  t217: "Переменная окружения SCOUT_HOME_MODE (восьмеричная, например 0701) задаёт свои права на каталог для обхода веб-сервером."
  t218: "Контейнерный режим: положите .container-mode в SCOUT_HOME — и CLI на хосте автоматически выполнится внутри контейнера."
  t219: "Каждое прерывание во время работы агента записывается в ~/.scout/interrupt_debug.log с отметками времени."
  t220: "BROWSER_CDP_URL подключает браузерные инструменты к любому запущенному браузеру семейства Chromium — принимает WebSocket, HTTP или host:port."
  t221: "BROWSERBASE_ADVANCED_STEALTH=true включает продвинутую защиту от обнаружения с кастомным Chromium (тариф Scale)."
  t222: "CLI автоматически переключается в компактный режим в терминалах уже 80 столбцов."
  t223: "Быстрые команды бывают двух типов: exec (напрямую выполняет shell-команду) и alias (перенаправляет на другую команду)."
  t224: "Отдельная модель для делегирования: delegation.model и delegation.provider в конфигурации направляют подагентов на более дешёвые модели."
  t225: "delegation.reasoning_effort независимо управляет глубиной размышления подагентов."
  t226: "human_delay.mode в конфигурации имитирует скорость человеческого набора — диапазон настраивается через min_ms/max_ms."
  t227: "Миграции версий конфигурации выполняются автоматически при загрузке — новые ключи появляются без ручного вмешательства."
  t228: "Модели GPT и Codex получают специальные указания в системном промпте о дисциплине и обязательном использовании инструментов."
  t229: "Модели Gemini получают отдельные директивы об абсолютных путях, параллельных вызовах инструментов и неинтерактивных командах."
  t230: "context.engine в config.yaml можно задать именем плагина, чтобы использовать альтернативную стратегию управления контекстом."
  t231: "Снимки страниц браузера длиннее 15 000 символов обрезаются или автоматически суммируются; полный снимок сохраняется в cache/web для постраничного чтения через read_file."
  t232: "Компрессор делает дешёвый предварительный проход: выводы инструментов длиннее 200 символов заменяются заглушками ещё до запуска LLM."
  t233: "Если сжатие не удалось, следующие попытки приостанавливаются на 10 минут, чтобы не заваливать API запросами."
  t234: "Для длинных опасных команд (>70 символов) в запросе одобрения появляется вариант 'view' — можно сначала посмотреть полный текст."
  t235: "Визуализация уровня звука показывает полоски ▁▂▃▄▅▆▇ во время голосовой записи на основе RMS-уровня микрофона."
  t236: "Имена профилей не могут совпадать с бинарниками в PATH — 'scout profile create ls' будет отклонено."
  t237: "scout profile create backup --clone-all копирует всё (конфигурацию, ключи, SOUL.md, память, навыки, сеансы)."
  t238: "Файлы .cursorrules и .cursor/rules/*.mdc обнаруживаются автоматически и загружаются как контекст проекта."
  t239: "Контекстные файлы проверяются на 10+ шаблонов инъекций в промпт — невидимый Unicode, 'ignore instructions', попытки утечки данных."
  t240: "GPT-5 и Codex используют в формате сообщений роль 'developer' вместо 'system'."
  t241: "Вспомогательные переопределения по задачам: auxiliary.vision.provider, auxiliary.compression.model и т. д. в config.yaml."
  t242: "Вспомогательный клиент считает 'main' псевдонимом провайдера — он разворачивается в ваш реальный основной провайдер и модель."
  t243: "scout claw migrate --dry-run показывает, как пройдёт миграция из OpenClaw, ничего не записывая."
  t244: "Пути к файлам, вставленные с кавычками или экранированными пробелами, обрабатываются автоматически — чистить вручную не нужно."
  t245: "Слеш-команды никогда не сворачиваются как большая вставка — /команда с объёмными аргументами работает корректно."
  t246: "В режиме прерывания слеш-команды, введённые во время работы агента, обходят логику прерывания и выполняются сразу."
  t247: "SCOUT_DEV=1 отключает определение контейнерного режима для локальной разработки."
  t248: "Каждый MCP-сервер получает свой набор инструментов (mcp-servername), который можно включать и выключать отдельно через scout tools."
  t249: "Плейсхолдеры MCP ${ENV_VAR} в конфигурации подставляются при запуске сервера — включая переменные из ~/.scout/.env."
  t250: "Навыки из доверенных репозиториев (SpaceshipResearch) получают уровень безопасности 'trusted'; навыки сообщества проходят дополнительное сканирование."
  t251: "Карантин навыков в ~/.scout/skills/.hub/quarantine/ хранит навыки, ожидающие проверки безопасности."
  t252: "/steer <промпт> вставляет заметку после следующего вызова инструмента — корректируйте направление посреди задачи без прерывания."
  t253: "/goal <текст> задаёт постоянную цель Ralph-цикла — Scout продолжает ход за ходом, пока судья не скажет, что готово."
  t254: "/snapshot create [метка] сохраняет полный снимок состояния конфигурации Scout; /snapshot restore <id> позже его возвращает."
  t255: "/copy [N] копирует последний ответ ассистента в буфер обмена, а с числом — N-й ответ с конца."
  t256: "/redraw принудительно перерисовывает весь интерфейс, исправляя сбои терминала после изменения размера tmux или артефактов выделения мышью."
  t257: "/agents (псевдоним /tasks) показывает активных агентов и запущенные фоновые задачи в текущем сеансе."
  t258: "/footer переключает нижний колонтитул шлюза в финальных ответах с моделью, % контекста и cwd."
  t259: "/busy queue|steer|interrupt определяет, что делает нажатие Enter, пока Scout работает."
  t260: "/approve session|always выполняет ожидающую опасную команду с выбранным вами уровнем доверия; /deny отклоняет её."
  t261: "/restart аккуратно перезапускает шлюз после завершения активных запусков, а затем уведомляет запросившего, когда всё снова работает."
  t262: "/kanban boards switch <slug> меняет активную многопроектную доску Kanban прямо из чата."
  t263: "/reload перечитывает ~/.scout/.env в работающем сеансе — подхватывайте новые API-ключи без перезапуска."
  t264: "cronjob с no_agent=True запускает скрипт по расписанию и отправляет его stdout напрямую — ноль токенов, ноль LLM."
  t265: "Пустой stdout cron-скрипта означает тихий тик — ничего не доставляется, идеально для сторожевых проверок порогов."
  t266: "SCOUT_CRON_MAX_PARALLEL (по умолчанию 4) ограничивает число cron-задач за тик, чтобы всплески не перегружали ваши ключи."
  t267: "Хуки шлюза живут в ~/.scout/hooks/<имя>/ с HOOK.yaml и handler.py — обработчик должен называться `handle`."
  t268: "События хуков включают gateway:startup, session:start, agent:step и подписки по маске command:*."
  t269: "Положите чеклист в ~/.scout/BOOT.md — и хук gateway:startup будет выполнять его одноразовым агентом при каждой загрузке."
  t270: "scout curator run --dry-run показывает, что куратор архивировал бы или объединил, ничего не меняя."
  t271: "scout curator pin <навык> жёстко защищает навык и от автоархивации, и от инструмента skill_manage агента."
  t272: "scout curator rollback восстанавливает навыки из снимка перед запуском — резервные копии лежат в skills/.curator_backups/."
  t273: "scout auth reset <провайдер> [цель] сбрасывает задержки и флаги исчерпания для всего пула учётных данных или для одного из них — по индексу, id или метке."
  t274: "credential_pool_strategies.<провайдер>: round_robin перебирает ключи по кругу вместо стратегии fill_first по умолчанию."
  t275: "scout tools выбирает провайдера для каждого инструмента — веб-поиск, изображения, TTS и браузер — каждый с вашим собственным API-ключом."
  t276: "provider_routing.data_collection: deny исключает провайдеров OpenRouter, которые хранят данные."
  t277: "provider_routing.require_parameters: true направляет запросы только к провайдерам, поддерживающим каждый параметр вашего запроса."
  t278: "scout dashboard запускает локальный веб-интерфейс на 127.0.0.1:9119 — данные не покидают localhost."
  t279: "Положите YAML с двумя цветами палитры в ~/.scout/dashboard-themes/ — и вся панель сменит оформление."
  t280: "Плагины панели подключаются простым копированием: manifest.json + JS-бандл в ~/.scout/dashboard-plugins/ — сборка npm не нужна."
  t281: "layoutVariant: cockpit в теме панели добавляет левую полосу шириной 260px, которую плагины могут заполнять через слот sidebar."
  t282: "SCOUT_BACKGROUND_NOTIFICATIONS=result уведомляет только о завершении фоновых задач (в отличие от concise/all/error/off)."
  t283: "SCOUT_WRITE_SAFE_ROOT ограничивает write_file/patch указанными префиксами каталогов; несколько путей — через os.pathsep (: или ;)."
  t284: "SCOUT_IGNORE_RULES отключает автоподстановку AGENTS.md, SOUL.md, .cursorrules, памяти и предзагруженных навыков."
  t285: "SCOUT_ACCEPT_HOOKS автоматически одобряет ещё не виденные shell-хуки из config.yaml без запроса в TTY."
  t286: "auxiliary.goal_judge.model направляет судью /goal на дешёвую быструю модель, чтобы стоимость цикла оставалась почти нулевой."
  t287: "Контрольные точки пропускают каталоги с более чем 50 000 файлов, чтобы избежать медленных git-операций в огромных монорепозиториях."
  t288: "tts.provider: piper запускает локальный TTS на CPU с поддержкой 44 языков — голоса автоматически скачиваются в ~/.scout/cache/piper-voices/."
  t289: "tts.providers.<name>.type: command подключает любой CLI-движок TTS через плейсхолдеры {input_path} и {output_path}."
  t290: "API_SERVER_ENABLED=true поднимает рядом со шлюзом OpenAI-совместимый эндпоинт для Open WebUI и LibreChat."
  t291: "batch_runner.py --resume сопоставляет выполненные промпты по тексту, поэтому перестановка датасета не перезапускает готовую работу."
  t292: "/new начинает новый сеанс на месте (псевдоним /reset) — новый ID сеанса, чистая история, CLI остаётся открытым."
  t293: "/clear очищает экран терминала И начинает новый сеанс — один шаг для визуального сброса."
  t294: "/save записывает текущий разговор на диск, не завершая сеанс."
  t295: "/status показывает сведения о сеансе одним взглядом: ID, название, модель, расход токенов и прошедшее время."
  t296: "/image <путь> прикрепляет локальный файл изображения к вашему следующему промпту без вставки и перетаскивания."
  t297: "/commands выводит постранично полный список слеш-команд и установленных навыков — удобно на платформах без автодополнения по Tab."
  t298: "/toolsets перечисляет все доступные наборы инструментов, чтобы вы знали, что принимает -t/--toolsets."
  t299: "/reload-skills заново сканирует ~/.scout/skills/, чтобы добавленные навыки появились без перезапуска сеанса."
  t300: "/debug загружает бандл поддержки (сведения о системе + логи) и возвращает ссылки, которыми можно поделиться — работает и в чате."
  t301: "scout dump --show-keys включает замаскированные отпечатки API-ключей для более глубокой отладки с поддержкой."
  t302: "scout sessions rename <ID> \"новое название\" переименовывает любой прошлый сеанс; scout sessions delete <ID> удаляет его."
  t303: "scout import восстанавливает полный zip-архив резервной копии Scout; экспорты сеансов в JSON/JSONL импортируются со страницы Sessions в панели управления."
  t304: "scout fallback управляет цепочкой fallback_model интерактивно — без ручного редактирования config.yaml."
  t305: "scout setup проводит новых пользователей через настройку провайдера, ключей и платформ в одном интерактивном сценарии."
  t306: "scout status --deep выполняет полную проверку состояния всех компонентов; обычный scout status — быстрый обзор."
  t307: "SCOUT_AGENT_TIMEOUT=0 отключает завершение работающего агента шлюзом по неактивности — используйте для долгих исследовательских запусков."
  t308: "SCOUT_ENABLE_PROJECT_PLUGINS=1 автоматически загружает локальные плагины репозитория из ./.scout/plugins/ — с обязательной проверкой доверия."
  t309: "SCOUT_DISABLE_FILE_STATE_GUARD=1 отключает защиту «файл изменился с момента чтения» в patch и write_file."
  t310: "SCOUT_ALLOW_PRIVATE_URLS=true разрешает веб-инструментам обращаться к localhost и частным сетям — в режиме шлюза по умолчанию выключено."
  t311: "SCOUT_OPTIONAL_SKILLS=name1,name2 автоматически устанавливает дополнительные навыки из опционального каталога при первом запуске профиля."
  t312: "SCOUT_BUNDLED_SKILLS указывает на собственное дерево встроенных навыков — используется при упаковке для Homebrew и Nix."
  t313: "SCOUT_DUMP_REQUEST_STDOUT=1 выводит содержимое каждого API-запроса в stdout вместо файлов логов."
  t314: "SCOUT_OAUTH_TRACE=1 логирует замаскированные попытки обмена и обновления OAuth-токенов для отладки авторизации у провайдера."
  t315: "SCOUT_STREAM_RETRIES (по умолчанию 3) задаёт число попыток переподключения посреди потока при временных сетевых ошибках."
  t316: "SCOUT_GATEWAY_BUSY_ACK_ENABLED=false отключает подтверждения ⚡/⏳/⏩, когда пользователь пишет занятому агенту."
  t317: "SCOUT_AGENT_NOTIFY_INTERVAL (по умолчанию 180s) задаёт, как часто шлюз сообщает о ходе выполнения на долгих ходах."
  t318: "SCOUT_RESTART_DRAIN_TIMEOUT (по умолчанию 900s) ограничивает, сколько /restart ждёт завершения текущих запусков перед принудительным перезапуском."
  t319: "SCOUT_CHECKPOINT_TIMEOUT (по умолчанию 30s) ограничивает время создания контрольной точки файловой системы — увеличьте на огромных монорепозиториях."
  t320: "image_gen.model в config.yaml выбирает модель FAL: flux-2/klein, gpt-image-2, nano-banana-pro и другие."
  t321: "image_gen.provider направляет генерацию изображений через плагин (OpenAI Images, Codex, FAL) вместо варианта по умолчанию."
  t322: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY направляют анализ изображений на любой OpenAI-совместимый эндпоинт."
  t323: "security.tirith_fail_open: false заставляет Scout блокировать команды, когда сам сканер tirith выдаёт ошибку."
  t324: "Переменная окружения TIRITH_FAIL_OPEN переопределяет настройку tirith_fail_open — быстрый переключатель без правки config.yaml."
  t325: "ID сеансов начинаются с метки времени (20250305_091523_abcd), поэтому они естественно сортируются в ls и jq."
  t326: "API_SERVER_MODEL_NAME задаёт имя модели в /v1/models — незаменимо для многопрофильных установок Open WebUI."
  t327: "Плагины панели управления раздаются из /dashboard-plugins/<name>/ — положите файлы в ~/.scout/dashboard-plugins/."
