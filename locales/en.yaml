explainer:
  # Turn-completion explanations and file-mutation footers (agent/turn_explainers.py). Appended to
  # the human-facing reply after the transcript row is written; the model never sees them.
  no_reply_prefix: "⚠️ No reply: "
  empty_response: "{model} didn't produce a reply this time, even after retries. Send `continue` to try again, or switch models with /model."
  exit:
    all_retries_exhausted_no_response: "the model provider didn't answer after all retries. Send /retry, or switch models with /model."
    partial_stream_recovery: "streaming stopped early and only a partial response was recovered. Send `continue` to resume from where it stopped."
    fallback_prior_turn_content: "no new content was produced this turn; showing recovered prior context. Send `continue` to retry."
    redirect_restart_limit_exceeded: "the request was cancelled by a new correction on every attempt, so the turn stopped instead of retrying forever. Your last correction is queued as the next message."
    rebuilt_restart_limit_exceeded: "every provider in the fallback chain kept failing over, so the turn stopped instead of retrying forever. Send `continue` or switch provider."
    budget_exhausted: "the per-turn iteration/cost budget was exhausted before a final answer. Send `continue` to keep going."
    ollama_runtime_context_too_small: "the local model's context window was too small to finish. Increase the context size or use a larger model."
    pending_tool_result: "the turn stopped while a tool result was still pending and the model produced no follow-up text. Send `continue` to let it summarize."
    interrupted_during_api_call: "the request was interrupted mid-call before a reply was received. Send `continue` to retry."
    max_iterations_reached: "the maximum tool-iteration limit was reached before a final answer. Send `continue` to keep going, or raise `max_iterations`."
    error_near_max_iterations: "an error occurred near the iteration limit before a final answer. Check the tool output above, then send `continue`."
    repeated_outer_errors: "the turn kept failing with repeated errors and was stopped early instead of retrying forever. Check the errors above, then send `continue` to retry."
  persistence:
    compression: "the turn was stopped because another process was compressing this session. Your message should already be saved — please send it again after compression completes."
    compression_closed: "the turn was stopped because this session was rotated by context compression and its live continuation could not be adopted. The storage itself is healthy — refresh the client (or start a new turn) so it picks up the new session id, then send your message again."
    turn_lease: "the turn was stopped because another Scout process took over this session. Your reply was not saved — wait for the other process to finish, then send your message again."
    session_row_missing: "this session was deleted from storage while the chat was still open, and Scout could not recreate it, so this message was not saved. Send your message again; if it keeps failing, run `scout {profile_arg}doctor`."
    locked: "the turn was stopped because session storage was busy (another Scout process was writing to the state database). Your message should already be saved — please send it again in a moment."
    replaced: "the session database file was replaced while Scout was running, so this message was not saved (a copy is kept in {home}/sessions/). Stop Scout (`scout {profile_arg}gateway stop`), run `scout {profile_arg}doctor` — not `scout {profile_arg}doctor --fix`, which would repair the wrong file in place — then start it again and send your message once more. Advanced recovery steps are in the log."
    deleted_wal: "another Scout process still holds an old copy of the session database's write-ahead log, so Scout stopped writing to keep the file safe and this message was not saved (a copy is kept in {home}/sessions/). Nothing is lost. Quit every Scout process on this profile (Desktop app, `scout {profile_arg}gateway stop`, dashboard, cron), run `scout {profile_arg}doctor` — it names any process still holding the log — then start Scout again and send your message once more. Do not run `doctor --fix` or delete any state.db files while they run. Guide: {recovery_docs}"
    corrupt: "the turn was stopped because the state database reported structural corruption (the transcript would have been lost on restart). Freeing disk space will not help. Recovery options:\n1. Run `scout {profile_arg}doctor --fix`\n2. Stop the gateway, then recover with:\n   scout {profile_arg}sessions recover --source {db_path} --inspect-only\n   (if it reports recoverable) scout {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — recovery snapshots the damaged file first; do NOT run `sqlite3 ... \".recover\"` against the live state.db, a vulnerable sqlite3 CLI can corrupt it further\n3. Restore from a backup in {backups_dir}/\nThen send your message again."
    fts_index: "the turn was stopped because the session search index (FTS5) is corrupt and could not be detached, so this message was not saved. The message store itself is not damaged: do not run recovery tools or restore a backup. Run `scout {profile_arg}doctor --fix` (or restart Scout, which repairs the index on open), then send your message again."
    disk: "Scout couldn't save this conversation to disk, so it stopped rather than lose your messages. The disk is probably full: free some space (or fix the permissions on {home}/state.db), then send your message again."
    default: "Scout couldn't save this conversation, so it stopped rather than lose your messages. Possible causes: the drive is out of room, or another Scout process is holding the database. Close other Scout windows, run `scout {profile_arg}doctor` to check storage, then send your message again."
  file_mutation:
    header: "⚠️ File-mutation verifier: {count} file edit(s) FAILED this turn despite any wording above that may suggest otherwise. Run `git status` or `read_file` to confirm what actually landed."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "failed"
  shared:
    and_more: "  • … and {count} more"
    the_model: "The model"

tips:
  # CLI startup / /new discovery tips (scout_cli/tips.py). Zero-padded index keeps YAML
  # order stable; pickers read tips.tNNN for the active language.
  t001: "/bg <prompt> runs a task in a separate session while your current one stays free; /btw <question> answers a side question about this conversation without interrupting it."
  t002: "/branch forks the current session so you can explore a different direction without losing progress."
  t003: "/compress manually compresses conversation context when things get long."
  t004: "/rollback lists filesystem checkpoints — restore files the agent modified to any prior state."
  t005: "/rollback diff 2 previews what changed since checkpoint 2 without restoring anything."
  t006: "/rollback 2 src/file.py restores a single file from a specific checkpoint."
  t007: "/title \"my project\" names your session — resume it later with /resume or scout -c."
  t008: "/resume picks up where you left off in a previously named session."
  t009: "/queue <prompt> queues a message for the next turn without interrupting the current one."
  t010: "/undo removes the last user/assistant exchange from the conversation."
  t011: "/retry resends your last message — useful when the agent's response wasn't quite right."
  t012: "/verbose cycles tool progress display: off → new → all → verbose."
  t013: "/reasoning high increases the model's thinking depth. /reasoning show displays the reasoning."
  t014: "/fast toggles priority processing for faster API responses (provider-dependent)."
  t015: "/yolo skips all dangerous command approval prompts for the rest of the session."
  t016: "/model lets you switch models mid-session — try /model sonnet or /model gpt-5."
  t017: "/model --global changes your default model permanently."
