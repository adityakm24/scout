    session_row_missing: "此会话在聊天仍打开时被从存储中删除，且 Scout 无法重新创建它，因此这条消息未保存。请重新发送；如果持续失败，请运行 `scout {profile_arg}doctor`。"
    locked: "本回合已停止，因为会话存储正忙（另一个 Scout 进程正在写入状态数据库）。你的消息应已保存——请稍后重新发送。"
    replaced: "会话数据库文件在 Scout 运行期间被替换，因此这条消息未保存（副本保留在 {home}/sessions/ 中）。请停止 Scout（`scout {profile_arg}gateway stop`），运行 `scout {profile_arg}doctor`——不要运行 `scout {profile_arg}doctor --fix`，那会就地修复错误的文件——然后重新启动并再次发送你的消息。高级恢复步骤见日志。"
    deleted_wal: "另一个 Scout 进程仍持有会话数据库预写日志的旧副本，为保护文件安全，Scout 已停止写入，因此这条消息未保存（副本保留在 {home}/sessions/ 中）。数据没有丢失。请退出此配置文件下的所有 Scout 进程（桌面应用、`scout {profile_arg}gateway stop`、控制台、定时任务），运行 `scout {profile_arg}doctor`——它会列出仍持有日志的进程——然后重新启动 Scout 并再次发送你的消息。在这些进程运行期间，不要运行 `doctor --fix` 或删除任何 state.db 文件。指南：{recovery_docs}"
    corrupt: "本回合已停止，因为状态数据库报告了结构性损坏（重启后对话记录将会丢失）。释放磁盘空间无济于事。恢复选项：\n1. 运行 `scout {profile_arg}doctor --fix`\n2. 停止网关，然后用以下命令恢复：\n   scout {profile_arg}sessions recover --source {db_path} --inspect-only\n   （如果报告可恢复）scout {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   ——恢复前会先对受损文件做快照；切勿对正在使用的 state.db 运行 `sqlite3 ... \\\".recover\\\"`，有漏洞的 sqlite3 命令行可能使其进一步损坏\n3. 从 {backups_dir}/ 中的备份恢复\n然后重新发送你的消息。"
    fts_index: "本回合已停止，因为会话搜索索引（FTS5）已损坏且无法分离，因此这条消息未保存。消息存储本身没有损坏：不要运行恢复工具或还原备份。请运行 `scout {profile_arg}doctor --fix`（或重启 Scout，它会在打开时修复索引），然后重新发送你的消息。"
    disk: "Scout 无法将此对话保存到磁盘，为避免丢失你的消息已停止。磁盘可能已满：请释放一些空间（或修复 {home}/state.db 的权限），然后重新发送你的消息。"
    default: "Scout 无法保存此对话，为避免丢失你的消息已停止。可能的原因：磁盘空间不足，或另一个 Scout 进程正占用数据库。请关闭其他 Scout 窗口，运行 `scout {profile_arg}doctor` 检查存储，然后重新发送你的消息。"
  file_mutation:
    header: "⚠️ 文件修改校验器：本回合有 {count} 处文件编辑失败，无论上方措辞如何暗示。请运行 `git status` 或 `read_file` 确认实际落地的内容。"
    entry: "  • `{path}`——[{tool}] {preview}"
    failed: "失败"
  shared:
    and_more: "  • ……还有 {count} 项"
    the_model: "模型"
tips:
  t001: "/bg <prompt> 会在独立会话中运行任务，当前会话保持空闲；/btw <question> 可就本次对话提一个旁支问题，而不打断当前进程。"
  t002: "/branch 会从当前会话分叉出一个新会话，让你探索另一条思路而不丢失已有进展。"
  t003: "/compress 可在对话变长时手动压缩上下文。"
  t004: "/rollback 会列出文件系统检查点——可把代理修改过的文件恢复到任意先前状态。"
  t005: "/rollback diff 2 可预览自检查点 2 以来的改动，而不会恢复任何内容。"
  t006: "/rollback 2 src/file.py 可从指定检查点恢复单个文件。"
  t007: "/title \"my project\" 为会话命名——之后可用 /resume 或 scout -c 恢复。"
  t008: "/resume 可从之前已命名的会话中接着上次的进度继续。"
  t009: "/queue <prompt> 把消息排入下一回合，不打断当前回合。"
  t010: "/undo 会从对话中移除最后一轮用户/助手交流。"
  t011: "/retry 会重新发送你的上一条消息——当代理的回复不太理想时很有用。"
  t012: "/verbose 循环切换工具进度的显示方式：off → new → all → verbose。"
  t013: "/reasoning high 可加深模型的思考深度。/reasoning show 会显示推理过程。"
  t014: "/fast 切换优先处理，以获得更快的 API 响应（取决于提供方）。"
  t015: "/yolo 会在本会话剩余时间内跳过所有危险命令的批准提示。"
  t016: "/model 可在会话中途切换模型——试试 /model sonnet 或 /model gpt-5。"
  t017: "/model --global 会永久更改你的默认模型。"
  t018: "/personality pirate 可设置一个有趣的人格——从 kawaii 到 shakespeare 共有 14 种内置选项。"
  t019: "/tools disable browser 会在当前会话中临时移除浏览器工具。"
  t020: "/browser connect 通过 CDP 把浏览器工具连接到你正在运行的 Chromium 系浏览器。"
  t021: "/plugins 列出已安装的插件及其状态。"
  t022: "/reload-mcp 无需重启即可热重载 MCP 服务器配置。"
  t023: "/usage 显示 token 用量、费用明细和会话时长。"
  t024: "/insights 显示最近 30 天的用量分析。"
  t025: "/paste 会检查剪贴板中是否有图片，并将其附加到你的下一条消息。"
  t026: "/profile 显示当前激活的配置档及其主目录。"
  t027: "/config 一览你当前的配置。"
  t028: "/stop 会终止代理启动的所有正在运行的后台进程。"
  t029: "@file:path/to/file.py 可将文件内容直接注入到你的消息中。"
  t030: "@file:main.py:10-50 只注入文件的第 10-50 行。"
  t031: "@folder:src/ 注入目录树列表。"
  t032: "@diff 把你未暂存的 git 改动注入到消息中。"
  t033: "@staged 注入你已暂存的 git 改动（git diff --staged）。"
  t034: "@git:5 注入最近 5 次提交及完整补丁。"
  t035: "@url:https://example.com 抓取网页内容并注入到消息中。"
  t036: "输入 @ 会触发文件系统路径补全——可交互式地定位到任意文件。"
  t037: "可组合多个引用：\"Review @file:main.py and @file:test.py for consistency.\""
  t038: "代理工作时直接输入新消息，即可中断并重新引导它。"
  t039: "粘贴 5 行以上的内容会自动保存为文件，并在原位插入一个简短引用。"
  t040: "scout -c 恢复你最近的 CLI 会话。scout -c \"project name\" 按标题恢复。"
  t041: "scout -w 创建一个隔离的 git worktree——非常适合并行代理工作流。"
  t042: "scout -p work chat 在指定配置档下运行，而不更改你的默认配置档。"
  t043: "scout doctor --fix 诊断并自动修复配置和依赖问题。"
  t044: "scout dump 输出精简的安装环境摘要——非常适合用于 bug 报告。"
  t045: "scout config set KEY VALUE 会自动把密钥写入 .env，其余内容写入 config.yaml。"
  t046: "scout config edit 用你的默认编辑器打开 config.yaml。"
  t047: "scout config check 扫描缺失或过期的配置项。"
  t048: "scout sessions browse 打开一个带搜索功能的交互式会话选择器。"
  t049: "scout sessions stats 按平台显示会话数量以及数据库大小。"
  t050: "scout sessions prune --older-than 30 清理旧会话。"
  t051: "scout skills search react --source skills-sh 在 skills.sh 公共目录中搜索。"
  t052: "scout skills check 扫描已安装的 hub 技能是否有上游更新。"
  t053: "scout skills tap add myorg/skills-repo 添加自定义的 GitHub 技能源。"
  t054: "scout skills snapshot export setup.json 导出你的技能配置，用于备份或分享。"
  t055: "scout mcp add github --command npx 可从命令行添加 MCP 服务器。"
  t056: "scout mcp serve 把 Scout 本身作为 MCP 服务器运行，供其他代理使用。"
  t057: "scout auth add 允许你添加多个 API 密钥，用于凭据池轮换。"
  t058: "scout logs -f 实时跟踪 agent.log。--level WARNING --since 1h 可筛选输出。"
  t059: "scout backup 把整个 Scout 主目录打包成 zip 备份。"
  t060: "scout profile create coder 创建一个隔离的配置档，它会成为一条独立命令。"
  t061: "scout profile create work --clone 把你当前的配置和密钥复制到新配置档。"
  t062: "scout update 会自动把新的内置技能同步到所有配置档。"
  t063: "scout gateway install 把 Scout 设置为系统服务（systemd/launchd）。"
  t064: "scout memory setup 让你配置外部记忆提供方（Honcho、Mem0 等）。"
  t065: "scout webhook subscribe 创建带 HMAC 校验的事件驱动 webhook 路由。"
  t066: "省钱技巧：scout tools 可禁用不用的工具，scout skills config 可精简技能。"
  t067: "/reasoning low 或 /reasoning minimal 把思考深度降到默认值（medium）以下——响应更快、更省钱。"
  t068: "scout models 把视觉、压缩和辅助任务路由到更便宜的模型——后台 token 成本可降低 85% 以上，且不影响你的主聊天模型。"
  t069: "在 config.yaml 中设置 display.bell_on_complete: true，长任务完成时会响铃提醒。"
  t070: "设置 display.streaming: true，即可在模型生成时实时看到 tokens 逐个出现。"
  t071: "设置 display.show_reasoning: true，可观看模型的思维链推理。"
  t072: "设置 display.compact: true，减少输出中的空白，让信息更紧凑。"
  t073: "设置 display.busy_input_mode: queue 可把消息排队而不打断代理；设为 steer 则通过 /steer 在运行中途注入消息。"
  t074: "设置 display.resume_display: minimal，恢复会话时跳过完整的对话回顾。"
  t075: "设置 compression.threshold: 0.50 来控制自动压缩的触发时机（默认：上下文的 50%）。"
  t076: "设置 agent.max_turns: 1000，让代理每回合可执行更多工具调用步骤。"
  t077: "设置 file_read_max_chars: 200000，提高每次 read_file 调用的最大内容量。"
  t078: "设置 approvals.mode: smart，让 LLM 自动批准安全命令并自动拒绝危险命令。"
  t079: "在 config.yaml 中设置 fallback_model，可自动故障转移到备用提供方。"
  t080: "设置 privacy.redact_pii: true，在发送给 LLM 之前对用户 ID 和电话号码做哈希处理。"
  t081: "设置 browser.record_sessions: true，自动把浏览器会话录制为 WebM 视频。"
  t082: "在 config.yaml 中设置 worktree: true，可始终创建 git worktree（等同于 scout -w）。"
  t083: "设置 security.website_blocklist.enabled: true，阻止网页工具访问特定域名。"
  t084: "设置 cron.wrap_response: false，投递代理的原始输出，不带定时任务的页眉/页脚。"
  t085: "SCOUT_TIMEZONE 可用任意 IANA 时区字符串覆盖服务器时区。"
  t086: "config.yaml 支持环境变量替换：使用 ${VAR_NAME} 语法。"
  t087: "config.yaml 中的快捷命令可即时运行 shell 命令，零 token 消耗。"
  t088: "可在 config.yaml 的 agent.personalities 下定义自定义人格。"
  t089: "provider_routing 控制 OpenRouter 提供方的排序、白名单和黑名单。"
  t090: "execute_code 运行以编程方式调用 Scout 工具的 Python 脚本——结果不会进入上下文。"
  t091: "delegate_task 默认最多可同时派生 10 个子代理（delegation.max_concurrent_children），各自拥有隔离的上下文以并行工作。"
  t092: "web_extract 支持 PDF 链接——传入任意 PDF 链接即可转换为 markdown。"
  t093: "search_files 基于 ripgrep，比 grep 更快——请用它代替终端中的 grep。"
  t094: "patch 采用 9 种模糊匹配策略，细微的空白差异不会导致编辑失败。"
  t095: "patch 支持 V4A 格式，可在一次调用中批量编辑多个文件。"
  t096: "read_file 在找不到文件时会推荐相似的文件名。"
  t097: "read_file 自动去重——重新读取未更改的文件只会返回一个轻量占位。"
  t098: "browser_vision 截取屏幕截图并用 AI 分析——对验证码和视觉内容同样有效。"
  t099: "browser_console 可在页面上下文中执行 JavaScript 表达式。"
  t100: "image_generate 使用 FLUX 2 Pro 生成图片，并自动进行 2 倍放大。"
  t101: "todo 工具帮助代理在会话中追踪复杂的多步任务。"
  t102: "session_search 可对所有历史对话进行全文搜索。"
  t103: "代理会自动把偏好、纠正和环境信息保存到记忆中。"
  t104: "/moa 把一个高难度提示词路由到你配置的 Mixture of Agents 模型组合。"
  t105: "终端命令支持后台模式，配合 notify_on_complete 处理长时间运行的任务。"
  t106: "终端后台进程支持 watch_patterns，可在出现特定输出行时发出提醒。"
  t107: "terminal 工具支持 6 种后端：本地、Docker、SSH、Modal、Daytona 和 Singularity。"
  t108: "每个配置档都有自己独立的配置、API 密钥、记忆、会话、技能和定时任务。"
  t109: "配置档名称会成为 shell 命令——'scout profile create coder' 会创建 'coder' 命令。"
  t110: "scout profile export coder -o backup.tar.gz 创建一个可移植的配置档归档。"
  t111: "会话会在第一轮交流后自动生成描述性标题——无需手动命名。"
  t112: "会话标题支持谱系：\"my project\" → \"my project #2\" → \"my project #3\"。"
  t113: "退出时，Scout 会打印一条带会话 ID 和统计信息的恢复命令。"
  t114: "scout sessions export backup.jsonl 导出所有会话，用于备份或分析。"
  t115: "scout -r SESSION_ID 按 ID 恢复任意指定的历史会话。"
  t116: "记忆是冻结快照——更改只会在下次会话启动时才出现在系统提示词中。"
  t117: "记忆条目会自动扫描提示词注入和数据外泄模式。"
  t118: "代理有两个记忆存储：个人笔记（约 2200 字符）和用户画像（约 1375 字符）。"
  t119: "你对代理的纠正（\"不对，这样做\"）通常会被自动保存到记忆中。"
  t120: "内置 80 多个技能，涵盖 github、creative、mlops、productivity、research 等领域。"
  t121: "每个已安装的技能都会自动成为一条斜杠命令——输入 / 即可查看全部。"
  t122: "scout skills install official/security/1password 从仓库安装可选技能。"
  t123: "技能可限定特定操作系统——有些只在 macOS 或 Linux 上加载。"
  t124: "config.yaml 中的 skills.external_dirs 允许你从自定义目录加载技能。"
  t125: "代理可以用 skill_manage 创建自己的技能，作为程序性记忆。"
  t126: "/plan 把 markdown 格式的实施计划写入 .scout/plans/，不执行任何操作。"
  t127: "定时任务可附加技能：scout cron add --skill blogwatcher \"Check for new posts\"。"
  t128: "如果定时任务的回复以 [SILENT] 开头，则不会投递——适合仅做监控的任务。"
  t129: "定时任务支持相对延迟（30m）、固定间隔（every 2h）、cron 表达式和 ISO 时间戳。"
  t130: "定时任务在全新的代理会话中运行——提示词必须自成一体。"
  t131: "若已安装 faster-whisper，语音模式无需任何 API 密钥即可使用（免费的本地语音转文字）。"
  t132: "提供五种 TTS 提供方：Edge TTS（免费）、ElevenLabs、OpenAI、NeuTTS（免费本地）、MiniMax。"
  t133: "流式 TTS 边生成边逐句播放——无需等待完整回复。"
  t134: "scout gateway install 把它设置为开机自启的系统服务。"
  t135: "Webhook 路由支持 HMAC 校验、速率限制和事件过滤。"
  t136: "API 服务器提供 OpenAI 兼容端点，可与 Open WebUI 和 LibreChat 配合使用。"
  t137: "group_sessions_per_user: true 让群聊中的每个人都拥有自己的独立会话。"
  t138: "网关支持基于不活动时间的超时——活跃的代理可以无限期运行。"
  t139: "危险命令批准有 4 个层级：once、session、always（永久允许列表）、deny。"
  t140: "智能批准模式使用 LLM 自动批准安全命令，并标记危险命令。"
  t141: "SSRF 防护会阻止访问私有网络、回环地址、链路本地地址和云元数据地址。"
  t142: "Tirith 执行前扫描可检测同形异义 URL 欺骗以及管道传给解释器的模式。"
  t143: "MCP 子进程收到的是经过过滤的环境——只有安全的系统变量会被传入。"
  t144: "上下文文件（.scout.md、AGENTS.md）在加载前会进行提示词注入安全扫描。"
  t145: "config.yaml 中的 command_allowlist 可永久批准特定的 shell 命令模式。"
  t146: "上下文达到阈值时会自动压缩——记忆会被写入，历史会被总结。"
  t147: "随着上下文占用增加，状态栏会依次变为黄色、橙色、红色。"
  t148: "SOUL.md 是代理的核心身份文件——可自定义它来塑造代理行为。"
  t149: "Scout 从 .scout.md、AGENTS.md、CLAUDE.md 或 .cursorrules 加载项目上下文（取首个匹配）。"
  t150: "子目录中的 AGENTS.md 文件会随着代理进入相应文件夹而逐步被发现。"
  t151: "上下文文件上限为 20,000 字符，超出部分会智能保留首尾截断。"
  t152: "五种浏览器提供方：本地 Chromium、Browserbase、Browser Use、Camofox 和 Firecrawl。"
  t153: "Camofox 是一款反检测浏览器——基于 Firefox 分支，采用 C++ 指纹伪装。"
  t154: "browser_navigate 会自动返回页面快照——无需再调用 browser_snapshot。"
  t155: "browser_vision 配合 annotate=true 会在可交互元素上叠加编号标签。"
  t156: "scout mcp 打开一个交互式选择器，列出 SpaceshipResearch 认证的 MCP，一键即可安装。"
  t157: "scout mcp catalog 列出随仓库分发的 SpaceshipResearch 认证 MCP 服务器。"
  t158: "scout mcp install <name> 安装目录中的条目，提示输入凭据，并让你选择要启用哪些工具。"
  t159: "MCP 服务器在 config.yaml 中配置——同时支持 stdio 和 HTTP 传输。"
  t160: "按服务器过滤工具：tools.include 设置白名单，tools.exclude 设置黑名单。"
  t161: "MCP 服务器会在运行时自动生成工具集——scout tools 可按平台开关它们。"
  t162: "MCP OAuth 支持：auth: oauth 启用基于浏览器的 PKCE 授权。"
  t163: "未修改任何文件时检查点零开销——默认启用。"
  t164: "回滚前会自动保存快照，因此你可以撤销这次撤销。"
  t165: "/rollback 同时也会撤销对话回合，因此代理不会记住被回滚的更改。"
  t166: "检查点使用 ~/.scout/checkpoints/ 中的影子仓库——绝不会触碰你项目的 .git。"
  t167: "batch_runner.py 可并行处理数百个提示词，用于生成训练数据。"
  t168: "轨迹保存（--save-trajectories）会记录完整的工具调用轨迹，可用于模型训练。"
  t169: "插件有三种类型：通用插件（工具/钩子）、记忆提供方和上下文引擎。"
  t170: "scout plugins install owner/repo 可直接从 GitHub 安装插件。"
  t171: "外部记忆提供方：Honcho、OpenViking、Mem0 已内置；Hindsight 等可通过 scout plugins install 安装。"
  t172: "插件钩子包括 pre/post_tool_call、pre/post_llm_call，以及用于规范化输出的 transform_terminal_output。"
  t173: "提示词缓存（Anthropic）通过复用已缓存的系统提示词前缀来降低成本。"
  t174: "代理会在后台线程中自动生成会话标题——对延迟零影响。"
  t175: "智能模型路由可以把简单问题自动分流到更便宜的模型。"
  t176: "斜杠命令支持前缀匹配：/h 会解析为 /help，/mod 解析为 /model。"
  t177: "把文件路径拖进终端，图片会自动附加，其他文件会作为上下文发送。"
  t178: "仓库根目录下的 .worktreeinclude 列出需要复制到工作树里的被 gitignore 忽略的文件。"
  t179: "scout acp 以 ACP 服务器方式运行 Scout，用于集成 VS Code、Zed 和 JetBrains。"
  t180: "自定义提供方：在 config.yaml 的 custom_providers 下保存命名端点。"
  t181: "SCOUT_EPHEMERAL_SYSTEM_PROMPT 注入一段永不写入历史记录的系统提示词。"
  t182: "credential_pool_strategies 支持 fill_first、round_robin、least_used 和 random 轮换策略。"
  t183: "scout auth add anthropic 或 scout auth add openai-codex 可配置基于 OAuth 的提供方。"
  t184: "API 服务器同时支持 Chat Completions 和带服务端状态的 Responses API。"
  t185: "在配置中设置 tool_preview_length: 0，加载动画的活动信息流会显示完整文件路径。"
  t186: "scout status --deep 会对所有组件运行更深入的诊断检查。"
  t187: "定时任务可以附带一个 Python 脚本（--script），其 stdout 会作为上下文注入提示词。"
  t188: "定时任务脚本存放在 ~/.scout/scripts/，在代理运行之前执行——非常适合数据采集流水线。"
  t189: "config.yaml 中的 prefill_messages_file 会把 few-shot 示例注入每次 API 调用，且永不保存到历史记录。"
  t190: "SOUL.md 会完全替换代理的默认身份——改写它，让 Scout 真正属于你。"
  t191: "首次运行时 SOUL.md 会自动填入默认人格。编辑它即可自定义。"
  t192: "/compress <focus topic> 会把 60-70% 的摘要预算分配给你指定的主题，并大幅精简其余内容。"
  t193: "第二次及之后的压缩，压缩器会在上一次摘要的基础上更新，而不是从头开始。"
  t194: "网关会话重置之前，Scout 会在后台自动把重要事实写入记忆。"
  t195: "在 config.yaml 中设置 network.force_ipv4: true 可修复 IPv6 损坏的服务器上的卡死问题——通过给 socket 打补丁实现。"
  t196: "terminal 工具会标注常见退出码：grep 返回 1 = “未找到匹配（并非错误）”。"
  t197: "失败的前台终端命令会自动重试最多 3 次，采用指数退避（2 秒、4 秒、8 秒）。"
  t198: "裸 sudo 命令会被自动改写为从 .env 管道传入 SUDO_PASSWORD——无需交互式输入。"
  t199: "execute_code 辅助函数需要显式导入：from scout_tools import json_parse, shell_quote, retry。"
  t200: "execute_code 的 7 个沙箱工具（web_search、terminal、read/write/search/patch）通过 RPC 调用——永不进入上下文。"
  t201: "同一文件区域读取 3 次以上会触发警告；达到 4 次以上则被硬性拦截，以防止循环。"
  t202: "write_file 和 patch 会检测文件自上次读取后是否被外部修改，并对过期内容发出警告。"
  t203: "V4A 补丁格式支持 Add File、Delete File 和 Move File 指令——不只是 Update。"
  t204: "MCP 服务器可以通过 sampling 反向请求 LLM 补全——代理变成了服务器的工具。"
  t205: "MCP 服务器发送 notifications/tools/list_changed 即可触发工具自动重新注册，无需重启。"
  t206: "delegate_task 配合 acp_command: 'claude' 可在任何平台上把 Claude Code 作为子代理启动。"
  t207: "委派带有心跳线程——子代理的活动会传递给父代理，避免网关超时。"
  t208: "当提供方返回 HTTP 402（需要付费）时，辅助客户端会自动回退到下一个提供方。"
  t209: "agent.tool_use_enforcement 会引导那些只描述操作而不调用工具的模型——对 GPT/Codex 自动启用。"
  t210: "agent.restart_after_turn_timeout 让进行中的回合在 /restart 进入 stop() 之前先完成；restart_drain_timeout 只是 stop() 开始后的强制中断时限。"
  t211: "agent.api_max_retries（默认 3）控制代理在报错之前重试失败 API 调用的次数——调低它可以更快回退。"
  t212: "网关按会话缓存 AIAgent 实例——销毁这个缓存会破坏 Anthropic 的提示词缓存。"
  t213: "任何网站都可以通过 /.well-known/skills/index.json 公开技能——技能中心会自动发现它们。"
  t214: "技能审计日志位于 ~/.scout/skills/.hub/audit.log，记录每一次安装和移除操作。"
  t215: "启动时会自动清理过期的 git 工作树：干净且已完全合并的会被清除；有未提交或未推送改动的始终保留。"
  t216: "配置档通过 SCOUT_HOME 隔离 Scout 状态；除非 terminal.home_mode 设为 profile，主机工具子进程仍使用你真实的 HOME。"
  t217: "SCOUT_HOME_MODE 环境变量（八进制，如 0701）为 Web 服务器遍历设置自定义目录权限。"
  t218: "容器模式：在 SCOUT_HOME 中放置 .container-mode，主机 CLI 就会自动切换到容器内执行。"
  t219: "代理运行期间的每次中断都会带时间戳记录到 ~/.scout/interrupt_debug.log。"
  t220: "BROWSER_CDP_URL 可把浏览器工具连接到任何运行中的 Chromium 系浏览器——支持 WebSocket、HTTP 或 host:port。"
  t221: "BROWSERBASE_ADVANCED_STEALTH=true 启用基于自定义 Chromium 的高级反检测（Scale 套餐）。"
  t222: "终端宽度不足 80 列时，CLI 会自动切换到紧凑模式。"
  t223: "快捷命令支持两种类型：exec（直接运行 shell 命令）和 alias（重定向到另一个命令）。"
  t224: "按任务设置委派模型：配置中的 delegation.model 和 delegation.provider 可把子代理路由到更便宜的模型。"
  t225: "delegation.reasoning_effort 独立控制子代理的思考深度。"
  t226: "配置中的 human_delay.mode 模拟人类打字速度——可通过 min_ms/max_ms 设置范围。"
  t227: "配置版本迁移会在加载时自动运行——新配置键会自动出现，无需手动干预。"
  t228: "GPT 和 Codex 模型会获得专门的系统提示词指引，强调工具纪律和强制使用工具。"
  t229: "Gemini 模型会获得针对性指令：使用绝对路径、并行调用工具、使用非交互式命令。"
  t230: "config.yaml 中的 context.engine 可设为某个插件名，以采用其他上下文管理策略。"
  t231: "超过 15,000 字符的浏览器页面快照会被截断或自动摘要；完整快照保存在 cache/web 下，可用 read_file 分页读取。"
  t232: "压缩器会先做一次廉价预处理：在 LLM 运行之前，超过 200 字符的工具输出会被替换为占位符。"
  t233: "压缩失败后，后续尝试会暂停 10 分钟，以避免反复冲击 API。"
  t234: "较长的危险命令（超过 70 字符）在审批提示中会提供“查看”选项，让你先看完整内容。"
  t235: "语音录制期间，音量可视化会根据麦克风 RMS 电平显示 ▁▂▃▄▅▆▇ 条形图。"
  t236: "配置档名称不能与 PATH 中已有的可执行文件冲突——'scout profile create ls' 会被拒绝。"
  t237: "scout profile create backup --clone-all 会复制全部内容（配置、密钥、SOUL.md、记忆、技能、会话）。"
  t238: ".cursorrules 和 .cursor/rules/*.mdc 文件会被自动检测并作为项目上下文加载。"
  t239: "上下文文件会检查 10 多种提示词注入模式——不可见 Unicode、“忽略指令”、数据外泄尝试等。"
  t240: "GPT-5 和 Codex 在消息格式中使用 'developer' 角色，而不是 'system'。"
  t241: "按任务覆盖辅助设置：在 config.yaml 中设置 auxiliary.vision.provider、auxiliary.compression.model 等。"
  t242: "辅助客户端把 'main' 视为提供方别名——解析为你实际使用的主提供方和模型。"
  t243: "scout claw migrate --dry-run 预览 OpenClaw 迁移结果，不会写入任何内容。"
  t244: "粘贴的带引号或转义空格的文件路径会被自动处理——无需手动清理。"
  t245: "斜杠命令永远不会触发大段粘贴折叠——带大参数的 /command 也能正常工作。"
  t246: "在中断模式下，代理执行期间输入的斜杠命令会绕过中断逻辑并立即执行。"
  t247: "SCOUT_DEV=1 会跳过容器模式检测，方便本地开发。"
  t248: "每个 MCP 服务器都有自己的工具集（mcp-servername），可通过 scout tools 单独开关。"
  t249: "配置中的 MCP ${ENV_VAR} 占位符会在服务器启动时解析——包括来自 ~/.scout/.env 的变量。"
  t250: "来自可信仓库（SpaceshipResearch）的技能获得 'trusted' 安全级别；社区技能会经过额外扫描。"
  t251: "技能隔离区位于 ~/.scout/skills/.hub/quarantine/，存放等待安全审查的技能。"
  t252: "/steer <prompt> 会在下一次工具调用后注入一条备注——在任务中途调整方向而不打断执行。"
  t253: "/goal <text> 设定一个持续的 Ralph 循环目标——Scout 会一回合接一回合自动继续，直到评审判定完成。"
  t254: "/snapshot create [label] 保存 Scout 配置的完整状态快照；之后可用 /snapshot restore <id> 回退。"
  t255: "/copy [N] 把最后一条助手回复复制到剪贴板，加数字则复制倒数第 N 条。"
  t256: "/redraw 强制完整重绘界面，修复 tmux 调整大小或鼠标选择后残留的终端错位。"
  t257: "/agents（别名 /tasks）显示当前会话中活跃的代理和运行中的后台任务。"
  t258: "/footer 切换最终回复上的网关页脚，页脚显示模型、上下文百分比和 cwd。"
  t259: "/busy queue|steer|interrupt 控制 Scout 工作时按 Enter 的行为。"
  t260: "/approve session|always 以你选择的信任范围运行待批准的危险命令；/deny 则拒绝它。"
  t261: "/restart 会先等待活跃运行结束，再平滑重启网关，恢复后通知请求者。"
  t262: "/kanban boards switch <slug> 可在聊天中直接切换当前的多项目看板。"
  t263: "/reload 把 ~/.scout/.env 重新加载到运行中的会话——无需重启即可使用新的 API 密钥。"
  t264: "设置 no_agent=True 的 cronjob 会按计划运行脚本并直接发送其 stdout——零 tokens，不经过 LLM。"
  t265: "定时任务脚本 stdout 为空表示静默运行——不发送任何内容，非常适合阈值监控。"
  t266: "SCOUT_CRON_MAX_PARALLEL（默认 4）限制每次触发并行运行的定时任务数量，避免突发流量耗尽你的密钥。"
  t267: "网关钩子位于 ~/.scout/hooks/<name>/，包含 HOOK.yaml 和 handler.py——处理函数必须命名为 `handle`。"
  t268: "钩子事件包括 gateway:startup、session:start、agent:step，以及 command:* 通配订阅。"
  t269: "放一份 ~/.scout/BOOT.md 清单，再加一个 gateway:startup 钩子，每次启动都会以一次性代理执行它。"
  t270: "scout curator run --dry-run 预览策展器将归档或合并的内容，不会实际改动任何东西。"
  t271: "scout curator pin <skill> 硬性保护某个技能，使其既不被自动归档，也不被代理的 skill_manage 工具修改。"
  t272: "scout curator rollback 从运行前快照恢复技能——备份位于 skills/.curator_backups/。"
  t273: "scout auth reset <provider> [target] 清除整个凭据池的冷却和耗尽标记，也可按索引、id 或标签只清除某一条凭据。"
  t274: "credential_pool_strategies.<provider>: round_robin 会均匀轮换密钥，而不是默认的 fill_first。"
  t275: "scout tools 可按工具选择提供方——网页搜索、图像、TTS 和浏览器——各自使用你自己的 API 密钥。"
  t276: "provider_routing.data_collection: deny 会在 OpenRouter 上排除存储数据的提供方。"
  t277: "provider_routing.require_parameters: true 只路由到支持你请求中每个参数的提供方。"
  t278: "scout dashboard 在 127.0.0.1:9119 启动本地 Web 界面——数据完全不离开本机。"
  t279: "在 ~/.scout/dashboard-themes/ 放一个只含两种配色的 YAML，即可为整个控制台换肤。"
  t280: "控制台插件即放即用：把 manifest.json 和 JS 包放进 ~/.scout/dashboard-plugins/——无需 npm 构建。"
  t281: "控制台主题中的 layoutVariant: cockpit 会添加一条 260px 的左侧边栏，插件可通过 sidebar 插槽填充内容。"
  t282: "SCOUT_BACKGROUND_NOTIFICATIONS=result 只在后台任务完成时通知（其他选项：concise/all/error/off）。"
  t283: "SCOUT_WRITE_SAFE_ROOT 把 write_file/patch 限制在指定目录前缀内；多个路径用 os.pathsep（: 或 ;）分隔。"
  t284: "SCOUT_IGNORE_RULES 跳过 AGENTS.md、SOUL.md、.cursorrules、记忆和预加载技能的自动注入。"
  t285: "SCOUT_ACCEPT_HOOKS 自动批准 config.yaml 中声明的未见过的 shell 钩子，无需 TTY 确认。"
  t286: "auxiliary.goal_judge.model 把 /goal 评审路由到便宜快速的模型，让循环成本接近于零。"
  t287: "检查点会跳过超过 50,000 个文件的目录，以避免在超大单体仓库上执行缓慢的 git 操作。"
  t288: "tts.provider: piper 在 CPU 上运行支持 44 种语言的本地 TTS——语音包会自动下载到 ~/.scout/cache/piper-voices/。"
  t289: "tts.providers.<name>.type: command 可接入任何命令行 TTS 引擎，使用 {input_path} 和 {output_path} 占位符。"
  t290: "API_SERVER_ENABLED=true 会在网关旁运行一个 OpenAI 兼容端点，可供 Open WebUI 和 LibreChat 使用。"
  t291: "batch_runner.py --resume 按文本内容匹配已完成的提示词，因此数据集重新排序也不会重跑已完成的工作。"
  t292: "/new 原地开启新会话（别名 /reset）——新的会话 ID、干净的历史记录，CLI 保持打开。"
  t293: "/clear 清空终端屏幕并同时开启新会话——一个快捷方式完成视觉重置。"
  t294: "/save 把当前对话写入磁盘，而不结束会话。"
  t295: "/status 一览会话信息：ID、标题、模型、token 用量和已用时间。"
  t296: "/image <path> 为下一条提示词附加本地图片文件，无需粘贴或拖放。"
  t297: "/commands 分页列出全部斜杠命令和已安装技能——在没有 Tab 补全的平台上很有用。"
  t298: "/toolsets 列出所有可用工具集，让你知道 -t/--toolsets 接受哪些值。"
  t299: "/reload-skills 重新扫描 ~/.scout/skills/，让直接放入的技能无需重启会话即可出现。"
  t300: "/debug 上传支持包（系统信息 + 日志）并返回可分享的链接——在聊天中也能用。"
  t301: "scout dump --show-keys 包含脱敏后的 API 密钥指纹，便于更深入的支持排查。"
  t302: "scout sessions rename <ID> \"new title\" 可重命名任意历史会话；scout sessions delete <ID> 删除一个会话。"
  t303: "scout import 恢复完整的 Scout 备份 zip；会话 JSON/JSONL 导出文件可在控制台的“会话”页面导入。"
  t304: "scout fallback 交互式管理 fallback_model 链——无需手动编辑 config.yaml。"
  t305: "scout setup 通过一个交互式流程引导首次用户完成提供方、密钥和平台的接入。"
  t306: "scout status --deep 对每个组件运行完整健康检查；不带参数的 scout status 是快速概览。"
  t307: "SCOUT_AGENT_TIMEOUT=0 禁用网关对运行中代理的闲置终止——适合长时间研究任务。"
  t308: "SCOUT_ENABLE_PROJECT_PLUGINS=1 自动加载 ./.scout/plugins/ 下的仓库本地插件——设计上有信任门控。"
  t309: "SCOUT_DISABLE_FILE_STATE_GUARD=1 关闭 patch 和 write_file 上的“文件自读取后已变更”保护。"
  t310: "SCOUT_ALLOW_PRIVATE_URLS=true 允许 Web 工具访问 localhost 和私有网络——网关模式下默认关闭。"
  t311: "SCOUT_OPTIONAL_SKILLS=name1,name2 会在每个配置档首次运行时自动安装额外的可选目录技能。"
  t312: "SCOUT_BUNDLED_SKILLS 指向自定义的内置技能目录树——Homebrew 和 Nix 打包会用到。"
  t313: "SCOUT_DUMP_REQUEST_STDOUT=1 把每个 API 请求负载输出到 stdout，而不是日志文件。"
  t314: "SCOUT_OAUTH_TRACE=1 记录脱敏后的 OAuth 令牌交换和刷新尝试，用于排查提供方认证问题。"
  t315: "SCOUT_STREAM_RETRIES（默认 3）控制遇到瞬时网络错误时流式传输中途的重连次数。"
  t316: "SCOUT_GATEWAY_BUSY_ACK_ENABLED=false 关闭用户向忙碌代理发消息时的 ⚡/⏳/⏩ 确认提示。"
  t317: "SCOUT_AGENT_NOTIFY_INTERVAL（默认 180s）设置长回合中网关推送进度的频率。"
  t318: "SCOUT_RESTART_DRAIN_TIMEOUT（默认 900s）限制 /restart 在强制执行前等待进行中运行的最长时间。"
  t319: "SCOUT_CHECKPOINT_TIMEOUT（默认 30s）限制文件系统检查点的创建时间——超大单体仓库可适当调高。"
  t320: "config.yaml 中的 image_gen.model 选择 FAL 模型：flux-2/klein、gpt-image-2、nano-banana-pro 等。"
  t321: "image_gen.provider 把图像生成路由到插件（OpenAI Images、Codex、FAL），而不使用默认方式。"
  t322: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY 可把视觉分析指向任意 OpenAI 兼容端点。"
  t323: "security.tirith_fail_open: false 会让 Scout 在 tirith 扫描器自身出错时拦截命令。"
  t324: "TIRITH_FAIL_OPEN 环境变量可覆盖 tirith_fail_open 配置——无需编辑 config.yaml 的快速开关。"
  t325: "会话 ID 以时间戳为前缀（20250305_091523_abcd），在 ls 和 jq 中排序自然有序。"
  t326: "API_SERVER_MODEL_NAME 自定义 /v1/models 返回的模型名——多配置档的 Open WebUI 部署必不可少。"
  t327: "控制台插件从 /dashboard-plugins/<name>/ 提供服务——把文件放进 ~/.scout/dashboard-plugins/ 即可。"
