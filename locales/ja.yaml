    replaced: "Scout の実行中にセッションデータベースファイルが置き換えられたため、このメッセージは保存されていません（コピーは {home}/sessions/ に保持されています）。Scout を停止（`scout {profile_arg}gateway stop`）し、`scout {profile_arg}doctor` を実行してください — `scout {profile_arg}doctor --fix` は誤ったファイルをその場で修復してしまうため使わないでください — その後 Scout を再起動し、メッセージをもう一度送信してください。高度な復旧手順はログに記載されています。"
    deleted_wal: "別の Scout プロセスがセッションデータベースの write-ahead log の古いコピーをまだ保持しているため、ファイルを保護するために Scout は書き込みを停止し、このメッセージは保存されていません（コピーは {home}/sessions/ に保持されています）。データは失われていません。このプロファイルのすべての Scout プロセス（Desktop アプリ、`scout {profile_arg}gateway stop`、ダッシュボード、cron）を終了し、`scout {profile_arg}doctor` を実行してください — ログを保持しているプロセスが表示されます — その後 Scout を再起動し、メッセージをもう一度送信してください。プロセスの実行中に `doctor --fix` を実行したり state.db ファイルを削除したりしないでください。ガイド: {recovery_docs}"
    corrupt: "状態データベースが構造的な破損を報告したため（再起動時に会話記録が失われるおそれがありました）、ターンを停止しました。ディスク容量を空けても解決しません。復旧の選択肢:\n1. `scout {profile_arg}doctor --fix` を実行する\n2. ゲートウェイを停止し、次のコマンドで復旧する:\n   scout {profile_arg}sessions recover --source {db_path} --inspect-only\n   （復旧可能と報告された場合）scout {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — 復旧処理は先に破損ファイルのスナップショットを取ります。稼働中の state.db に対して `sqlite3 ... \".recover\"` を実行しないでください。脆弱な sqlite3 CLI はさらに破損させる可能性があります\n3. {backups_dir}/ のバックアップから復元する\nその後、メッセージをもう一度送信してください。"
    fts_index: "セッション検索インデックス（FTS5）が破損しており切り離せなかったため、ターンを停止し、このメッセージは保存されていません。メッセージストア自体は損傷していません。復旧ツールの実行やバックアップからの復元は行わないでください。`scout {profile_arg}doctor --fix` を実行（または Scout を再起動すると起動時にインデックスが修復されます）してから、メッセージをもう一度送信してください。"
    disk: "Scout はこの会話をディスクに保存できなかったため、メッセージを失わないよう停止しました。ディスクが満杯の可能性があります。空き容量を確保（または {home}/state.db の権限を修正）してから、メッセージをもう一度送信してください。"
    default: "Scout はこの会話を保存できなかったため、メッセージを失わないよう停止しました。考えられる原因: ドライブの空き容量不足、または別の Scout プロセスがデータベースを保持している。他の Scout ウィンドウを閉じ、`scout {profile_arg}doctor` でストレージを確認してから、メッセージをもう一度送信してください。"
  file_mutation:
    header: "⚠️ ファイル変更検証: 上の文面がどう示していようと、このターンで {count} 件のファイル編集が失敗しました。`git status` または `read_file` を実行して、実際に反映された内容を確認してください。"
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "失敗"
  shared:
    and_more: "  • … 他 {count} 件"
    the_model: "モデル"
tips:
  t001: "/bg <prompt> は現在のセッションを空けたまま別セッションでタスクを実行します。/btw <question> は会話を中断せずに、この会話に関する補足の質問に答えます。"
  t002: "/branch は現在のセッションを分岐させ、進捗を失わずに別の方向を試せるようにします。"
  t003: "/compress は会話が長くなったときに、コンテキストを手動で圧縮します。"
  t004: "/rollback はファイルシステムのチェックポイント一覧を表示します。エージェントが変更したファイルを以前の任意の状態に復元できます。"
  t005: "/rollback diff 2 は何も復元せずに、チェックポイント 2 以降の変更内容をプレビューします。"
  t006: "/rollback 2 src/file.py は特定のチェックポイントから単一のファイルを復元します。"
  t007: "/title \"my project\" でセッションに名前を付けられます。あとで /resume または scout -c で再開できます。"
  t008: "/resume は以前に名前を付けたセッションの続きから再開します。"
  t009: "/queue <prompt> は現在のターンを中断せずに、次のターン用にメッセージをキューに入れます。"
  t010: "/undo は会話から直前のユーザーとアシスタントのやり取りを削除します。"
  t011: "/retry は直前のメッセージを再送信します。エージェントの応答がいまひとつだったときに便利です。"
  t012: "/verbose はツールの進捗表示を off → new → all → verbose の順に切り替えます。"
  t013: "/reasoning high はモデルの思考の深さを上げます。/reasoning show は推論内容を表示します。"
  t014: "/fast は API 応答を高速化する優先処理のオン/オフを切り替えます（プロバイダーによります）。"
  t015: "/yolo はセッションの残りの間、危険なコマンドの承認プロンプトをすべてスキップします。"
  t016: "/model でセッション中にモデルを切り替えられます。/model sonnet や /model gpt-5 を試してみてください。"
  t017: "/model --global はデフォルトのモデルを恒久的に変更します。"
  t018: "/personality pirate で楽しいパーソナリティを設定できます。kawaii から shakespeare まで 14 種類の組み込みオプションがあります。"
  t019: "/tools disable browser は現在のセッションの間だけ、ブラウザツールを一時的に外します。"
  t020: "/browser connect は CDP 経由で、起動中の Chromium 系ブラウザにブラウザツールを接続します。"
  t021: "/plugins はインストール済みのプラグインとその状態を一覧表示します。"
  t022: "/reload-mcp は再起動せずに MCP サーバー設定をホットリロードします。"
  t023: "/usage はトークン使用量、コストの内訳、セッションの経過時間を表示します。"
  t024: "/insights は過去 30 日間の使用状況の分析を表示します。"
  t025: "/paste はクリップボードに画像があるか確認し、次のメッセージに添付します。"
  t026: "/profile はどのプロファイルが有効か、およびそのホームディレクトリを表示します。"
  t027: "/config は現在の設定をひと目で確認できます。"
  t028: "/stop はエージェントが起動した実行中のバックグラウンドプロセスをすべて終了します。"
  t029: "@file:path/to/file.py はファイルの内容をメッセージに直接挿入します。"
  t030: "@file:main.py:10-50 はファイルの 10〜50 行目だけを挿入します。"
  t031: "@folder:src/ はディレクトリツリーの一覧を挿入します。"
  t032: "@diff はステージされていない git の変更をメッセージに挿入します。"
  t033: "@staged はステージ済みの git の変更（git diff --staged）を挿入します。"
  t034: "@git:5 は直近 5 件のコミットを完全なパッチ付きで挿入します。"
  t035: "@url:https://example.com は Web ページを取得して、その内容を挿入します。"
  t036: "@ を入力するとファイルシステムのパス補完が起動し、任意のファイルへ対話的に移動できます。"
  t037: "複数の参照を組み合わせられます: \"Review @file:main.py and @file:test.py for consistency.\""
  t038: "エージェントの作業中に新しいメッセージを入力すると、中断して方向を変えられます。"
  t039: "5 行以上を貼り付けると自動的にファイルに保存され、代わりにコンパクトな参照が挿入されます。"
  t040: "scout -c は直近の CLI セッションを再開します。scout -c \"project name\" はタイトルで再開します。"
  t041: "scout -w は隔離された git worktree を作成します。並列のエージェントワークフローに最適です。"
  t042: "scout -p work chat はデフォルトを変えずに、特定のプロファイルで実行します。"
  t043: "scout doctor --fix は設定と依存関係の問題を診断し、自動で修復します。"
  t044: "scout dump はセットアップの要約をコンパクトに出力します。バグ報告に最適です。"
  t045: "scout config set KEY VALUE はシークレットを .env に、それ以外を config.yaml に自動で振り分けます。"
  t046: "scout config edit はデフォルトのエディターで config.yaml を開きます。"
  t047: "scout config check は不足している設定項目や古くなった設定項目をスキャンします。"
  t048: "scout sessions browse は検索付きの対話型セッションピッカーを開きます。"
  t049: "scout sessions stats はプラットフォーム別のセッション数とデータベースのサイズを表示します。"
  t050: "scout sessions prune --older-than 30 は古いセッションを整理します。"
  t051: "scout skills search react --source skills-sh は skills.sh の公開ディレクトリを検索します。"
  t052: "scout skills check はインストール済みのハブスキルに上流の更新がないかスキャンします。"
  t053: "scout skills tap add myorg/skills-repo はカスタムの GitHub スキルソースを追加します。"
  t054: "scout skills snapshot export setup.json はバックアップや共有のためにスキル設定をエクスポートします。"
  t055: "scout mcp add github --command npx はコマンドラインから MCP サーバーを追加します。"
  t056: "scout mcp serve は Scout 自体を他のエージェント向けの MCP サーバーとして実行します。"
  t057: "scout auth add で認証情報プールのローテーション用に複数の API キーを追加できます。"
  t058: "scout logs -f は agent.log をリアルタイムで追跡します。--level WARNING --since 1h で出力を絞り込めます。"
  t059: "scout backup は Scout のホームディレクトリ全体の zip バックアップを作成します。"
  t060: "scout profile create coder は隔離されたプロファイルを作成し、それ自体が独立したコマンドになります。"
  t061: "scout profile create work --clone は現在の設定とキーを新しいプロファイルにコピーします。"
  t062: "scout update は新しい同梱スキルをすべてのプロファイルに自動で同期します。"
  t063: "scout gateway install は Scout をシステムサービス（systemd/launchd）として設定します。"
  t064: "scout memory setup で外部メモリプロバイダー（Honcho、Mem0 など）を設定できます。"
  t065: "scout webhook subscribe は HMAC 検証付きのイベント駆動 Webhook ルートを作成します。"
  t066: "コスト削減: scout tools で未使用のツールを無効化し、scout skills config でスキルを絞り込めます。"
  t067: "/reasoning low または /reasoning minimal は思考の深さをデフォルト（medium）より下げ、応答をより速く安価にします。"
  t068: "scout models はビジョン、圧縮、補助タスクを安価なモデルに振り分けます。メインのチャットモデルを落とさずに、バックグラウンドのトークンコストを 85% 以上削減できます。"
  t069: "config.yaml で display.bell_on_complete: true を設定すると、長いタスクの完了時にベルが鳴ります。"
  t070: "display.streaming: true を設定すると、モデルの生成に合わせてトークンがリアルタイムで表示されます。"
  t071: "display.show_reasoning: true を設定すると、モデルの思考の連鎖（chain-of-thought）を確認できます。"
  t072: "display.compact: true を設定すると出力の空白が減り、より密度の高い情報表示になります。"
  t073: "display.busy_input_mode: queue を設定するとエージェントを中断せずにメッセージをキューに入れ、steer を設定すると /steer 経由で実行中に注入します。"
  t074: "display.resume_display: minimal を設定すると、セッション再開時の会話全体の振り返り表示をスキップします。"
  t075: "compression.threshold: 0.50 を設定して、自動圧縮が発動するタイミングを制御できます（デフォルト: コンテキストの 50%）。"
  t076: "agent.max_turns: 1000 を設定すると、エージェントがターンあたりに実行できるツール呼び出しのステップ数が増えます。"
  t077: "file_read_max_chars: 200000 を設定すると、read_file 呼び出し 1 回あたりの最大コンテンツ量が増えます。"
  t078: "approvals.mode: smart を設定すると、LLM が安全なコマンドを自動承認し、危険なコマンドを自動拒否します。"
  t079: "config.yaml で fallback_model を設定すると、バックアップのプロバイダーへ自動でフェイルオーバーします。"
  t080: "privacy.redact_pii: true を設定すると、LLM に送信する前にユーザー ID と電話番号をハッシュ化します。"
  t081: "browser.record_sessions: true を設定すると、ブラウザセッションを WebM 動画として自動録画します。"
  t082: "config.yaml で worktree: true を設定すると、常に git worktree を作成します（scout -w と同じ）。"
  t083: "security.website_blocklist.enabled: true を設定すると、Web ツールから特定のドメインをブロックします。"
  t084: "cron.wrap_response: false を設定すると、cron のヘッダー/フッターなしでエージェントの生の出力を配信します。"
  t085: "SCOUT_TIMEZONE は任意の IANA タイムゾーン文字列でサーバーのタイムゾーンを上書きします。"
  t086: "config.yaml では環境変数の展開が使えます。${VAR_NAME} 構文を使ってください。"
  t087: "config.yaml のクイックコマンドは、トークンを一切消費せずにシェルコマンドを即座に実行します。"
  t088: "カスタムのパーソナリティは config.yaml の agent.personalities 以下で定義できます。"
  t089: "provider_routing は OpenRouter のプロバイダーの並び順、ホワイトリスト、ブラックリストを制御します。"
  t090: "execute_code は Scout のツールをプログラムから呼び出す Python スクリプトを実行します。結果はコンテキストに入りません。"
  t091: "delegate_task はデフォルトで最大 10 個のサブエージェント（delegation.max_concurrent_children）を同時に起動し、隔離されたコンテキストで並列作業を行います。"
  t092: "web_extract は PDF の URL にも対応しています。PDF のリンクを渡すと Markdown に変換します。"
  t093: "search_files は ripgrep ベースで grep より高速です。ターミナルの grep の代わりに使ってください。"
  t094: "patch は 9 種類のあいまい一致戦略を使うため、わずかな空白の違いで編集が失敗することはありません。"
  t095: "patch は V4A 形式に対応しており、1 回の呼び出しで複数ファイルを一括編集できます。"
  t096: "read_file はファイルが見つからないときに、似た名前のファイルを提案します。"
  t097: "read_file は自動で重複を排除します。変更のないファイルを再読み込みすると軽量なスタブを返します。"
  t098: "browser_vision はスクリーンショットを撮って AI で分析します。CAPTCHA や視覚的なコンテンツにも使えます。"
  t099: "browser_console はページのコンテキストで JavaScript 式を評価できます。"
  t100: "image_generate は FLUX 2 Pro で画像を生成し、自動で 2 倍にアップスケールします。"
  t101: "todo ツールは、セッション中にエージェントが複雑な複数ステップのタスクを追跡するのに役立ちます。"
  t102: "session_search は過去のすべての会話を対象に全文検索を行います。"
  t103: "エージェントは好み、修正内容、環境に関する事実を自動的にメモリへ保存します。"
  t104: "/moa は難しいプロンプト 1 つを、設定済みの Mixture of Agents モデルセットに通します。"
  t105: "ターミナルコマンドは長時間タスク向けに、notify_on_complete 付きのバックグラウンドモードに対応しています。"
  t106: "ターミナルのバックグラウンドプロセスは watch_patterns に対応しており、特定の出力行で通知できます。"
  t107: "terminal ツールは local、Docker、SSH、Modal、Daytona、Singularity の 6 つのバックエンドに対応しています。"
  t108: "各プロファイルは独自の設定、API キー、メモリ、セッション、スキル、cron ジョブを持ちます。"
  t109: "プロファイル名はシェルコマンドになります。'scout profile create coder' で 'coder' コマンドが作られます。"
  t110: "scout profile export coder -o backup.tar.gz は持ち運び可能なプロファイルのアーカイブを作成します。"
  t111: "セッションは最初のやり取りのあとに説明的なタイトルを自動生成するため、手動で名前を付ける必要はありません。"
  t112: "セッションタイトルは系譜に対応しています: \"my project\" → \"my project #2\" → \"my project #3\"。"
  t113: "終了時に Scout はセッション ID と統計情報を含む再開コマンドを表示します。"
  t114: "scout sessions export backup.jsonl はバックアップや分析のためにすべてのセッションをエクスポートします。"
  t115: "scout -r SESSION_ID は ID を指定して過去の任意のセッションを再開します。"
  t116: "メモリは固定されたスナップショットです。変更は次のセッション開始時にのみシステムプロンプトに反映されます。"
  t117: "メモリの項目は、プロンプトインジェクションや情報流出のパターンがないか自動的にスキャンされます。"
  t118: "エージェントには 2 つのメモリストアがあります: 個人メモ（約 2200 文字）とユーザープロファイル（約 1375 文字）です。"
  t119: "エージェントへの修正指示（\"いや、こうやって\"など）は、多くの場合メモリに自動保存されます。"
  t120: "github、creative、mlops、productivity、research など、80 を超えるスキルが同梱されています。"
  t121: "インストール済みのスキルはすべて自動的にスラッシュコマンドになります。/ を入力すると一覧を確認できます。"
  t122: "scout skills install official/security/1password はリポジトリからオプションのスキルをインストールします。"
  t123: "スキルは特定の OS プラットフォームに限定できます。macOS または Linux でのみ読み込まれるスキルもあります。"
  t124: "config.yaml の skills.external_dirs で、カスタムディレクトリからスキルを読み込めます。"
  t125: "エージェントは skill_manage を使って、手続き的メモリとして独自のスキルを作成できます。"
  t126: "/plan は何も実行せずに、Markdown の実装計画を .scout/plans/ に書き出します。"
  t127: "cron ジョブにはスキルを付けられます: scout cron add --skill blogwatcher \"Check for new posts\"。"
  t128: "cron の応答が [SILENT] で始まる場合、配信は抑制されます。監視専用のジョブに便利です。"
  t129: "cron は相対的な遅延（30m）、間隔（every 2h）、cron 式、ISO タイムスタンプに対応しています。"
  t130: "cron ジョブは完全に新しいエージェントセッションで実行されるため、プロンプトはそれ単体で完結している必要があります。"
  t131: "faster-whisper がインストールされていれば、音声モードは API キーなしで動作します（無料のローカル音声認識）。"
  t132: "TTS プロバイダーは 5 つ利用できます: Edge TTS（無料）、ElevenLabs、OpenAI、NeuTTS（無料・ローカル）、MiniMax。"
  t133: "ストリーミング TTS は文が生成されるそばから再生するため、応答全体を待つ必要がありません。"
  t134: "scout gateway install は起動時に自動で開始するシステムサービスとして設定します。"
  t135: "Webhook ルートは HMAC 検証、レート制限、イベントフィルタリングに対応しています。"
  t136: "API サーバーは Open WebUI や LibreChat と互換性のある OpenAI 互換エンドポイントを公開します。"
  t137: "group_sessions_per_user: true を設定すると、グループチャットで各メンバーに専用のセッションが割り当てられます。"
  t138: "ゲートウェイは非アクティブ状態に基づくタイムアウトに対応しているため、稼働中のエージェントは無期限に実行できます。"
  t139: "危険なコマンドの承認には 4 段階あります: once、session、always（恒久的な許可リスト）、deny。"
  t140: "スマート承認モードは LLM を使って安全なコマンドを自動承認し、危険なコマンドにフラグを立てます。"
  t141: "SSRF 保護はプライベートネットワーク、ループバック、リンクローカル、クラウドメタデータのアドレスをブロックします。"
  t142: "Tirith の実行前スキャンは、ホモグラフによる URL 偽装やパイプからインタープリターへ渡すパターンを検出します。"
  t143: "MCP のサブプロセスにはフィルタリングされた環境変数が渡されます。安全なシステム変数だけが通過します。"
  t144: "コンテキストファイル（.scout.md、AGENTS.md）は読み込み前にプロンプトインジェクションのセキュリティスキャンを受けます。"
  t145: "config.yaml の command_allowlist は特定のシェルコマンドパターンを恒久的に承認します。"
  t146: "コンテキストがしきい値に達すると自動的に圧縮されます。メモリが書き出され、履歴が要約されます。"
  t147: "ステータスバーはコンテキストが埋まるにつれて黄、橙、赤の順に色が変わります。"
  t148: "SOUL.md はエージェントの主要なアイデンティティファイルです。カスタマイズして振る舞いを形作れます。"
  t149: "Scout は .scout.md、AGENTS.md、CLAUDE.md、.cursorrules（最初に見つかったもの）からプロジェクトのコンテキストを読み込みます。"
  t150: "サブディレクトリの AGENTS.md ファイルは、エージェントがフォルダーに入るにつれて段階的に検出されます。"
  t151: "コンテキストファイルは 20,000 文字が上限で、先頭と末尾を残すスマートな切り詰めが行われます。"
  t152: "ブラウザプロバイダーは 5 つあります: ローカルの Chromium、Browserbase、Browser Use、Camofox、Firecrawl。"
  t153: "Camofox は検出回避型のブラウザです。C++ によるフィンガープリント偽装を備えた Firefox のフォークです。"
  t154: "browser_navigate は自動的にページのスナップショットを返すため、あとから browser_snapshot を呼ぶ必要はありません。"
  t155: "browser_vision に annotate=true を指定すると、操作可能な要素に番号付きラベルを重ねて表示します。"
  t156: "scout mcp は SpaceshipResearch 承認済み MCP の対話型ピッカーを開き、キー 1 つでインストールできます。"
  t157: "scout mcp catalog はリポジトリに同梱されている SpaceshipResearch 承認済みの MCP サーバーを一覧表示します。"
  t158: "scout mcp install <name> はカタログの項目をインストールし、認証情報の入力を求め、有効にするツールを選択させてくれます。"
  t159: "MCP サーバーは config.yaml で設定します。stdio と HTTP の両方のトランスポートに対応しています。"
  t160: "サーバーごとのツールフィルタリング: tools.include で特定のツールをホワイトリストに、tools.exclude でブラックリストに登録します。"
  t161: "MCP サーバーは実行時にツールセットを自動生成します。scout tools でプラットフォームごとにオン/オフを切り替えられます。"
  t162: "MCP の OAuth 対応: auth: oauth を設定すると、PKCE を使ったブラウザベースの認可が有効になります。"
  t163: "チェックポイントはファイルが変更されない限りオーバーヘッドがゼロで、デフォルトで有効です。"
  t164: "ロールバック前のスナップショットが自動保存されるため、取り消しをさらに取り消せます。"
  t165: "/rollback は会話のターンも取り消すため、エージェントはロールバックされた変更を覚えていません。"
  t166: "チェックポイントは ~/.scout/checkpoints/ 内のシャドウリポジトリを使います。プロジェクトの .git には一切触れません。"
  t167: "batch_runner.py は学習データ生成のために数百のプロンプトを並列処理します。"
  t168: "トラジェクトリ保存（--save-trajectories）は、モデル学習用にツール使用の完全なトレースを記録します。"
  t169: "プラグインには 3 種類あります。汎用（ツール/フック）、メモリプロバイダー、コンテキストエンジンです。"
  t170: "scout plugins install owner/repo で GitHub から直接プラグインをインストールできます。"
  t171: "外部メモリプロバイダーとして Honcho、OpenViking、Mem0 が同梱されており、Hindsight などは scout plugins install で追加できます。"
  t172: "プラグインフックには pre/post_tool_call、pre/post_llm_call、出力の正規化用の transform_terminal_output などがあります。"
  t173: "プロンプトキャッシュ（Anthropic）は、キャッシュ済みのシステムプロンプトのプレフィックスを再利用してコストを削減します。"
  t174: "エージェントはセッションタイトルをバックグラウンドスレッドで自動生成するため、レイテンシへの影響はゼロです。"
  t175: "スマートなモデルルーティングにより、簡単な質問を自動的に安価なモデルへ振り分けられます。"
  t176: "スラッシュコマンドは前方一致に対応しています。/h は /help に、/mod は /model に解決されます。"
  t177: "ファイルパスをターミナルにドラッグすると、画像は自動的に添付され、それ以外はコンテキストとして送信されます。"
  t178: "リポジトリのルートに置いた .worktreeinclude に、ワークツリーへコピーする gitignore 済みファイルを列挙できます。"
  t179: "scout acp は Scout を ACP サーバーとして起動し、VS Code、Zed、JetBrains と連携できます。"
  t180: "カスタムプロバイダー: config.yaml の custom_providers に名前付きエンドポイントを保存できます。"
  t181: "SCOUT_EPHEMERAL_SYSTEM_PROMPT は、履歴に一切保存されないシステムプロンプトを注入します。"
  t182: "credential_pool_strategies は fill_first、round_robin、least_used、random のローテーションに対応しています。"
  t183: "scout auth add anthropic または scout auth add openai-codex で、OAuth ベースのプロバイダーを設定できます。"
  t184: "API サーバーは Chat Completions と、サーバー側で状態を保持する Responses API の両方に対応しています。"
  t185: "設定で tool_preview_length: 0 にすると、スピナーのアクティビティ表示にファイルパスが省略なしで表示されます。"
  t186: "scout status --deep は、すべてのコンポーネントに対してより詳しい診断チェックを実行します。"
  t187: "cron ジョブには Python スクリプト（--script）を添付でき、その標準出力がコンテキストとしてプロンプトに注入されます。"
  t188: "cron スクリプトは ~/.scout/scripts/ に置かれ、エージェントより先に実行されます。データ収集パイプラインに最適です。"
  t189: "config.yaml の prefill_messages_file は、すべての API 呼び出しに few-shot の例を注入します。履歴には保存されません。"
  t190: "SOUL.md はエージェントのデフォルトのアイデンティティを完全に置き換えます。書き換えて Scout を自分のものにしましょう。"
  t191: "SOUL.md は初回実行時にデフォルトのパーソナリティで自動生成されます。編集してカスタマイズしてください。"
  t192: "/compress <focus topic> は要約予算の 60〜70% を指定したトピックに割り当て、残りを大胆に切り詰めます。"
  t193: "2 回目以降の圧縮では、圧縮エンジンはゼロからやり直すのではなく前回の要約を更新します。"
  t194: "ゲートウェイセッションのリセット前に、Scout は重要な事実をバックグラウンドで自動的にメモリへ書き出します。"
  t195: "config.yaml で network.force_ipv4: true にすると、IPv6 が壊れたサーバーでのハングを修正します（socket をモンキーパッチします）。"
  t196: "terminal ツールは一般的な終了コードに注釈を付けます。例: grep が 1 を返した場合は「一致なし（エラーではありません）」。"
  t197: "失敗したフォアグラウンドのターミナルコマンドは、指数バックオフ（2 秒、4 秒、8 秒）で最大 3 回自動再試行されます。"
  t198: "単独の sudo コマンドは .env の SUDO_PASSWORD をパイプする形に自動書き換えされるため、対話的なプロンプトは不要です。"
  t199: "execute_code のヘルパーは明示的なインポートが必要です: from scout_tools import json_parse, shell_quote, retry。"
  t200: "execute_code の 7 つのサンドボックスツール（web_search、terminal、read/write/search/patch）は RPC を使い、コンテキストには一切入りません。"
  t201: "同じファイル領域を 3 回以上読むと警告が出ます。4 回以上ではループ防止のため強制的にブロックされます。"
  t202: "write_file と patch は、最後に読んだ後にファイルが外部で変更されていないかを検出し、古くなっている場合は警告します。"
  t203: "V4A パッチ形式は Update だけでなく、Add File、Delete File、Move File のディレクティブにも対応しています。"
  t204: "MCP サーバーはサンプリングによって LLM の補完を逆に要求できます。エージェントがサーバーのツールになるわけです。"
  t205: "MCP サーバーが notifications/tools/list_changed を送ると、再起動なしでツールが自動的に再登録されます。"
  t206: "delegate_task に acp_command: 'claude' を指定すると、どのプラットフォームからでも Claude Code を子エージェントとして起動できます。"
  t207: "委譲にはハートビートスレッドがあり、子の活動が親に伝わるため、ゲートウェイのタイムアウトを防げます。"
  t208: "プロバイダーが HTTP 402（支払いが必要）を返すと、補助クライアントは自動的に次のプロバイダーへフォールバックします。"
  t209: "agent.tool_use_enforcement は、ツールを呼ばずに操作を説明するだけのモデルをステアします。GPT/Codex では auto です。"
  t210: "agent.restart_after_turn_timeout は /restart が stop() に入る前に進行中のターンを完了させます。restart_drain_timeout は stop() 開始後の強制中断までの猶予に過ぎません。"
  t211: "agent.api_max_retries（デフォルト 3）は、失敗した API 呼び出しをエラーとして表面化させる前に何回再試行するかを制御します。素早くフォールバックしたいなら小さくしてください。"
  t212: "ゲートウェイはセッションごとに AIAgent インスタンスをキャッシュします。このキャッシュを破棄すると Anthropic のプロンプトキャッシュが壊れます。"
  t213: "どの Web サイトも /.well-known/skills/index.json でスキルを公開でき、スキルハブが自動的に検出します。"
  t214: "~/.scout/skills/.hub/audit.log のスキル監査ログには、すべてのインストールと削除の操作が記録されます。"
  t215: "古い git ワークツリーは起動時に自動整理されます。クリーンで完全にマージ済みのツリーは削除され、変更や未プッシュの作業があるものは必ず保持されます。"
  t216: "プロファイルは SCOUT_HOME で Scout の状態を分離します。terminal.home_mode が profile でない限り、ホスト側ツールのサブプロセスは本来の HOME を維持します。"
  t217: "環境変数 SCOUT_HOME_MODE（8 進数、例: 0701）で、Web サーバーがたどれるようにディレクトリのパーミッションを指定できます。"
  t218: "コンテナモード: SCOUT_HOME に .container-mode を置くと、ホストの CLI が自動的にコンテナ内で実行されます。"
  t219: "エージェント実行中のすべての中断は、タイムスタンプ付きで ~/.scout/interrupt_debug.log に記録されます。"
  t220: "BROWSER_CDP_URL はブラウザツールを実行中の任意の Chromium 系ブラウザに接続します。WebSocket、HTTP、host:port を受け付けます。"
  t221: "BROWSERBASE_ADVANCED_STEALTH=true は、カスタム Chromium による高度な検出回避を有効にします（Scale プラン）。"
  t222: "CLI は幅が 80 桁未満のターミナルでは自動的にコンパクトモードに切り替わります。"
  t223: "クイックコマンドには 2 種類あります。exec（シェルコマンドを直接実行）と alias（別のコマンドへリダイレクト）です。"
  t224: "タスクごとの委譲モデル: 設定の delegation.model と delegation.provider で、サブエージェントを安価なモデルへ振り分けられます。"
  t225: "delegation.reasoning_effort は、サブエージェントの思考の深さを独立して制御します。"
  t226: "設定の human_delay.mode は人間のタイピング速度を模倣します。min_ms/max_ms の範囲を設定できます。"
  t227: "設定のバージョン移行は読み込み時に自動的に実行されるため、新しい設定キーは手作業なしで現れます。"
  t228: "GPT と Codex のモデルには、ツール規律と必須のツール使用に関する特別なシステムプロンプトの指針が与えられます。"
  t229: "Gemini モデルには、絶対パス、並列ツール呼び出し、非対話的コマンドに関する専用の指示が与えられます。"
  t230: "config.yaml の context.engine にプラグイン名を設定すると、別のコンテキスト管理戦略を使えます。"
  t231: "15,000 文字を超えるブラウザページのスナップショットは切り詰めまたは自動要約され、全文は read_file でページ送りできるよう cache/web に保存されます。"
  t232: "圧縮エンジンは安価な前処理を行います。LLM を実行する前に、200 文字を超えるツール出力をプレースホルダーに置き換えます。"
  t233: "圧縮が失敗すると、API への連打を避けるため以降の試行が 10 分間停止されます。"
  t234: "長い危険なコマンド（70 文字超）には、承認プロンプトに全文を先に確認できる「view」オプションが付きます。"
  t235: "音声録音中は、マイクの RMS レベルに基づいて ▁▂▃▄▅▆▇ のバーで音量が可視化されます。"
  t236: "プロファイル名は既存の PATH 上のバイナリと重複できません。「scout profile create ls」は拒否されます。"
  t237: "scout profile create backup --clone-all は、設定、キー、SOUL.md、メモリ、スキル、セッションのすべてをコピーします。"
  t238: ".cursorrules と .cursor/rules/*.mdc ファイルは自動検出され、プロジェクトのコンテキストとして読み込まれます。"
  t239: "コンテキストファイルは 10 種類以上のプロンプトインジェクションのパターンを検出します。不可視の Unicode、「指示を無視せよ」、情報の持ち出しの試みなどです。"
  t240: "GPT-5 と Codex はメッセージ形式で 'system' の代わりに 'developer' ロールを使います。"
  t241: "タスクごとの補助モデルの上書き: config.yaml の auxiliary.vision.provider、auxiliary.compression.model など。"
  t242: "補助クライアントは 'main' をプロバイダーの別名として扱い、実際のプライマリプロバイダーとモデルに解決します。"
  t243: "scout claw migrate --dry-run は、何も書き込まずに OpenClaw からの移行内容をプレビューします。"
  t244: "引用符付きやスペースがエスケープされた状態で貼り付けたファイルパスは自動的に処理されるため、手で整える必要はありません。"
  t245: "スラッシュコマンドは大量貼り付けの折りたたみを引き起こしません。大きな引数を付けた /command も正しく動作します。"
  t246: "中断モードでは、エージェント実行中に入力したスラッシュコマンドは中断ロジックを経由せず即座に実行されます。"
  t247: "SCOUT_DEV=1 は、ローカル開発のためにコンテナモードの検出を回避します。"
  t248: "各 MCP サーバーには独自のツールセット（mcp-servername）があり、scout tools で個別にオン/オフできます。"
  t249: "設定内の MCP の ${ENV_VAR} プレースホルダーはサーバー起動時に解決され、~/.scout/.env の変数も対象です。"
  t250: "信頼済みリポジトリ（SpaceshipResearch）のスキルは「trusted」セキュリティレベルになり、コミュニティのスキルは追加のスキャンを受けます。"
  t251: "~/.scout/skills/.hub/quarantine/ のスキル隔離領域には、セキュリティレビュー待ちのスキルが保管されます。"
  t252: "/steer <prompt> は次のツール呼び出しの後にメモを注入します。中断せずにタスクの途中で方向を修正できます。"
  t253: "/goal <text> は継続的な Ralph ループの目標を設定します。ジャッジが完了と判定するまで、Scout はターンを自動で続けます。"
  t254: "/snapshot create [label] は Scout 設定の完全な状態スナップショットを保存し、/snapshot restore <id> で後から戻せます。"
  t255: "/copy [N] は最後のアシスタント応答をクリップボードにコピーします。番号を付けると最後から N 番目をコピーします。"
  t256: "/redraw は UI 全体を強制的に再描画し、tmux のリサイズやマウス選択の残骸によるターミナルのずれを直します。"
  t257: "/agents（別名 /tasks）は、現在のセッションで動作中のエージェントと実行中のバックグラウンドタスクを表示します。"
  t258: "/footer は最終応答に付くゲートウェイのフッター（モデル、コンテキスト使用率、cwd）の表示を切り替えます。"
  t259: "/busy queue|steer|interrupt は、Scout の作業中に Enter を押したときの動作を制御します。"
  t260: "/approve session|always は保留中の危険なコマンドを選んだ信頼範囲で実行し、/deny は拒否します。"
  t261: "/restart は実行中の処理を完了させてからゲートウェイを安全に再起動し、復帰後に要求者へ通知します。"
  t262: "/kanban boards switch <slug> で、チャット内からアクティブなマルチプロジェクトの Kanban ボードを切り替えられます。"
  t263: "/reload は実行中のセッションに ~/.scout/.env を再読み込みします。再起動せずに新しい API キーを反映できます。"
  t264: "no_agent=True の cronjob はスクリプトをスケジュール実行し、その標準出力をそのまま送信します。トークンも LLM もゼロです。"
  t265: "cron スクリプトの標準出力が空ならサイレントティックとなり、何も配信されません。しきい値の監視に最適です。"
  t266: "SCOUT_CRON_MAX_PARALLEL（デフォルト 4）は 1 ティックあたりに実行する cron ジョブ数を制限し、バーストでキーが飽和しないようにします。"
  t267: "ゲートウェイフックは ~/.scout/hooks/<name>/ に HOOK.yaml と handler.py を置きます。ハンドラー名は `handle` にする必要があります。"
  t268: "フックのイベントには gateway:startup、session:start、agent:step、そして command:* のワイルドカード購読があります。"
  t269: "~/.scout/BOOT.md にチェックリストを置くと、gateway:startup フックが起動ごとにワンショットのエージェントとして実行します。"
  t270: "scout curator run --dry-run は、何も変更せずにキュレーターがアーカイブや統合する内容をプレビューします。"
  t271: "scout curator pin <skill> は、自動アーカイブとエージェントの skill_manage ツールの両方からスキルを保護します。"
  t272: "scout curator rollback は実行前のスナップショットからスキルを復元します。バックアップは skills/.curator_backups/ にあります。"
  t273: "scout auth reset <provider> [target] は、認証情報プール全体、またはインデックス・id・ラベルで指定した 1 件のクールダウンと枯渇フラグをクリアします。"
  t274: "credential_pool_strategies.<provider>: round_robin は、デフォルトの fill_first ではなくキーを均等に巡回させます。"
  t275: "scout tools でツールごとにプロバイダーを選べます（Web 検索、画像、TTS、ブラウザー）。それぞれ自分の API キーを使います。"
  t276: "provider_routing.data_collection: deny は、OpenRouter 上でデータを保存するプロバイダーを除外します。"
  t277: "provider_routing.require_parameters: true は、リクエストのすべてのパラメーターに対応するプロバイダーだけにルーティングします。"
  t278: "scout dashboard は 127.0.0.1:9119 でローカル Web UI を起動します。データは localhost の外に一切出ません。"
  t279: "~/.scout/dashboard-themes/ にパレット色 2 つを書いた YAML を置くだけで、ダッシュボード全体の見た目を変えられます。"
  t280: "ダッシュボードプラグインはドロップイン方式です。~/.scout/dashboard-plugins/ に manifest.json と JS バンドルを置くだけで、npm ビルドは不要です。"
  t281: "ダッシュボードテーマで layoutVariant: cockpit を指定すると、プラグインが sidebar スロットから内容を配置できる 260px の左レールが追加されます。"
  t282: "SCOUT_BACKGROUND_NOTIFICATIONS=result は、バックグラウンドタスクの完了時だけ通知します（他に concise/all/error/off）。"
  t283: "SCOUT_WRITE_SAFE_ROOT は write_file/patch の書き込み先をディレクトリプレフィックスに制限します。複数パスは os.pathsep（: または ;）で区切ります。"
  t284: "SCOUT_IGNORE_RULES は AGENTS.md、SOUL.md、.cursorrules、メモリ、プリロードされたスキルの自動注入をスキップします。"
  t285: "SCOUT_ACCEPT_HOOKS は、config.yaml で宣言された未確認のシェルフックを TTY のプロンプトなしで自動承認します。"
  t286: "auxiliary.goal_judge.model で /goal のジャッジを安価で高速なモデルに振り分け、ループのコストをほぼゼロに抑えられます。"
  t287: "チェックポイントは、巨大なモノレポで git 操作が遅くなるのを避けるため、ファイル数が 50,000 を超えるディレクトリをスキップします。"
  t288: "tts.provider: piper は 44 言語対応のローカル TTS を CPU で実行します。音声モデルは ~/.scout/cache/piper-voices/ に自動ダウンロードされます。"
  t289: "tts.providers.<name>.type: command は、{input_path} と {output_path} のプレースホルダーで任意の CLI TTS エンジンを接続します。"
  t290: "API_SERVER_ENABLED=true は、Open WebUI や LibreChat 向けに、ゲートウェイと並行して OpenAI 互換エンドポイントを起動します。"
  t291: "batch_runner.py --resume は完了済みプロンプトをテキスト内容で照合するため、データセットの順序が変わっても完了した作業を再実行しません。"
  t292: "/new はその場で新しいセッションを開始します（別名 /reset）。新しいセッション ID、空の履歴、CLI は開いたままです。"
  t293: "/clear はターミナル画面を消去し、さらに新しいセッションを開始します。見た目のリセットをワンステップで行えます。"
  t294: "/save はセッションを終了せずに現在の会話をディスクに書き込みます。"
  t295: "/status はセッション情報（ID、タイトル、モデル、トークン使用量、経過時間）を一目で確認できます。"
  t296: "/image <path> は、貼り付けやドラッグ＆ドロップなしでローカルの画像ファイルを次のプロンプトに添付します。"
  t297: "/commands はスラッシュコマンドとインストール済みスキルの全一覧をページ送りで表示します。タブ補完のないプラットフォームで便利です。"
  t298: "/toolsets は利用可能なすべてのツールセットを一覧表示し、-t/--toolsets に何を渡せるかがわかります。"
  t299: "/reload-skills は ~/.scout/skills/ を再スキャンするため、セッションを再起動せずに追加したスキルが現れます。"
  t300: "/debug はサポートバンドル（システム情報とログ）をアップロードして共有用リンクを返します。チャットでも使えます。"
  t301: "scout dump --show-keys は、より詳しいサポートデバッグ用にマスク済みの API キーのフィンガープリントを含めます。"
  t302: "scout sessions rename <ID> \"new title\" で過去のセッション名を変更でき、scout sessions delete <ID> で削除できます。"
  t303: "scout import は Scout の完全バックアップ zip を復元します。セッションの JSON/JSONL エクスポートはダッシュボードの Sessions ページから取り込めます。"
  t304: "scout fallback は fallback_model チェーンを対話的に管理します。config.yaml を手で編集する必要はありません。"
  t305: "scout setup は、プロバイダー、キー、プラットフォームの接続設定を 1 つの対話フローで初回ユーザーに案内します。"
  t306: "scout status --deep はすべてのコンポーネントの完全なヘルスチェックを実行します。通常の scout status は簡易表示です。"
  t307: "SCOUT_AGENT_TIMEOUT=0 は実行中のエージェントに対するゲートウェイの無操作による強制終了を無効にします。長時間の調査に使ってください。"
  t308: "SCOUT_ENABLE_PROJECT_PLUGINS=1 は ./.scout/plugins/ のリポジトリ内プラグインを自動読み込みします。設計上、信頼確認を経ます。"
  t309: "SCOUT_DISABLE_FILE_STATE_GUARD=1 は、patch と write_file の「読んだ後にファイルが変更された」ガードをオフにします。"
  t310: "SCOUT_ALLOW_PRIVATE_URLS=true は Web ツールから localhost やプライベートネットワークへのアクセスを許可します。ゲートウェイモードではデフォルトでオフです。"
  t311: "SCOUT_OPTIONAL_SKILLS=name1,name2 は、プロファイルごとの初回実行時にオプションカタログの追加スキルを自動インストールします。"
  t312: "SCOUT_BUNDLED_SKILLS はカスタムの同梱スキルツリーを指します。Homebrew と Nix のパッケージングで使われます。"
  t313: "SCOUT_DUMP_REQUEST_STDOUT=1 は、すべての API リクエストのペイロードをログファイルではなく stdout に出力します。"
  t314: "SCOUT_OAUTH_TRACE=1 は、プロバイダー認証のデバッグ用にマスク済みの OAuth トークン交換と更新の試行を記録します。"
  t315: "SCOUT_STREAM_RETRIES（デフォルト 3）は、一時的なネットワークエラー時のストリーム途中での再接続回数を制御します。"
  t316: "SCOUT_GATEWAY_BUSY_ACK_ENABLED=false は、作業中のエージェントにユーザーがメッセージを送った際の ⚡/⏳/⏩ の応答メッセージを抑制します。"
  t317: "SCOUT_AGENT_NOTIFY_INTERVAL（デフォルト 180s）は、長いターンでゲートウェイが進捗を通知する間隔を設定します。"
  t318: "SCOUT_RESTART_DRAIN_TIMEOUT（デフォルト 900s）は、/restart が強制実行に移る前に進行中の処理を待つ時間の上限です。"
  t319: "SCOUT_CHECKPOINT_TIMEOUT（デフォルト 30s）はファイルシステムのチェックポイント作成時間の上限です。巨大なモノレポでは大きくしてください。"
  t320: "config.yaml の image_gen.model で FAL のモデルを選べます。flux-2/klein、gpt-image-2、nano-banana-pro などです。"
  t321: "image_gen.provider は、デフォルトの代わりにプラグイン（OpenAI Images、Codex、FAL）経由で画像生成をルーティングします。"
  t322: "AUXILIARY_VISION_BASE_URL と AUXILIARY_VISION_API_KEY で、画像解析を任意の OpenAI 互換エンドポイントに向けられます。"
  t323: "security.tirith_fail_open: false にすると、tirith スキャナー自体がエラーになった場合に Scout はコマンドをブロックします。"
  t324: "環境変数 TIRITH_FAIL_OPEN は tirith_fail_open の設定を上書きします。config.yaml を編集せずに素早く切り替えられます。"
  t325: "セッション ID はタイムスタンプで始まる（20250305_091523_abcd）ため、ls や jq で自然に並べ替えられます。"
  t326: "API_SERVER_MODEL_NAME は /v1/models に表示されるモデル名をカスタマイズします。複数プロファイルの Open WebUI 構成では必須です。"
  t327: "ダッシュボードプラグインは /dashboard-plugins/<name>/ から配信されます。ファイルを ~/.scout/dashboard-plugins/ に置いてください。"
  placeholder:
    p01: "何でも質問するか、/ を入力してコマンドを表示…"
    p02: "このフォルダーの内容を要約して"
    p03: "受信トレイの最新メールへの返信を下書きして"
    p04: "機能を計画して、段階的に実装して"
    p05: "失敗しているテストを見つけて修正して"
    p06: "このトピックを調査して概要をまとめて"
    p07: "このリポジトリで最近何が変わった？"
    p08: "このメモを To-Do リストにして"
    p09: "このエラーの意味と修正方法を説明して"
    p10: "リマインダーを設定するか、定期タスクをスケジュールして"
    p11: "/ でコマンドを参照、Ctrl+P でパレットを開けます"
