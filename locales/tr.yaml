  exit:
    all_retries_exhausted_no_response: "model sağlayıcısı tüm yeniden denemelere rağmen yanıt vermedi. /retry gönderin veya /model ile model değiştirin."
    partial_stream_recovery: "akış erken kesildi ve yalnızca kısmi bir yanıt kurtarılabildi. Kaldığı yerden devam etmesi için `continue` gönderin."
    fallback_prior_turn_content: "bu turda yeni içerik üretilmedi; kurtarılan önceki bağlam gösteriliyor. Yeniden denemek için `continue` gönderin."
    redirect_restart_limit_exceeded: "istek her denemede yeni bir düzeltmeyle iptal edildiği için tur, sonsuza dek yeniden denemek yerine durduruldu. Son düzeltmeniz bir sonraki mesaj olarak kuyruğa alındı."
    rebuilt_restart_limit_exceeded: "yedek zincirindeki her sağlayıcı sürekli bir sonrakine devrettiği için tur, sonsuza dek yeniden denemek yerine durduruldu. `continue` gönderin veya sağlayıcı değiştirin."
    budget_exhausted: "tur başına yineleme/maliyet bütçesi nihai bir yanıt üretilmeden tükendi. Devam etmek için `continue` gönderin."
    ollama_runtime_context_too_small: "yerel modelin bağlam penceresi işi bitirmek için çok küçüktü. Bağlam boyutunu artırın veya daha büyük bir model kullanın."
    pending_tool_result: "tur, bir araç sonucu hâlâ beklenirken durdu ve model devam metni üretmedi. Özetlemesi için `continue` gönderin."
    interrupted_during_api_call: "istek, yanıt alınamadan çağrının ortasında kesildi. Yeniden denemek için `continue` gönderin."
    max_iterations_reached: "nihai bir yanıt üretilmeden azami araç yineleme sınırına ulaşıldı. Devam etmek için `continue` gönderin veya `max_iterations` değerini yükseltin."
    error_near_max_iterations: "nihai bir yanıt üretilmeden, yineleme sınırına yakın bir noktada hata oluştu. Yukarıdaki araç çıktısını kontrol edin, ardından `continue` gönderin."
    repeated_outer_errors: "tur tekrarlanan hatalarla sürekli başarısız olduğu için sonsuza dek yeniden denemek yerine erken durduruldu. Yukarıdaki hataları kontrol edin, ardından yeniden denemek için `continue` gönderin."
  persistence:
    compression: "tur durduruldu çünkü başka bir süreç bu oturumu sıkıştırıyordu. Mesajınız zaten kaydedilmiş olmalı — sıkıştırma tamamlandıktan sonra lütfen yeniden gönderin."
    compression_closed: "tur durduruldu çünkü bu oturum bağlam sıkıştırmasıyla döndürüldü ve canlı devamı devralınamadı. Depolamanın kendisi sağlam — yeni oturum kimliğini alması için istemciyi yenileyin (veya yeni bir tur başlatın), sonra mesajınızı yeniden gönderin."
    turn_lease: "tur durduruldu çünkü başka bir Scout süreci bu oturumu devraldı. Yanıtınız kaydedilmedi — diğer sürecin bitmesini bekleyin, sonra mesajınızı yeniden gönderin."
    session_row_missing: "bu oturum sohbet hâlâ açıkken depolamadan silindi ve Scout onu yeniden oluşturamadı; bu nedenle bu mesaj kaydedilmedi. Mesajınızı yeniden gönderin; sorun sürerse `scout {profile_arg}doctor` çalıştırın."
    locked: "tur durduruldu çünkü oturum depolaması meşguldü (başka bir Scout süreci durum veritabanına yazıyordu). Mesajınız zaten kaydedilmiş olmalı — lütfen birazdan yeniden gönderin."
    replaced: "oturum veritabanı dosyası Scout çalışırken değiştirildi; bu nedenle bu mesaj kaydedilmedi (bir kopyası {home}/sessions/ altında tutuluyor). Scout'i durdurun (`scout {profile_arg}gateway stop`), `scout {profile_arg}doctor` çalıştırın — `scout {profile_arg}doctor --fix` DEĞİL; o, yanlış dosyayı yerinde onarır — sonra yeniden başlatıp mesajınızı bir kez daha gönderin. İleri düzey kurtarma adımları günlükte."
    deleted_wal: "başka bir Scout süreci oturum veritabanının önceden yazma günlüğünün (WAL) eski bir kopyasını hâlâ tutuyor; bu yüzden Scout dosyayı korumak için yazmayı durdurdu ve bu mesaj kaydedilmedi (bir kopyası {home}/sessions/ altında tutuluyor). Hiçbir şey kaybolmadı. Bu profildeki her Scout sürecinden çıkın (Masaüstü uygulaması, `scout {profile_arg}gateway stop`, panel, cron), `scout {profile_arg}doctor` çalıştırın — günlüğü hâlâ tutan süreçleri adıyla gösterir — sonra Scout'i yeniden başlatıp mesajınızı bir kez daha gönderin. Süreçler çalışırken `doctor --fix` çalıştırmayın ve hiçbir state.db dosyasını silmeyin. Kılavuz: {recovery_docs}"
    corrupt: "tur durduruldu çünkü durum veritabanı yapısal bozulma bildirdi (yeniden başlatmada transkript kaybolacaktı). Disk alanı boşaltmak işe yaramaz. Kurtarma seçenekleri:\n1. `scout {profile_arg}doctor --fix` çalıştırın\n2. Gateway'i durdurun, sonra şununla kurtarın:\n   scout {profile_arg}sessions recover --source {db_path} --inspect-only\n   (kurtarılabilir bildirirse) scout {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — kurtarma önce hasarlı dosyanın anlık görüntüsünü alır; canlı state.db üzerinde `sqlite3 ... \\\".recover\\\"` ÇALIŞTIRMAYIN, güvenlik açığı olan bir sqlite3 CLI dosyayı daha da bozabilir\n3. {backups_dir}/ içindeki bir yedekten geri yükleyin\nArdından mesajınızı yeniden gönderin."
    fts_index: "tur durduruldu çünkü oturum arama dizini (FTS5) bozuk ve ayrılamadı; bu nedenle bu mesaj kaydedilmedi. Mesaj deposunun kendisi hasarlı değil: kurtarma araçları çalıştırmayın ve yedek geri yüklemeyin. `scout {profile_arg}doctor --fix` çalıştırın (veya Scout'i yeniden başlatın; dizini açılışta onarır), sonra mesajınızı yeniden gönderin."
    disk: "Scout bu konuşmayı diske kaydedemedi; mesajlarınızı kaybetmektense durdu. Disk büyük olasılıkla dolu: biraz yer açın (veya {home}/state.db dosyasının izinlerini düzeltin), sonra mesajınızı yeniden gönderin."
    default: "Scout bu konuşmayı kaydedemedi; mesajlarınızı kaybetmektense durdu. Olası nedenler: sürücüde yer kalmamış ya da başka bir Scout süreci veritabanını tutuyor. Diğer Scout pencerelerini kapatın, depolamayı kontrol etmek için `scout {profile_arg}doctor` çalıştırın, sonra mesajınızı yeniden gönderin."
  file_mutation:
    header: "⚠️ Dosya değişikliği doğrulayıcısı: yukarıdaki ifadeler aksini düşündürse bile bu turda {count} dosya düzenlemesi BAŞARISIZ oldu. Gerçekte neyin uygulandığını doğrulamak için `git status` veya `read_file` çalıştırın."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "başarısız"
  shared:
    and_more: "  • … ve {count} tane daha"
    the_model: "Model"
tips:
  t001: "/bg <prompt> bir görevi ayrı bir oturumda çalıştırır, mevcut oturumunuz boş kalır; /btw <question> ise bu konuşma hakkındaki yan bir soruyu konuşmayı bölmeden yanıtlar."
  t002: "/branch mevcut oturumu çatallar; böylece ilerlemenizi kaybetmeden farklı bir yönü keşfedebilirsiniz."
  t003: "/compress konuşma uzadığında bağlamı elle sıkıştırır."
  t004: "/rollback dosya sistemi kontrol noktalarını listeler — ajanın değiştirdiği dosyaları önceki herhangi bir duruma geri alın."
  t005: "/rollback diff 2 hiçbir şeyi geri almadan 2. kontrol noktasından bu yana nelerin değiştiğini gösterir."
  t006: "/rollback 2 src/file.py tek bir dosyayı belirli bir kontrol noktasından geri yükler."
  t007: "/title \"my project\" oturumunuza ad verir — daha sonra /resume veya scout -c ile devam edin."
  t008: "/resume daha önce adlandırılmış bir oturumda kaldığınız yerden devam eder."
  t009: "/queue <prompt> mevcut turu bölmeden bir mesajı sonraki tur için sıraya alır."
  t010: "/undo konuşmadaki son kullanıcı/asistan alışverişini kaldırır."
  t011: "/retry son mesajınızı yeniden gönderir — ajanın yanıtı tam istediğiniz gibi olmadığında kullanışlıdır."
  t012: "/verbose araç ilerleme görünümünü sırayla değiştirir: off → new → all → verbose."
  t013: "/reasoning high modelin düşünme derinliğini artırır. /reasoning show akıl yürütmeyi gösterir."
  t014: "/fast daha hızlı API yanıtları için öncelikli işlemeyi açar/kapatır (sağlayıcıya bağlıdır)."
  t015: "/yolo oturumun geri kalanında tüm tehlikeli komut onay istemlerini atlar."
  t016: "/model oturum ortasında model değiştirmenizi sağlar — /model sonnet veya /model gpt-5 deneyin."
  t017: "/model --global varsayılan modelinizi kalıcı olarak değiştirir."
  t018: "/personality pirate eğlenceli bir kişilik ayarlar — kawaii'den shakespeare'e 14 yerleşik seçenek."
  t019: "/tools disable browser tarayıcı araçlarını mevcut oturum için geçici olarak kaldırır."
  t020: "/browser connect tarayıcı araçlarını CDP üzerinden çalışan Chromium tabanlı tarayıcınıza bağlar."
  t021: "/plugins kurulu eklentileri ve durumlarını listeler."
  t022: "/reload-mcp MCP sunucu yapılandırmasını yeniden başlatmadan anında yeniden yükler."
  t023: "/usage token kullanımını, maliyet dağılımını ve oturum süresini gösterir."
  t024: "/insights son 30 günün kullanım analizlerini gösterir."
  t025: "/paste panonuzda görsel olup olmadığını kontrol eder ve sonraki mesajınıza ekler."
  t026: "/profile hangi profilin etkin olduğunu ve ana dizinini gösterir."
  t027: "/config mevcut yapılandırmanızı tek bakışta gösterir."
  t028: "/stop ajanın başlattığı tüm çalışan arka plan süreçlerini sonlandırır."
  t029: "@file:path/to/file.py dosya içeriğini doğrudan mesajınıza ekler."
  t030: "@file:main.py:10-50 bir dosyanın yalnızca 10-50. satırlarını ekler."
  t031: "@folder:src/ bir dizin ağacı listesi ekler."
  t032: "@diff hazırlanmamış (unstaged) git değişikliklerinizi mesaja ekler."
  t033: "@staged hazırlanmış (staged) git değişikliklerinizi ekler (git diff --staged)."
  t034: "@git:5 son 5 commit'i tam yamalarıyla ekler."
  t035: "@url:https://example.com bir web sayfasının içeriğini indirip ekler."
  t036: "@ yazmak dosya sistemi yol tamamlamayı tetikler — herhangi bir dosyaya etkileşimli olarak gidin."
  t037: "Birden fazla referansı birleştirin: \"Review @file:main.py and @file:test.py for consistency.\""
  t038: "Ajan çalışırken yeni bir mesaj yazarak onu durdurup yönlendirebilirsiniz."
  t039: "5+ satır yapıştırıldığında içerik otomatik olarak bir dosyaya kaydedilir ve yerine kısa bir referans eklenir."
  t040: "scout -c en son CLI oturumunuza devam eder. scout -c \"project name\" başlığa göre devam eder."
  t041: "scout -w yalıtılmış bir git worktree oluşturur — paralel ajan iş akışları için idealdir."
  t042: "scout -p work chat varsayılanınızı değiştirmeden belirli bir profil altında çalışır."
  t043: "scout doctor --fix yapılandırma ve bağımlılık sorunlarını tanılar ve otomatik olarak onarır."
  t044: "scout dump kısa bir kurulum özeti verir — hata raporları için çok kullanışlıdır."
  t045: "scout config set KEY VALUE gizli anahtarları otomatik olarak .env dosyasına, diğer her şeyi config.yaml dosyasına yönlendirir."
  t046: "scout config edit config.yaml dosyasını varsayılan düzenleyicinizde açar."
  t047: "scout config check eksik veya eskimiş yapılandırma seçeneklerini tarar."
  t048: "scout sessions browse arama özellikli etkileşimli bir oturum seçici açar."
  t049: "scout sessions stats platforma göre oturum sayılarını ve veritabanı boyutunu gösterir."
  t050: "scout sessions prune --older-than 30 eski oturumları temizler."
  t051: "scout skills search react --source skills-sh skills.sh genel dizininde arama yapar."
  t052: "scout skills check kurulu hub skill'lerini yukarı akış güncellemeleri için tarar."
  t053: "scout skills tap add myorg/skills-repo özel bir GitHub skill kaynağı ekler."
  t054: "scout skills snapshot export setup.json skill yapılandırmanızı yedekleme veya paylaşım için dışa aktarır."
  t055: "scout mcp add github --command npx komut satırından MCP sunucuları ekler."
  t056: "scout mcp serve Scout'in kendisini diğer ajanlar için bir MCP sunucusu olarak çalıştırır."
  t057: "scout auth add kimlik bilgisi havuzu rotasyonu için birden fazla API anahtarı eklemenizi sağlar."
  t058: "scout logs -f agent.log dosyasını gerçek zamanlı izler. --level WARNING --since 1h çıktıyı filtreler."
  t059: "scout backup tüm Scout ana dizininizin zip yedeğini oluşturur."
  t060: "scout profile create coder kendi komutu haline gelen yalıtılmış bir profil oluşturur."
  t061: "scout profile create work --clone mevcut yapılandırmanızı ve anahtarlarınızı yeni bir profile kopyalar."
  t062: "scout update yeni paketlenmiş skill'leri TÜM profillere otomatik olarak eşitler."
  t063: "scout gateway install Scout'i sistem hizmeti olarak kurar (systemd/launchd)."
  t064: "scout memory setup harici bir bellek sağlayıcısı (Honcho, Mem0 vb.) yapılandırmanızı sağlar."
  t065: "scout webhook subscribe HMAC doğrulamalı, olay güdümlü webhook rotaları oluşturur."
  t066: "Tasarruf edin: scout tools kullanılmayan araçları devre dışı bırakır, scout skills config skill'leri azaltır."
  t067: "/reasoning low veya /reasoning minimal düşünme derinliğini varsayılanın (medium) altına çeker — daha hızlı, daha ucuz yanıtlar."
  t068: "scout models görüntü, sıkıştırma ve yardımcı görevleri daha ucuz modellere yönlendirir — ana sohbet modelinizi düşürmeden arka plan token maliyetini %85+ azaltır."
  t069: "Uzun görevler bittiğinde zil sesi duymak için config.yaml içinde display.bell_on_complete: true ayarlayın."
  t070: "Model üretirken token'ların gerçek zamanlı akmasını görmek için display.streaming: true ayarlayın."
  t071: "Modelin düşünce zincirini izlemek için display.show_reasoning: true ayarlayın."
  t072: "Daha yoğun bilgi için çıktıdaki boşlukları azaltmak üzere display.compact: true ayarlayın."
  t073: "Mesajları ajanı bölmek yerine sıraya almak için display.busy_input_mode: queue, /steer ile çalışma sırasında iletmek için steer ayarlayın."
  t074: "Oturuma devam ederken tam konuşma özetini atlamak için display.resume_display: minimal ayarlayın."
  t075: "Otomatik sıkıştırmanın ne zaman tetikleneceğini denetlemek için compression.threshold: 0.50 ayarlayın (varsayılan: bağlamın %50'si)."
  t076: "Ajanın tur başına daha fazla araç çağrısı adımı atmasına izin vermek için agent.max_turns: 1000 ayarlayın."
  t077: "read_file çağrısı başına en fazla içeriği artırmak için file_read_max_chars: 200000 ayarlayın."
  t078: "Bir LLM'in güvenli komutları otomatik onaylaması ve tehlikelileri otomatik reddetmesi için approvals.mode: smart ayarlayın."
  t079: "Yedek bir sağlayıcıya otomatik geçiş için config.yaml içinde fallback_model ayarlayın."
  t080: "Kullanıcı kimliklerini ve telefon numaralarını LLM'e göndermeden önce hash'lemek için privacy.redact_pii: true ayarlayın."
  t081: "Tarayıcı oturumlarını otomatik olarak WebM video olarak kaydetmek için browser.record_sessions: true ayarlayın."
  t082: "Her zaman bir git worktree oluşturmak için config.yaml içinde worktree: true ayarlayın (scout -w ile aynı)."
  t083: "Belirli alan adlarını web araçlarından engellemek için security.website_blocklist.enabled: true ayarlayın."
  t084: "Ham ajan çıktısını cron üst bilgisi/alt bilgisi olmadan teslim etmek için cron.wrap_response: false ayarlayın."
  t085: "SCOUT_TIMEZONE sunucu saat dilimini herhangi bir IANA saat dilimi dizesiyle geçersiz kılar."
  t086: "config.yaml içinde ortam değişkeni değiştirme çalışır: ${VAR_NAME} sözdizimini kullanın."
  t087: "config.yaml içindeki hızlı komutlar kabuk komutlarını sıfır token kullanımıyla anında çalıştırır."
  t088: "Özel kişilikler config.yaml içinde agent.personalities altında tanımlanabilir."
  t089: "provider_routing OpenRouter sağlayıcı sıralamasını, beyaz listesini ve kara listesini denetler."
  t090: "execute_code Scout araçlarını programatik olarak çağıran Python betikleri çalıştırır — sonuçlar bağlamın dışında kalır."
  t091: "delegate_task paralel çalışma için yalıtılmış bağlamlara sahip, varsayılan olarak en fazla 10 eşzamanlı alt ajan (delegation.max_concurrent_children) başlatır."
  t092: "web_extract PDF URL'leriyle çalışır — herhangi bir PDF bağlantısı verin, markdown'a dönüştürür."
  t093: "search_files ripgrep tabanlıdır ve grep'ten hızlıdır — terminalde grep yerine bunu kullanın."
  t094: "patch 9 bulanık eşleştirme stratejisi kullanır; küçük boşluk farkları düzenlemeleri bozmaz."
  t095: "patch tek çağrıda toplu çok dosyalı düzenlemeler için V4A biçimini destekler."
  t096: "read_file bir dosya bulunamadığında benzer dosya adları önerir."
  t097: "read_file otomatik olarak tekilleştirir — değişmemiş bir dosyayı yeniden okumak hafif bir yer tutucu döndürür."
  t098: "browser_vision ekran görüntüsü alır ve yapay zekâ ile analiz eder — CAPTCHA'lar ve görsel içerik için çalışır."
  t099: "browser_console sayfa bağlamında JavaScript ifadeleri değerlendirebilir."
  t100: "image_generate FLUX 2 Pro ile ve otomatik 2x yükseltmeyle görseller oluşturur."
  t101: "todo aracı ajanın oturum sırasında karmaşık, çok adımlı görevleri takip etmesine yardımcı olur."
  t102: "session_search TÜM geçmiş konuşmalarda tam metin arama yapar."
  t103: "Ajan tercihleri, düzeltmeleri ve ortam bilgilerini otomatik olarak belleğe kaydeder."
  t104: "/moa zor bir istemi yapılandırdığınız Mixture of Agents model kümesi üzerinden yönlendirir."
  t105: "Terminal komutları uzun süren görevler için notify_on_complete ile arka plan modunu destekler."
  t106: "Terminal arka plan süreçleri belirli çıktı satırlarında uyarı vermek için watch_patterns destekler."
  t107: "terminal aracı 6 arka uç destekler: local, Docker, SSH, Modal, Daytona ve Singularity."
  t108: "Her profilin kendi yapılandırması, API anahtarları, belleği, oturumları, skill'leri ve cron işleri vardır."
  t109: "Profil adları kabuk komutuna dönüşür — 'scout profile create coder' komutu 'coder' komutunu oluşturur."
  t110: "scout profile export coder -o backup.tar.gz taşınabilir bir profil arşivi oluşturur."
  t111: "Oturumlar ilk alışverişten sonra otomatik olarak açıklayıcı başlıklar üretir — elle adlandırma gerekmez."
  t112: "Oturum başlıkları soy zincirini destekler: \"my project\" → \"my project #2\" → \"my project #3\"."
  t113: "Çıkarken Scout oturum kimliği ve istatistiklerle birlikte bir devam etme komutu yazdırır."
  t114: "scout sessions export backup.jsonl tüm oturumları yedekleme veya analiz için dışa aktarır."
  t115: "scout -r SESSION_ID kimliğine göre belirli bir geçmiş oturuma devam eder."
  t116: "Bellek dondurulmuş bir anlık görüntüdür — değişiklikler sistem isteminde yalnızca sonraki oturum başlangıcında görünür."
  t117: "Bellek girdileri istem enjeksiyonu ve veri sızdırma desenlerine karşı otomatik olarak taranır."
  t118: "Ajanın iki bellek deposu vardır: kişisel notlar (~2200 karakter) ve kullanıcı profili (~1375 karakter)."
  t119: "Ajana verdiğiniz düzeltmeler (\"hayır, şöyle yap\") çoğu zaman otomatik olarak belleğe kaydedilir."
  t120: "github, creative, mlops, productivity, research ve daha fazlasını kapsayan 80'den fazla paketlenmiş skill."
  t121: "Kurulu her skill otomatik olarak bir slash komutuna dönüşür — hepsini görmek için / yazın."
  t122: "scout skills install official/security/1password depodan isteğe bağlı skill'ler kurar."
  t123: "Skill'ler belirli işletim sistemleriyle sınırlanabilir — bazıları yalnızca macOS veya Linux'ta yüklenir."
  t124: "config.yaml içindeki skills.external_dirs özel dizinlerden skill yüklemenizi sağlar."
  t125: "Ajan skill_manage kullanarak prosedürel bellek olarak kendi skill'lerini oluşturabilir."
  t126: "/plan hiçbir şey çalıştırmadan .scout/plans/ dizinine markdown bir uygulama planı yazar."
  t127: "Cron işlerine skill eklenebilir: scout cron add --skill blogwatcher \"Check for new posts\"."
  t128: "Bir cron yanıtı [SILENT] ile başlarsa teslimat bastırılır — yalnızca izleme amaçlı işler için kullanışlıdır."
  t129: "Cron göreli gecikmeleri (30m), aralıkları (every 2h), cron ifadelerini ve ISO zaman damgalarını destekler."
  t130: "Cron işleri tamamen yeni ajan oturumlarında çalışır — istemler kendi başına yeterli olmalıdır."
  t131: "faster-whisper kuruluysa ses modu hiç API anahtarı olmadan çalışır (ücretsiz yerel konuşmadan yazıya dönüştürme)."
  t132: "Beş TTS sağlayıcısı mevcut: Edge TTS (ücretsiz), ElevenLabs, OpenAI, NeuTTS (ücretsiz yerel), MiniMax."
  t133: "Akışlı TTS cümleleri üretildikçe seslendirir — yanıtın tamamını beklemeniz gerekmez."
  t134: "scout gateway install, gateway'i açılışta başlayan bir sistem hizmeti olarak kurar."
  t135: "Webhook rotaları HMAC doğrulaması, hız sınırlama ve olay filtrelemeyi destekler."
  t136: "API sunucusu, Open WebUI ve LibreChat ile uyumlu, OpenAI uyumlu bir uç nokta sunar."
  t137: "group_sessions_per_user: true, grup sohbetlerinde her kişiye kendi oturumunu verir."
  t138: "Gateway, etkinliksizliğe dayalı zaman aşımlarını destekler — aktif ajanlar süresiz çalışabilir."
  t139: "Tehlikeli komut onayının 4 kademesi vardır: bir kez, oturum, her zaman (kalıcı izin listesi), reddet."
  t140: "Akıllı onay modu, güvenli komutları otomatik onaylamak ve tehlikeli olanları işaretlemek için bir LLM kullanır."
  t141: "SSRF koruması özel ağları, loopback, link-local ve bulut meta veri adreslerini engeller."
  t142: "Tirith ön çalıştırma taraması, homograf URL sahteciliğini ve yorumlayıcıya boru (pipe) desenlerini tespit eder."
  t143: "MCP alt süreçleri filtrelenmiş bir ortam alır — yalnızca güvenli sistem değişkenleri aktarılır."
  t144: "Bağlam dosyaları (.scout.md, AGENTS.md) yüklenmeden önce istem enjeksiyonuna karşı güvenlik taramasından geçer."
  t145: "config.yaml içindeki command_allowlist, belirli kabuk komutu desenlerini kalıcı olarak onaylar."
  t146: "Bağlam eşiğe ulaştığında otomatik sıkıştırılır — bellekler yazılır ve geçmiş özetlenir."
  t147: "Bağlam dolarken durum çubuğu önce sarıya, sonra turuncuya, sonra kırmızıya döner."
  t148: "SOUL.md ajanın birincil kimlik dosyasıdır — davranışı şekillendirmek için özelleştirin."
  t149: "Scout proje bağlamını .scout.md, AGENTS.md, CLAUDE.md veya .cursorrules dosyasından yükler (ilk eşleşen)."
  t150: "Alt dizinlerdeki AGENTS.md dosyaları, ajan klasörlere girdikçe aşamalı olarak keşfedilir."
  t151: "Bağlam dosyaları 20.000 karakterle sınırlıdır; akıllı baş/son kırpma uygulanır."
  t152: "Beş tarayıcı sağlayıcısı: yerel Chromium, Browserbase, Browser Use, Camofox ve Firecrawl."
  t153: "Camofox tespite karşı dayanıklı bir tarayıcıdır — C++ parmak izi gizleme özellikli bir Firefox çatalı."
  t154: "browser_navigate sayfa anlık görüntüsünü otomatik döndürür — ardından browser_snapshot çağırmanız gerekmez."
  t155: "annotate=true ile browser_vision, etkileşimli öğelerin üzerine numaralı etiketler yerleştirir."
  t156: "scout mcp, SpaceshipResearch onaylı MCP'leri tek tuşla kurabileceğiniz etkileşimli bir seçici açar."
  t157: "scout mcp catalog, depoyla birlikte gelen SpaceshipResearch onaylı MCP sunucularını listeler."
  t158: "scout mcp install <name>, bir katalog girdisini kurar, kimlik bilgilerini sorar ve hangi araçlarını etkinleştireceğinizi seçmenizi sağlar."
  t159: "MCP sunucuları config.yaml içinde yapılandırılır — hem stdio hem HTTP aktarımları desteklenir."
  t160: "Sunucu başına araç filtreleme: tools.include belirli araçları beyaz listeye, tools.exclude kara listeye alır."
  t161: "MCP sunucuları çalışma zamanında araç setlerini otomatik oluşturur — scout tools bunları platform bazında açıp kapatabilir."
  t162: "MCP OAuth desteği: auth: oauth, PKCE ile tarayıcı tabanlı yetkilendirmeyi etkinleştirir."
  t163: "Hiçbir dosya değiştirilmediğinde kontrol noktalarının ek yükü sıfırdır — varsayılan olarak etkindir."
  t164: "Geri almayı geri alabilmeniz için geri alma öncesi bir anlık görüntü otomatik kaydedilir."
  t165: "/rollback konuşma turunu da geri alır, böylece ajan geri alınan değişiklikleri hatırlamaz."
  t166: "Kontrol noktaları ~/.scout/checkpoints/ altında gölge depolar kullanır — projenizin .git dizinine hiç dokunulmaz."
  t167: "batch_runner.py, eğitim verisi üretimi için yüzlerce istemi paralel olarak işler."
  t168: "Yörünge kaydı (--save-trajectories), model eğitimi için tam araç kullanım izlerini yakalar."
  t169: "Üç eklenti türü: genel (araçlar/kancalar), bellek sağlayıcıları ve bağlam motorları."
  t170: "scout plugins install owner/repo, eklentileri doğrudan GitHub'dan kurar."
  t171: "Harici bellek sağlayıcıları: Honcho, OpenViking, Mem0 dahili gelir; Hindsight ve diğerleri scout plugins install ile kurulur."
  t172: "Eklenti kancaları arasında pre/post_tool_call, pre/post_llm_call ve çıktı normalleştirme için transform_terminal_output bulunur."
  t173: "İstem önbelleği (Anthropic), önbelleğe alınmış sistem istemi öneklerini yeniden kullanarak maliyetleri düşürür."
  t174: "Ajan oturum başlıklarını arka plan iş parçacığında otomatik oluşturur — gecikmeye sıfır etki."
  t175: "Akıllı model yönlendirme, basit sorguları otomatik olarak daha ucuz bir modele yönlendirebilir."
  t176: "Slash komutları önek eşleşmesini destekler: /h, /help'e; /mod, /model'e çözümlenir."
  t177: "Terminale bir dosya yolu sürüklemek görüntüleri otomatik ekler veya dosyayı bağlam olarak gönderir."
  t178: "Depo kökünüzdeki .worktreeinclude, worktree'lere kopyalanacak gitignore'lu dosyaları listeler."
  t179: "scout acp, VS Code, Zed ve JetBrains entegrasyonu için Scout'i bir ACP sunucusu olarak çalıştırır."
  t180: "Özel sağlayıcılar: adlandırılmış uç noktaları config.yaml içinde custom_providers altına kaydedin."
  t181: "SCOUT_EPHEMERAL_SYSTEM_PROMPT, geçmişe hiç kaydedilmeyen bir sistem istemi enjekte eder."
  t182: "credential_pool_strategies; fill_first, round_robin, least_used ve random rotasyonunu destekler."
  t183: "scout auth add anthropic veya scout auth add openai-codex, OAuth tabanlı sağlayıcıları kurar."
  t184: "API sunucusu, sunucu tarafı durumla hem Chat Completions hem Responses API'sini destekler."
  t185: "Yapılandırmada tool_preview_length: 0, dönen simgenin etkinlik akışında tam dosya yollarını gösterir."
  t186: "scout status --deep, tüm bileşenlerde daha derin tanılama denetimleri çalıştırır."
  t187: "Cron işlerine, stdout çıktısı isteme bağlam olarak enjekte edilen bir Python betiği (--script) eklenebilir."
  t188: "Cron betikleri ~/.scout/scripts/ altında bulunur ve ajandan önce çalışır — veri toplama hatları için idealdir."
  t189: "config.yaml içindeki prefill_messages_file, her API çağrısına few-shot örnekler enjekte eder; geçmişe hiç kaydedilmez."
  t190: "SOUL.md ajanın varsayılan kimliğini tamamen değiştirir — Scout'i kendinize ait kılmak için yeniden yazın."
  t191: "SOUL.md ilk çalıştırmada varsayılan bir kişilikle otomatik doldurulur. Özelleştirmek için düzenleyin."
  t192: "/compress <focus topic>, özet bütçesinin %60-70'ini konunuza ayırır ve geri kalanını agresif biçimde kısaltır."
  t193: "İkinci ve sonraki sıkıştırmalarda sıkıştırıcı sıfırdan başlamak yerine önceki özeti günceller."
  t194: "Gateway oturumu sıfırlanmadan önce Scout önemli bilgileri arka planda otomatik olarak belleğe yazar."
  t195: "config.yaml içinde network.force_ipv4: true, IPv6'sı bozuk sunuculardaki takılmaları giderir — socket'i monkey-patch eder."
  t196: "terminal aracı yaygın çıkış kodlarını açıklar: grep'in 1 döndürmesi = 'Eşleşme bulunamadı (hata değil)'."
  t197: "Başarısız ön plan terminal komutları üstel geri çekilmeyle (2 sn, 4 sn, 8 sn) en fazla 3 kez otomatik yeniden denenir."
  t198: "Yalın sudo komutları, .env'deki SUDO_PASSWORD'ü borulayacak şekilde otomatik yeniden yazılır — etkileşimli istem gerekmez."
  t199: "execute_code yardımcıları açık içe aktarma gerektirir: from scout_tools import json_parse, shell_quote, retry."
  t200: "execute_code'un 7 sandbox aracı (web_search, terminal, read/write/search/patch) RPC kullanır — asla bağlama girmez."
  t201: "Aynı dosya bölgesini 3+ kez okumak uyarı tetikler. 4+ kez okumada döngüleri önlemek için kesin olarak engellenir."
  t202: "write_file ve patch, dosyanın son okumadan sonra dışarıdan değiştirildiğini algılar ve bayatlık konusunda uyarır."
  t203: "V4A yama biçimi yalnızca Update değil, Add File, Delete File ve Move File yönergelerini de destekler."
  t204: "MCP sunucuları sampling üzerinden LLM tamamlamaları isteyebilir — ajan, sunucu için bir araca dönüşür."
  t205: "MCP sunucuları, yeniden başlatma gerektirmeden otomatik araç yeniden kaydını tetiklemek için notifications/tools/list_changed gönderir."
  t206: "acp_command: 'claude' ile delegate_task, herhangi bir platformdan Claude Code'u alt ajan olarak başlatır."
  t207: "Delegasyonun bir heartbeat iş parçacığı vardır — alt ajan etkinliği üst ajana aktarılır ve gateway zaman aşımları önlenir."
  t208: "Bir sağlayıcı HTTP 402 (ödeme gerekli) döndürdüğünde yardımcı istemci otomatik olarak bir sonrakine geçer."
  t209: "agent.tool_use_enforcement, araç çağırmak yerine eylemleri betimleyen modelleri yönlendirir — GPT/Codex için otomatik."
  t210: "agent.restart_after_turn_timeout, /restart stop() aşamasına girmeden önce süren turların bitmesine izin verir; restart_drain_timeout ise yalnızca stop() başladıktan sonraki zorla kesme bütçesidir."
  t211: "agent.api_max_retries (varsayılan 3), ajanın hatayı göstermeden önce başarısız bir API çağrısını kaç kez yeniden deneyeceğini belirler — hızlı yedeğe geçiş için düşürün."
  t212: "Gateway, AIAgent örneklerini oturum başına önbelleğe alır — bu önbelleği yok etmek Anthropic istem önbelleğini bozar."
  t213: "Herhangi bir web sitesi /.well-known/skills/index.json üzerinden skill yayımlayabilir — skill hub'ı bunları otomatik keşfeder."
  t214: "~/.scout/skills/.hub/audit.log konumundaki skill denetim günlüğü her kurma ve kaldırma işlemini kaydeder."
  t215: "Bayat git worktree'leri başlangıçta otomatik temizlenir: temiz, tamamen birleştirilmiş ağaçlar budanır; kirli veya push edilmemiş çalışmalar her zaman korunur."
  t216: "Profiller Scout durumunu SCOUT_HOME ile ayırır; terminal.home_mode profile olarak ayarlanmadıkça ana makine araç alt süreçleri gerçek HOME'unuzu korur."
  t217: "SCOUT_HOME_MODE ortam değişkeni (sekizlik, örn. 0701), web sunucusu erişimi için özel dizin izinleri belirler."
  t218: "Container modu: SCOUT_HOME içine .container-mode koyun; ana makine CLI'sı otomatik olarak container içine geçer."
  t219: "Ajan çalışması sırasındaki her kesme, zaman damgasıyla ~/.scout/interrupt_debug.log dosyasına kaydedilir."
  t220: "BROWSER_CDP_URL, tarayıcı araçlarını çalışan herhangi bir Chromium ailesi tarayıcıya bağlar — WebSocket, HTTP veya host:port kabul eder."
  t221: "BROWSERBASE_ADVANCED_STEALTH=true, özel Chromium ile gelişmiş tespit önlemeyi etkinleştirir (Scale Plan)."
  t222: "CLI, 80 sütundan dar terminallerde otomatik olarak kompakt moda geçer."
  t223: "Hızlı komutlar iki türü destekler: exec (kabuk komutunu doğrudan çalıştır) ve alias (başka bir komuta yönlendir)."
  t224: "Görev başına delegasyon modeli: yapılandırmadaki delegation.model ve delegation.provider, alt ajanları daha ucuz modellere yönlendirir."
  t225: "delegation.reasoning_effort, alt ajanların düşünme derinliğini bağımsız olarak denetler."
  t226: "Yapılandırmadaki human_delay.mode insan yazma hızını taklit eder — min_ms/max_ms aralığı ayarlanabilir."
  t227: "Yapılandırma sürüm geçişleri yüklemede otomatik çalışır — yeni yapılandırma anahtarları elle müdahale gerektirmeden görünür."
  t228: "GPT ve Codex modelleri, araç disiplini ve zorunlu araç kullanımı için özel sistem istemi yönlendirmesi alır."
  t229: "Gemini modelleri mutlak yollar, paralel araç çağrıları ve etkileşimsiz komutlar için özel yönergeler alır."
  t230: "config.yaml içindeki context.engine, alternatif bağlam yönetimi stratejileri için bir eklenti adına ayarlanabilir."
  t231: "15.000 karakteri aşan tarayıcı sayfa anlık görüntüleri kırpılır veya otomatik özetlenir; tam anlık görüntü read_file ile sayfalamak için cache/web altına kaydedilir."
  t232: "Sıkıştırıcı ucuz bir ön geçiş yapar: LLM çalışmadan önce 200 karakteri aşan araç çıktıları yer tutucularla değiştirilir."
  t233: "Sıkıştırma başarısız olduğunda API'yi yormamak için sonraki denemeler 10 dakika duraklatılır."
  t234: "Uzun tehlikeli komutlar (>70 karakter) için onay isteminde tam metni önce görmenizi sağlayan bir 'görüntüle' seçeneği bulunur."
  t235: "Ses düzeyi görselleştirmesi, sesli kayıt sırasında mikrofon RMS düzeylerine göre ▁▂▃▄▅▆▇ çubukları gösterir."
  t236: "Profil adları PATH'teki mevcut ikili dosyalarla çakışamaz — 'scout profile create ls' reddedilir."
  t237: "scout profile create backup --clone-all her şeyi kopyalar (yapılandırma, anahtarlar, SOUL.md, bellekler, skill'ler, oturumlar)."
  t238: ".cursorrules ve .cursor/rules/*.mdc dosyaları otomatik algılanır ve proje bağlamı olarak yüklenir."
  t239: "Bağlam dosyaları 10+ istem enjeksiyonu desenine karşı denetlenir — görünmez Unicode, 'talimatları yoksay', sızdırma girişimleri."
  t240: "GPT-5 ve Codex, mesaj biçiminde 'system' yerine 'developer' rolünü kullanır."
  t241: "Görev başına yardımcı geçersiz kılmalar: config.yaml içinde auxiliary.vision.provider, auxiliary.compression.model vb."
  t242: "Yardımcı istemci 'main' değerini bir sağlayıcı takma adı olarak ele alır — gerçek birincil sağlayıcınız + modelinize çözümlenir."
  t243: "scout claw migrate --dry-run, OpenClaw geçişini hiçbir şey yazmadan önizler."
  t244: "Tırnaklı veya kaçış boşluklu yapıştırılan dosya yolları otomatik işlenir — elle temizlik gerekmez."
  t245: "Slash komutları büyük yapıştırma daraltmasını asla tetiklemez — büyük argümanlı /command doğru çalışır."
  t246: "Kesme modunda, ajan çalışırken yazılan slash komutları kesme mantığını atlar ve hemen çalışır."
  t247: "SCOUT_DEV=1, yerel geliştirme için container modu algılamasını atlar."
  t248: "Her MCP sunucusu, scout tools ile bağımsız olarak açılıp kapatılabilen kendi araç setini (mcp-servername) alır."
  t249: "Yapılandırmadaki MCP ${ENV_VAR} yer tutucuları sunucu başlatılırken çözümlenir — ~/.scout/.env içindeki değişkenler dahil."
  t250: "Güvenilir depolardan (SpaceshipResearch) gelen skill'ler 'trusted' güvenlik düzeyi alır; topluluk skill'leri ek taramadan geçer."
  t251: "~/.scout/skills/.hub/quarantine/ konumundaki skill karantinası, güvenlik incelemesi bekleyen skill'leri tutar."
  t252: "/steer <prompt>, bir sonraki araç çağrısından sonra bir not enjekte eder — görev ortasında kesmeden yön verin."
  t253: "/goal <text>, kalıcı bir Ralph döngüsü hedefi belirler — bir hakem tamamlandı deyinceye dek Scout tur tur otomatik devam eder."
  t254: "/snapshot create [label], Scout yapılandırmasının tam durum anlık görüntüsünü kaydeder; /snapshot restore <id> daha sonra geri döndürür."
  t255: "/copy [N], son asistan yanıtını panonuza kopyalar; sayı verilirse sondan N'inci yanıtı kopyalar."
  t256: "/redraw tam bir arayüz yenilemesi zorlar; tmux yeniden boyutlandırması veya fare seçimi kalıntılarından sonraki terminal kaymalarını düzeltir."
  t257: "/agents (takma adı /tasks), geçerli oturumdaki aktif ajanları ve çalışan arka plan görevlerini gösterir."
  t258: "/footer, son yanıtlarda model, bağlam yüzdesi ve cwd gösteren gateway alt bilgisini açar/kapatır."
  t259: "/busy queue|steer|interrupt, Scout çalışırken Enter'a basmanın ne yapacağını belirler."
  t260: "/approve session|always, bekleyen tehlikeli komutu seçtiğiniz güven kapsamıyla çalıştırır; /deny reddeder."
  t261: "/restart, aktif çalışmaları tamamlayıp gateway'i düzgün biçimde yeniden başlatır, ardından geri geldiğinde isteyeni bilgilendirir."
  t262: "/kanban boards switch <slug>, aktif çok projeli Kanban panosunu sohbet içinden değiştirir."
  t263: "/reload, ~/.scout/.env dosyasını çalışan oturuma yeniden yükler — yeniden başlatmadan yeni API anahtarlarını alın."
  t264: "no_agent=True ile cronjob, bir betiği zamanlanmış olarak çalıştırır ve stdout çıktısını doğrudan gönderir — sıfır token, sıfır LLM."
  t265: "Boş cron betiği stdout çıktısı sessiz tik demektir — hiçbir şey teslim edilmez; eşik bekçileri için idealdir."
  t266: "SCOUT_CRON_MAX_PARALLEL (varsayılan 4), anahtarlarınızın ani yüklerle dolmaması için tik başına çalışan cron işi sayısını sınırlar."
  t267: "Gateway kancaları ~/.scout/hooks/<name>/ altında HOOK.yaml + handler.py ile bulunur — işleyici `handle` adında olmalıdır."
  t268: "Hook olayları arasında gateway:startup, session:start, agent:step ve command:* joker abonelikleri bulunur."
  t269: "~/.scout/BOOT.md dosyasına bir kontrol listesi koyun; gateway:startup hook'u her açılışta onu tek seferlik bir ajan olarak çalıştırır."
  t270: "scout curator run --dry-run, curator'ın neleri arşivleyeceğini veya birleştireceğini hiçbir şeyi değiştirmeden önizler."
  t271: "scout curator pin <skill>, bir skill'i hem otomatik arşivlemeye hem de ajanın skill_manage aracına karşı sıkı biçimde korur."
  t272: "scout curator rollback, skill'leri çalıştırma öncesi anlık görüntüden geri yükler — yedekler skills/.curator_backups/ altında durur."
  t273: "scout auth reset <provider> [target], bekleme sürelerini ve tükenme işaretlerini tüm kimlik bilgisi havuzunda ya da dizin, id veya etikete göre tek bir kimlik bilgisinde temizler."
  t274: "credential_pool_strategies.<provider>: round_robin, varsayılan fill_first yerine anahtarları eşit biçimde sırayla kullanır."
  t275: "scout tools her araç için bir sağlayıcı seçer — web araması, görseller, TTS ve tarayıcı — her biri kendi API anahtarınızla."
  t276: "provider_routing.data_collection: deny, OpenRouter'da veri saklayan sağlayıcıları dışarıda bırakır."
  t277: "provider_routing.require_parameters: true, yalnızca isteğinizdeki her parametreyi destekleyen sağlayıcılara yönlendirir."
  t278: "scout dashboard, 127.0.0.1:9119 adresinde yerel bir web arayüzü başlatır — localhost dışına hiçbir veri çıkmaz."
  t279: "~/.scout/dashboard-themes/ içine iki palet rengi içeren bir YAML koyarak tüm panelin görünümünü değiştirin."
  t280: "Panel eklentileri yerleştir-çalıştır mantığıyla çalışır: ~/.scout/dashboard-plugins/ içine manifest.json + JS paketi — npm derlemesi gerekmez."
  t281: "Panel temasında layoutVariant: cockpit, eklentilerin sidebar yuvası üzerinden doldurabileceği 260 piksellik bir sol şerit ekler."
  t282: "SCOUT_BACKGROUND_NOTIFICATIONS=result, yalnızca arka plan görevleri bitince bildirim gönderir (diğer seçenekler: concise/all/error/off)."
  t283: "SCOUT_WRITE_SAFE_ROOT, write_file/patch araçlarını belirli dizin öneklerine kısıtlar; birden çok yol os.pathsep (: veya ;) ile ayrılır."
  t284: "SCOUT_IGNORE_RULES, AGENTS.md, SOUL.md, .cursorrules, bellek ve önceden yüklenen skill'lerin otomatik eklenmesini atlar."
  t285: "SCOUT_ACCEPT_HOOKS, config.yaml içinde tanımlı ancak daha önce görülmemiş kabuk hook'larını TTY sorusu olmadan otomatik onaylar."
  t286: "auxiliary.goal_judge.model, /goal değerlendiricisini ucuz ve hızlı bir modele yönlendirerek döngü maliyetini sıfıra yakın tutar."
  t287: "Kontrol noktaları, devasa monorepo'larda yavaş git işlemlerini önlemek için 50.000'den fazla dosya içeren dizinleri atlar."
  t288: "tts.provider: piper, CPU üzerinde 44 dilli yerel TTS çalıştırır — sesler ~/.scout/cache/piper-voices/ dizinine otomatik indirilir."
  t289: "tts.providers.<name>.type: command, {input_path} ve {output_path} yer tutucularıyla herhangi bir CLI TTS motorunu bağlar."
  t290: "API_SERVER_ENABLED=true, Open WebUI ve LibreChat için gateway'in yanında OpenAI uyumlu bir uç nokta çalıştırır."
  t291: "batch_runner.py --resume, tamamlanan istemleri metne göre eşleştirir; böylece veri kümesi yeniden sıralansa bile biten işler tekrar çalışmaz."
  t292: "/new, yerinde yeni bir oturum başlatır (takma adı /reset) — yeni oturum kimliği, temiz geçmiş, CLI açık kalır."
  t293: "/clear, terminal ekranını siler VE yeni bir oturum başlatır — görsel sıfırlama için tek kısayol."
  t294: "/save, oturumu sonlandırmadan geçerli konuşmayı diske yazar."
  t295: "/status, oturum bilgilerini tek bakışta gösterir: kimlik, başlık, model, token kullanımı ve geçen süre."
  t296: "/image <path>, yapıştırma veya sürükle-bırak olmadan sonraki isteminize yerel bir görüntü dosyası ekler."
  t297: "/commands, tüm slash komutu + kurulu skill listesini sayfalar halinde gösterir — tab tamamlaması olmayan platformlarda işe yarar."
  t298: "/toolsets, -t/--toolsets seçeneğinin neleri kabul ettiğini bilmeniz için mevcut tüm araç setlerini listeler."
  t299: "/reload-skills, ~/.scout/skills/ dizinini yeniden tarar; böylece eklenen skill'ler oturumu yeniden başlatmadan görünür."
  t300: "/debug, bir destek paketi (sistem bilgisi + günlükler) yükler ve paylaşılabilir bağlantılar döndürür — sohbette de çalışır."
  t301: "scout dump --show-keys, daha derin destek hata ayıklaması için maskelenmiş API anahtarı parmak izlerini de içerir."
  t302: "scout sessions rename <ID> \"new title\" geçmiş herhangi bir oturumu yeniden adlandırır; scout sessions delete <ID> bir oturumu siler."
  t303: "scout import, tam bir Scout yedek zip'ini geri yükler; oturum JSON/JSONL dışa aktarımları panelin Oturumlar sayfasından içe aktarılır."
  t304: "scout fallback, fallback_model zincirini etkileşimli olarak yönetir — config.yaml'ı elle düzenlemek gerekmez."
  t305: "scout setup, ilk kez kullananları sağlayıcı, anahtarlar ve platform bağlantısı adımlarından tek bir etkileşimli akışta geçirir."
  t306: "scout status --deep, tüm bileşenlerde eksiksiz bir sağlık taraması yapar; sade scout status hızlı görünümdür."
  t307: "SCOUT_AGENT_TIMEOUT=0, çalışan bir ajan için gateway'in hareketsizlik nedeniyle sonlandırmasını kapatır — uzun araştırma çalıştırmalarında kullanın."
  t308: "SCOUT_ENABLE_PROJECT_PLUGINS=1, ./.scout/plugins/ içindeki depoya özel eklentileri otomatik yükler — tasarım gereği güven onayına bağlıdır."
  t309: "SCOUT_DISABLE_FILE_STATE_GUARD=1, patch ve write_file üzerindeki 'dosya okuduğunuzdan beri değişti' korumasını kapatır."
  t310: "SCOUT_ALLOW_PRIVATE_URLS=true, web araçlarının localhost'a ve özel ağlara erişmesine izin verir — gateway modunda varsayılan olarak kapalıdır."
  t311: "SCOUT_OPTIONAL_SKILLS=name1,name2, profil başına ilk çalıştırmada isteğe bağlı katalogdan ek skill'leri otomatik kurar."
  t312: "SCOUT_BUNDLED_SKILLS, özel bir paketlenmiş skill ağacını gösterir — Homebrew ve Nix paketlemesinde kullanılır."
  t313: "SCOUT_DUMP_REQUEST_STDOUT=1, her API isteğinin yükünü günlük dosyaları yerine stdout'a döker."
  t314: "SCOUT_OAUTH_TRACE=1, sağlayıcı kimlik doğrulamasında hata ayıklamak için maskelenmiş OAuth belirteç değişimi ve yenileme denemelerini günlüğe yazar."
  t315: "SCOUT_STREAM_RETRIES (varsayılan 3), geçici ağ hatalarında akış ortasında yeniden bağlanma denemelerinin sayısını belirler."
  t316: "SCOUT_GATEWAY_BUSY_ACK_ENABLED=false, bir kullanıcı meşgul bir ajana mesaj yazdığında gönderilen ⚡/⏳/⏩ onay mesajlarını susturur."
  t317: "SCOUT_AGENT_NOTIFY_INTERVAL (varsayılan 180s), uzun turlarda gateway'in ne sıklıkla ilerleme bildirimi göndereceğini ayarlar."
  t318: "SCOUT_RESTART_DRAIN_TIMEOUT (varsayılan 900s), /restart komutunun zorlamadan önce devam eden çalıştırmaları ne kadar bekleyeceğini sınırlar."
  t319: "SCOUT_CHECKPOINT_TIMEOUT (varsayılan 30s), dosya sistemi kontrol noktası oluşturma süresini sınırlar — devasa monorepo'larda yükseltin."
  t320: "config.yaml içindeki image_gen.model, FAL modelini seçer: flux-2/klein, gpt-image-2, nano-banana-pro ve daha fazlası."
  t321: "image_gen.provider, görüntü üretimini varsayılan yerine bir eklenti (OpenAI Images, Codex, FAL) üzerinden yönlendirir."
  t322: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY, görüntü analizini OpenAI uyumlu herhangi bir uç noktaya yönlendirir."
  t323: "security.tirith_fail_open: false, tirith tarayıcısının kendisi hata verdiğinde Scout'in komutları engellemesini sağlar."
  t324: "TIRITH_FAIL_OPEN ortam değişkeni, tirith_fail_open yapılandırmasını geçersiz kılar — config.yaml'ı düzenlemeden hızlı bir anahtar."
  t325: "Oturum kimlikleri zaman damgasıyla başlar (20250305_091523_abcd); böylece ls ve jq içinde sıralama doğal olarak çalışır."
  t326: "API_SERVER_MODEL_NAME, /v1/models üzerindeki model adını özelleştirir — çok profilli Open WebUI kurulumları için şarttır."
  t327: "Panel eklentileri /dashboard-plugins/<name>/ yolundan sunulur — dosyaları ~/.scout/dashboard-plugins/ içine koyun."
