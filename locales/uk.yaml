    fallback_prior_turn_content: "на цьому ході нового вмісту не створено; показано відновлений попередній контекст. Надішліть `continue`, щоб повторити."
    redirect_restart_limit_exceeded: "запит скасовувався новим виправленням на кожній спробі, тому хід зупинено замість нескінченних повторів. Ваше останнє виправлення поставлено в чергу як наступне повідомлення."
    rebuilt_restart_limit_exceeded: "кожен провайдер у ланцюжку резервування раз за разом перемикався далі, тому хід зупинено замість нескінченних повторів. Надішліть `continue` або змініть провайдера."
    budget_exhausted: "бюджет ітерацій/вартості на хід вичерпано до отримання остаточної відповіді. Надішліть `continue`, щоб продовжити."
    ollama_runtime_context_too_small: "контекстне вікно локальної моделі виявилося надто малим, щоб завершити. Збільште розмір контексту або скористайтеся більшою моделлю."
    pending_tool_result: "хід зупинився, коли результат інструмента ще очікувався, а модель не створила подальшого тексту. Надішліть `continue`, щоб вона підсумувала."
    interrupted_during_api_call: "запит було перервано посеред виклику, перш ніж надійшла відповідь. Надішліть `continue`, щоб повторити."
    max_iterations_reached: "досягнуто максимальну кількість ітерацій інструментів до отримання остаточної відповіді. Надішліть `continue`, щоб продовжити, або збільште `max_iterations`."
    error_near_max_iterations: "поблизу ліміту ітерацій сталася помилка до отримання остаточної відповіді. Перегляньте вивід інструмента вище, а потім надішліть `continue`."
    repeated_outer_errors: "хід раз за разом завершувався повторюваними помилками і був зупинений завчасно замість нескінченних повторів. Перегляньте помилки вище, а потім надішліть `continue`, щоб повторити."
  persistence:
    compression: "хід зупинено, бо інший процес стискав цей сеанс. Ваше повідомлення вже має бути збережене — надішліть його ще раз після завершення стиснення."
    compression_closed: "хід зупинено, бо цей сеанс було замінено новим через стиснення контексту, а його активне продовження не вдалося підхопити. Саме сховище справне — оновіть клієнт (або почніть новий хід), щоб він отримав новий ідентифікатор сеансу, і надішліть повідомлення ще раз."
    turn_lease: "хід зупинено, бо інший процес Scout перебрав цей сеанс. Вашу відповідь не збережено — дочекайтеся, поки інший процес завершить роботу, і надішліть повідомлення ще раз."
    session_row_missing: "цей сеанс було видалено зі сховища, поки чат ще був відкритий, і Scout не зміг відтворити його, тому це повідомлення не збережено. Надішліть повідомлення ще раз; якщо помилка повторюється, виконайте `scout {profile_arg}doctor`."
    locked: "хід зупинено, бо сховище сеансів було зайняте (інший процес Scout записував у базу даних стану). Ваше повідомлення вже має бути збережене — надішліть його ще раз за хвилину."
    replaced: "файл бази даних сеансів було замінено під час роботи Scout, тому це повідомлення не збережено (копія зберігається в {home}/sessions/). Зупиніть Scout (`scout {profile_arg}gateway stop`), виконайте `scout {profile_arg}doctor` — не `scout {profile_arg}doctor --fix`, який виправив би на місці не той файл — потім запустіть його знову й надішліть повідомлення ще раз. Додаткові кроки відновлення є в журналі."
    deleted_wal: "інший процес Scout досі тримає стару копію журналу випереджувального запису (WAL) бази даних сеансів, тому Scout припинив запис, щоб не пошкодити файл, і це повідомлення не збережено (копія зберігається в {home}/sessions/). Нічого не втрачено. Закрийте всі процеси Scout у цьому профілі (застосунок Desktop, `scout {profile_arg}gateway stop`, панель керування, cron), виконайте `scout {profile_arg}doctor` — він назве процес, який ще тримає журнал — потім знову запустіть Scout і надішліть повідомлення ще раз. Не запускайте `doctor --fix` і не видаляйте файли state.db, поки вони працюють. Посібник: {recovery_docs}"
    corrupt: "хід зупинено, бо база даних стану повідомила про структурне пошкодження (стенограму було б втрачено після перезапуску). Звільнення місця на диску не допоможе. Варіанти відновлення:\n1. Виконайте `scout {profile_arg}doctor --fix`\n2. Зупиніть шлюз, потім відновіть командами:\n   scout {profile_arg}sessions recover --source {db_path} --inspect-only\n   (якщо повідомляє, що відновлення можливе) scout {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — відновлення спочатку робить знімок пошкодженого файлу; НЕ запускайте `sqlite3 ... \".recover\"` проти робочого state.db — вразливий CLI sqlite3 може пошкодити його ще більше\n3. Відновіть із резервної копії в {backups_dir}/\nПотім надішліть повідомлення ще раз."
    fts_index: "хід зупинено, бо індекс пошуку сеансів (FTS5) пошкоджено і його не вдалося від'єднати, тому це повідомлення не збережено. Саме сховище повідомлень не пошкоджене: не запускайте інструменти відновлення й не відновлюйте резервну копію. Виконайте `scout {profile_arg}doctor --fix` (або перезапустіть Scout — він виправляє індекс під час відкриття), потім надішліть повідомлення ще раз."
    disk: "Scout не зміг зберегти цю розмову на диск, тому зупинився, щоб не втратити ваші повідомлення. Імовірно, диск переповнений: звільніть місце (або виправте права доступу до {home}/state.db), потім надішліть повідомлення ще раз."
    default: "Scout не зміг зберегти цю розмову, тому зупинився, щоб не втратити ваші повідомлення. Можливі причини: на диску закінчилося місце або інший процес Scout утримує базу даних. Закрийте інші вікна Scout, виконайте `scout {profile_arg}doctor`, щоб перевірити сховище, потім надішліть повідомлення ще раз."
  file_mutation:
    header: "⚠️ Перевірка змін файлів: {count} правок файлів НЕ ВДАЛОСЯ застосувати в цьому ході, попри будь-які формулювання вище, які можуть свідчити про інше. Виконайте `git status` або `read_file`, щоб перевірити, що насправді збереглося."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "не вдалося"
  shared:
    and_more: "  • … і ще {count}"
    the_model: "Модель"
tips:
  t001: "/bg <prompt> запускає завдання в окремому сеансі, а поточний залишається вільним; /btw <question> відповідає на побіжне питання про цю розмову, не перериваючи її."
  t002: "/branch розгалужує поточний сеанс, щоб ви могли дослідити інший напрямок, не втрачаючи прогресу."
  t003: "/compress вручну стискає контекст розмови, коли вона стає надто довгою."
  t004: "/rollback показує контрольні точки файлової системи — відновлюйте файли, які змінив агент, до будь-якого попереднього стану."
  t005: "/rollback diff 2 показує, що змінилося після контрольної точки 2, нічого не відновлюючи."
  t006: "/rollback 2 src/file.py відновлює один файл із певної контрольної точки."
  t007: "/title \"мій проєкт\" дає назву вашому сеансу — пізніше відновіть його через /resume або scout -c."
  t008: "/resume продовжує роботу з того місця, де ви зупинилися в раніше названому сеансі."
  t009: "/queue <prompt> ставить повідомлення в чергу на наступний хід, не перериваючи поточний."
  t010: "/undo видаляє з розмови останній обмін репліками (ваше повідомлення та відповідь асистента)."
  t011: "/retry повторно надсилає ваше останнє повідомлення — корисно, коли відповідь агента вийшла не зовсім вдалою."
  t012: "/verbose перемикає режим показу прогресу інструментів: off → new → all → verbose."
  t013: "/reasoning high збільшує глибину роздумів моделі. /reasoning show показує міркування."
  t014: "/fast перемикає пріоритетну обробку для швидших відповідей API (залежить від провайдера)."
  t015: "/yolo пропускає всі запити на схвалення небезпечних команд до кінця сеансу."
  t016: "/model дозволяє змінити модель посеред сеансу — спробуйте /model sonnet або /model gpt-5."
  t017: "/model --global назавжди змінює вашу модель за замовчуванням."
  t018: "/personality pirate вмикає веселу особистість — 14 вбудованих варіантів від kawaii до shakespeare."
  t019: "/tools disable browser тимчасово вилучає інструменти браузера з поточного сеансу."
  t020: "/browser connect під'єднує інструменти браузера до вашого запущеного браузера на основі Chromium через CDP."
  t021: "/plugins показує встановлені плагіни та їхній стан."
  t022: "/reload-mcp перезавантажує конфігурацію MCP-серверів на льоту, без перезапуску."
  t023: "/usage показує використання токенів, розбивку вартості та тривалість сеансу."
  t024: "/insights показує аналітику використання за останні 30 днів."
  t025: "/paste перевіряє, чи є в буфері обміну зображення, і прикріплює його до вашого наступного повідомлення."
  t026: "/profile показує, який профіль активний, і його домашній каталог."
  t027: "/config стисло показує вашу поточну конфігурацію."
  t028: "/stop зупиняє всі фонові процеси, запущені агентом."
  t029: "@file:path/to/file.py вставляє вміст файлу безпосередньо у ваше повідомлення."
  t030: "@file:main.py:10-50 вставляє лише рядки 10-50 файлу."
  t031: "@folder:src/ вставляє дерево каталогу."
  t032: "@diff вставляє в повідомлення ваші неіндексовані зміни git."
  t033: "@staged вставляє ваші індексовані зміни git (git diff --staged)."
  t034: "@git:5 вставляє останні 5 комітів із повними патчами."
  t035: "@url:https://example.com завантажує та вставляє вміст вебсторінки."
  t036: "Введення @ запускає автодоповнення шляхів файлової системи — інтерактивно перейдіть до будь-якого файлу."
  t037: "Поєднуйте кілька посилань: \"Перевір @file:main.py та @file:test.py на узгодженість.\""
  t038: "Введіть нове повідомлення, поки агент працює, щоб перервати його й скерувати в інший бік."
  t039: "Вставлення 5+ рядків автоматично зберігає їх у файл і замість них додає компактне посилання."
  t040: "scout -c відновлює ваш останній сеанс CLI. scout -c \"назва проєкту\" відновлює за назвою."
  t041: "scout -w створює ізольоване робоче дерево git (worktree) — ідеально для паралельних робочих процесів агентів."
  t042: "scout -p work chat запускається під певним профілем, не змінюючи ваш профіль за замовчуванням."
  t043: "scout doctor --fix діагностує та автоматично виправляє проблеми з конфігурацією й залежностями."
  t044: "scout dump виводить компактне зведення налаштувань — зручно для звітів про помилки."
  t045: "scout config set KEY VALUE автоматично зберігає секрети в .env, а все інше — у config.yaml."
  t046: "scout config edit відкриває config.yaml у вашому редакторі за замовчуванням."
  t047: "scout config check шукає відсутні або застарілі параметри конфігурації."
  t048: "scout sessions browse відкриває інтерактивний вибір сеансів із пошуком."
  t049: "scout sessions stats показує кількість сеансів за платформами та розмір бази даних."
  t050: "scout sessions prune --older-than 30 очищає старі сеанси."
  t051: "scout skills search react --source skills-sh шукає в публічному каталозі skills.sh."
  t052: "scout skills check перевіряє встановлені навички з хабу на наявність оновлень."
  t053: "scout skills tap add myorg/skills-repo додає власне джерело навичок на GitHub."
  t054: "scout skills snapshot export setup.json експортує вашу конфігурацію навичок для резервного копіювання або обміну."
  t055: "scout mcp add github --command npx додає MCP-сервери з командного рядка."
  t056: "scout mcp serve запускає сам Scout як MCP-сервер для інших агентів."
  t057: "scout auth add дозволяє додати кілька API-ключів для ротації пулу облікових даних."
  t058: "scout logs -f стежить за agent.log у реальному часі. --level WARNING --since 1h фільтрує вивід."
  t059: "scout backup створює zip-архів усього домашнього каталогу Scout."
  t060: "scout profile create coder створює ізольований профіль, який стає окремою командою."
  t061: "scout profile create work --clone копіює вашу поточну конфігурацію та ключі в новий профіль."
  t062: "scout update автоматично синхронізує нові вбудовані навички з УСІМА профілями."
  t063: "scout gateway install налаштовує Scout як системну службу (systemd/launchd)."
  t064: "scout memory setup дозволяє налаштувати зовнішнього провайдера пам'яті (Honcho, Mem0 тощо)."
  t065: "scout webhook subscribe створює керовані подіями маршрути вебхуків із перевіркою HMAC."
  t066: "Заощаджуйте: scout tools вимикає невикористовувані інструменти, scout skills config скорочує набір навичок."
  t067: "/reasoning low або /reasoning minimal зменшує глибину роздумів нижче стандартного рівня (medium) — швидші й дешевші відповіді."
  t068: "scout models спрямовує завдання зору, стиснення та допоміжні задачі на дешевші моделі — скорочує фонові витрати токенів на 85%+ без погіршення основної моделі чату."
  t069: "Установіть display.bell_on_complete: true у config.yaml, щоб чути сигнал після завершення довгих завдань."
  t070: "Установіть display.streaming: true, щоб бачити токени в реальному часі, поки модель їх генерує."
  t071: "Установіть display.show_reasoning: true, щоб спостерігати за ланцюжком міркувань моделі."
  t072: "Установіть display.compact: true, щоб зменшити порожній простір у виводі й ущільнити інформацію."
  t073: "Установіть display.busy_input_mode: queue, щоб ставити повідомлення в чергу замість переривання агента, або steer, щоб додавати їх під час роботи через /steer."
  t074: "Установіть display.resume_display: minimal, щоб пропускати повний переказ розмови під час відновлення сеансу."
  t075: "Установіть compression.threshold: 0.50, щоб керувати тим, коли спрацьовує автостиснення (за замовчуванням: 50% контексту)."
  t076: "Установіть agent.max_turns: 1000, щоб дозволити агенту робити більше кроків із викликами інструментів за хід."
  t077: "Установіть file_read_max_chars: 200000, щоб збільшити максимальний обсяг вмісту на один виклик read_file."
  t078: "Установіть approvals.mode: smart, щоб LLM автоматично схвалювала безпечні команди й відхиляла небезпечні."
  t079: "Установіть fallback_model у config.yaml, щоб автоматично перемикатися на резервного провайдера."
  t080: "Установіть privacy.redact_pii: true, щоб хешувати ідентифікатори користувачів і номери телефонів перед надсиланням до LLM."
  t081: "Установіть browser.record_sessions: true, щоб автоматично записувати сеанси браузера у відео WebM."
  t082: "Установіть worktree: true у config.yaml, щоб завжди створювати робоче дерево git (те саме, що scout -w)."
  t083: "Установіть security.website_blocklist.enabled: true, щоб заблокувати певні домени для вебінструментів."
  t084: "Установіть cron.wrap_response: false, щоб доставляти сирий вивід агента без заголовка й підпису cron."
  t085: "SCOUT_TIMEZONE перевизначає часовий пояс сервера будь-яким рядком часового поясу IANA."
  t086: "У config.yaml працює підстановка змінних середовища: використовуйте синтаксис ${VAR_NAME}."
  t087: "Швидкі команди в config.yaml миттєво виконують shell-команди без витрати токенів."
  t088: "Власні особистості можна визначити в config.yaml у розділі agent.personalities."
  t089: "provider_routing керує сортуванням провайдерів OpenRouter, їхніми білими та чорними списками."
  t090: "execute_code виконує Python-скрипти, які програмно викликають інструменти Scout — результати не потрапляють у контекст."
  t091: "delegate_task за замовчуванням запускає до 10 паралельних субагентів (delegation.max_concurrent_children) з ізольованими контекстами для паралельної роботи."
  t092: "web_extract працює з URL-адресами PDF — передайте будь-яке посилання на PDF, і воно перетвориться на markdown."
  t093: "search_files працює на основі ripgrep і швидший за grep — використовуйте його замість grep у терміналі."
  t094: "patch використовує 9 стратегій нечіткого зіставлення, тож незначні відмінності в пробілах не зламають правки."
  t095: "patch підтримує формат V4A для масових правок у кількох файлах одним викликом."
  t096: "read_file пропонує схожі назви файлів, якщо файл не знайдено."
  t097: "read_file автоматично усуває дублювання — повторне читання незміненого файлу повертає легку заглушку."
  t098: "browser_vision робить знімок екрана й аналізує його за допомогою ШІ — працює з CAPTCHA та візуальним вмістом."
  t099: "browser_console може обчислювати вирази JavaScript у контексті сторінки."
  t100: "image_generate створює зображення за допомогою FLUX 2 Pro з автоматичним збільшенням у 2 рази."
  t101: "Інструмент todo допомагає агенту відстежувати складні багатокрокові завдання впродовж сеансу."
  t102: "session_search виконує повнотекстовий пошук по ВСІХ минулих розмовах."
  t103: "Агент автоматично зберігає у пам'ять уподобання, виправлення та факти про середовище."
  t104: "/moa проганяє один складний запит через налаштований набір моделей Mixture of Agents."
  t105: "Команди терміналу підтримують фоновий режим із notify_on_complete для тривалих завдань."
  t106: "Фонові процеси терміналу підтримують watch_patterns для сповіщень про певні рядки виводу."
  t107: "Інструмент terminal підтримує 6 бекендів: local, Docker, SSH, Modal, Daytona та Singularity."
  t108: "Кожен профіль має власну конфігурацію, ключі API, пам'ять, сеанси, навички та cron-завдання."
  t109: "Назви профілів стають командами оболонки — 'scout profile create coder' створює команду 'coder'."
  t110: "scout profile export coder -o backup.tar.gz створює переносний архів профілю."
  t111: "Сеанси автоматично отримують описові назви після першого обміну — називати вручну не потрібно."
  t112: "Назви сеансів підтримують спадковість: \"мій проєкт\" → \"мій проєкт #2\" → \"мій проєкт #3\"."
  t113: "При виході Scout виводить команду для відновлення з ID сеансу та статистикою."
  t114: "scout sessions export backup.jsonl експортує всі сеанси для резервного копіювання чи аналізу."
  t115: "scout -r SESSION_ID відновлює будь-який конкретний минулий сеанс за його ID."
  t116: "Пам'ять — це заморожений знімок: зміни з'являються в системному промпті лише на початку наступного сеансу."
  t117: "Записи пам'яті автоматично скануються на шаблони ін'єкції промптів і витоку даних."
  t118: "Агент має два сховища пам'яті: особисті нотатки (~2200 символів) і профіль користувача (~1375 символів)."
  t119: "Виправлення, які ви даєте агенту (\"ні, зроби ось так\"), часто автоматично зберігаються в пам'ять."
  t120: "Понад 80 вбудованих навичок для github, creative, mlops, productivity, research та іншого."
  t121: "Кожна встановлена навичка автоматично стає slash-командою — введіть /, щоб побачити їх усі."
  t122: "scout skills install official/security/1password встановлює необов'язкові навички з репозиторію."
  t123: "Навички можуть обмежуватися певними ОС — деякі завантажуються лише на macOS або Linux."
  t124: "skills.external_dirs у config.yaml дозволяє завантажувати навички з власних каталогів."
  t125: "Агент може створювати власні навички як процедурну пам'ять за допомогою skill_manage."
  t126: "/plan записує план реалізації у markdown до .scout/plans/, нічого не виконуючи."
  t127: "До cron-завдань можна прикріплювати навички: scout cron add --skill blogwatcher \"Check for new posts\"."
  t128: "Якщо відповідь cron починається з [SILENT], доставка пригнічується — зручно для завдань лише з моніторингом."
  t129: "Cron підтримує відносні затримки (30m), інтервали (every 2h), cron-вирази та часові мітки ISO."
  t130: "Cron-завдання виконуються в повністю нових сеансах агента — запити мають бути самодостатніми."
  t131: "Голосовий режим працює без жодного ключа API, якщо встановлено faster-whisper (безкоштовне локальне розпізнавання мовлення)."
  t132: "Доступно п'ять TTS-провайдерів: Edge TTS (безкоштовно), ElevenLabs, OpenAI, NeuTTS (безкоштовно, локально), MiniMax."
  t133: "Потокове TTS озвучує речення в міру їх генерації — не потрібно чекати повної відповіді."
  t134: "scout gateway install налаштовує його як системну службу, що запускається під час завантаження."
  t135: "Маршрути вебхуків підтримують перевірку HMAC, обмеження частоти запитів і фільтрацію подій."
  t136: "API-сервер надає OpenAI-сумісний ендпоінт, який працює з Open WebUI та LibreChat."
  t137: "group_sessions_per_user: true дає кожній людині власний сеанс у групових чатах."
  t138: "Шлюз підтримує тайм-аути за бездіяльністю — активні агенти можуть працювати як завгодно довго."
  t139: "Схвалення небезпечних команд має 4 рівні: один раз, сеанс, завжди (постійний список дозволених), відхилити."
  t140: "Розумний режим схвалення використовує LLM, щоб автоматично схвалювати безпечні команди й позначати небезпечні."
  t141: "Захист від SSRF блокує приватні мережі, loopback, link-local та адреси метаданих хмарних провайдерів."
  t142: "Передвиконавче сканування Tirith виявляє підміну URL через омогліфи та шаблони pipe-to-interpreter."
  t143: "Підпроцеси MCP отримують відфільтроване середовище — передаються лише безпечні системні змінні."
  t144: "Контекстні файли (.scout.md, AGENTS.md) перед завантаженням скануються на ін'єкції промптів."
  t145: "command_allowlist у config.yaml назавжди схвалює певні шаблони shell-команд."
  t146: "Контекст автоматично стискається при досягненні порогу — пам'ять скидається на диск, а історія підсумовується."
  t147: "Рядок стану стає жовтим, потім оранжевим, потім червоним у міру заповнення контексту."
  t148: "SOUL.md — головний файл ідентичності агента; налаштуйте його, щоб сформувати поведінку."
  t149: "Scout завантажує контекст проєкту з .scout.md, AGENTS.md, CLAUDE.md або .cursorrules (перший знайдений)."
  t150: "Файли AGENTS.md у підкаталогах виявляються поступово, коли агент заходить у папки."
  t151: "Контекстні файли обмежені 20 000 символами з розумним обрізанням посередині (початок і кінець зберігаються)."
  t152: "П'ять провайдерів браузера: локальний Chromium, Browserbase, Browser Use, Camofox і Firecrawl."
  t153: "Camofox — браузер із захистом від виявлення: форк Firefox із підміною відбитків на C++."
  t154: "browser_navigate автоматично повертає знімок сторінки — викликати browser_snapshot після нього не потрібно."
  t155: "browser_vision з annotate=true накладає нумеровані мітки на інтерактивні елементи."
  t156: "scout mcp відкриває інтерактивний вибір схвалених SpaceshipResearch MCP-серверів, які можна встановити одним натисканням."
  t157: "scout mcp catalog показує список схвалених SpaceshipResearch MCP-серверів, що постачаються з репозиторієм."
  t158: "scout mcp install <name> встановлює запис із каталогу, запитує облікові дані та дозволяє вибрати, які з його інструментів увімкнути."
  t159: "MCP-сервери налаштовуються в config.yaml — підтримуються транспорти stdio та HTTP."
  t160: "Фільтрація інструментів для кожного сервера: tools.include дозволяє, а tools.exclude забороняє конкретні інструменти."
  t161: "MCP-сервери автоматично створюють набори інструментів під час роботи — scout tools може перемикати їх для кожної платформи."
  t162: "Підтримка OAuth для MCP: auth: oauth вмикає авторизацію через браузер із PKCE."
  t163: "Контрольні точки не створюють жодних накладних витрат, якщо файли не змінюються — увімкнено за замовчуванням."
  t164: "Знімок перед відкатом зберігається автоматично, тож ви можете скасувати саме скасування."
  t165: "/rollback також скасовує хід розмови, тому агент не пам'ятає відкочених змін."
  t166: "Контрольні точки використовують тіньові репозиторії в ~/.scout/checkpoints/ — .git вашого проєкту ніколи не зачіпається."
  t167: "batch_runner.py паралельно обробляє сотні запитів для генерації навчальних даних."
  t168: "Збереження траєкторій (--save-trajectories) фіксує повні сліди використання інструментів для навчання моделей."
  t169: "Три типи плагінів: загальні (інструменти та хуки), провайдери пам'яті та контекстні рушії."
  t170: "scout plugins install owner/repo встановлює плагіни безпосередньо з GitHub."
  t171: "Зовнішні провайдери пам'яті: Honcho, OpenViking, Mem0 вбудовані; Hindsight та інші — через scout plugins install."
  t172: "Хуки плагінів включають pre/post_tool_call, pre/post_llm_call і transform_terminal_output для канонізації виводу."
  t173: "Кешування промптів (Anthropic) знижує витрати, повторно використовуючи кешовані префікси системного промпту."
  t174: "Агент генерує назви сеансів у фоновому потоці — без жодного впливу на затримку."
  t175: "Розумна маршрутизація моделей може автоматично скеровувати прості запити до дешевшої моделі."
  t176: "Slash-команди підтримують збіг за префіксом: /h розгортається в /help, /mod — у /model."
  t177: "Перетягування шляху до файлу в термінал автоматично прикріплює зображення або надсилає його як контекст."
  t178: ".worktreeinclude у корені репозиторію перелічує ігноровані git файли, які копіювати в робочі дерева."
  t179: "scout acp запускає Scout як ACP-сервер для інтеграції з VS Code, Zed і JetBrains."
  t180: "Власні провайдери: зберігайте іменовані ендпоінти в config.yaml у розділі custom_providers."
  t181: "SCOUT_EPHEMERAL_SYSTEM_PROMPT вставляє системний промпт, який ніколи не зберігається в історії."
  t182: "credential_pool_strategies підтримує ротацію fill_first, round_robin, least_used і random."
  t183: "scout auth add anthropic або scout auth add openai-codex налаштовує провайдерів на основі OAuth."
  t184: "API-сервер підтримує як Chat Completions, так і Responses API зі станом на боці сервера."
  t185: "tool_preview_length: 0 у конфігурації показує повні шляхи до файлів у стрічці активності індикатора."
  t186: "scout status --deep виконує глибші діагностичні перевірки всіх компонентів."
  t187: "До cron-завдань можна прикріпити Python-скрипт (--script), чий stdout вставляється в запит як контекст."
  t188: "Cron-скрипти зберігаються в ~/.scout/scripts/ і виконуються перед агентом — ідеально для конвеєрів збору даних."
  t189: "prefill_messages_file у config.yaml додає few-shot приклади до кожного виклику API, не зберігаючи їх в історії."
  t190: "SOUL.md повністю замінює типову ідентичність агента — перепишіть його, щоб зробити Scout своїм."
  t191: "SOUL.md автоматично заповнюється типовою особистістю під час першого запуску. Відредагуйте його для налаштування."
  t192: "/compress <focus topic> виділяє 60–70% бюджету підсумку на вашу тему й агресивно скорочує решту."
  t193: "Під час другого й наступних стиснень компресор оновлює попередній підсумок, а не починає з нуля."
  t194: "Перед скиданням сеансу шлюзу Scout автоматично скидає важливі факти в пам'ять у фоновому режимі."
  t195: "network.force_ipv4: true у config.yaml усуває зависання на серверах зі зламаним IPv6 — патчить socket під час роботи."
  t196: "Інструмент terminal пояснює поширені коди виходу: grep повертає 1 = 'No matches found (not an error)'."
  t197: "Невдалі команди терміналу у передньому плані автоматично повторюються до 3 разів з експоненційною затримкою (2с, 4с, 8с)."
  t198: "Команди з голим sudo автоматично переписуються так, щоб передавати SUDO_PASSWORD з .env — інтерактивний запит не потрібен."
  t199: "Помічники execute_code потребують явного імпорту: from scout_tools import json_parse, shell_quote, retry."
  t200: "7 інструментів пісочниці execute_code (web_search, terminal, read/write/search/patch) працюють через RPC — ніколи не потрапляють у контекст."
  t201: "Читання тієї самої ділянки файлу 3+ рази викликає попередження. Після 4+ воно жорстко блокується, щоб запобігти циклам."
  t202: "write_file і patch виявляють, чи файл був змінений зовні після останнього читання, і попереджають про застарілість."
  t203: "Формат патчів V4A підтримує директиви Add File, Delete File і Move File — не лише Update."
  t204: "MCP-сервери можуть запитувати відповіді LLM у зворотному напрямку через sampling — агент стає інструментом для сервера."
  t205: "MCP-сервери надсилають notifications/tools/list_changed, щоб автоматично перереєструвати інструменти без перезапуску."
  t206: "delegate_task з acp_command: 'claude' запускає Claude Code як дочірнього агента з будь-якої платформи."
  t207: "Делегування має потік heartbeat — активність дочірнього агента передається батьківському, що запобігає тайм-аутам шлюзу."
  t208: "Коли провайдер повертає HTTP 402 (payment required), допоміжний клієнт автоматично переходить до наступного."
  t209: "agent.tool_use_enforcement скеровує моделі, які описують дії замість викликати інструменти — автоматично для GPT/Codex."
  t210: "agent.restart_after_turn_timeout дає поточним ходам завершитися, перш ніж /restart перейде до stop(); restart_drain_timeout — лише бюджет примусового переривання після початку stop()."
  t211: "agent.api_max_retries (за замовчуванням 3) визначає, скільки разів агент повторює невдалий виклик API, перш ніж показати помилку — зменште для швидкого перемикання."
  t212: "Шлюз кешує екземпляри AIAgent для кожного сеансу — знищення цього кешу ламає кешування промптів Anthropic."
  t213: "Будь-який сайт може публікувати навички через /.well-known/skills/index.json — хаб навичок знаходить їх автоматично."
  t214: "Журнал аудиту навичок у ~/.scout/skills/.hub/audit.log фіксує кожне встановлення та видалення."
  t215: "Застарілі робочі дерева git автоматично прибираються під час запуску: чисті, повністю злиті дерева видаляються; незбережена або невідправлена робота завжди зберігається."
  t216: "Профілі ізолюють стан Scout через SCOUT_HOME; підпроцеси інструментів хоста зберігають ваш справжній HOME, якщо terminal.home_mode не дорівнює profile."
  t217: "Змінна середовища SCOUT_HOME_MODE (вісімкова, напр. 0701) задає власні права доступу до каталогу для обходу вебсервером."
  t218: "Контейнерний режим: покладіть .container-mode у SCOUT_HOME — і CLI хоста автоматично виконуватиметься всередині контейнера."
  t219: "Кожне переривання під час роботи агента записується в ~/.scout/interrupt_debug.log з мітками часу."
  t220: "BROWSER_CDP_URL підключає браузерні інструменти до будь-якого запущеного браузера сімейства Chromium — приймає WebSocket, HTTP або host:port."
  t221: "BROWSERBASE_ADVANCED_STEALTH=true вмикає розширений захист від виявлення з кастомним Chromium (план Scale)."
  t222: "CLI автоматично переходить у компактний режим у терміналах, вужчих за 80 стовпців."
  t223: "Швидкі команди бувають двох типів: exec (виконати shell-команду напряму) та alias (перенаправити на іншу команду)."
  t224: "Окрема модель для делегування: delegation.model і delegation.provider у конфігурації спрямовують субагентів на дешевші моделі."
  t225: "delegation.reasoning_effort незалежно керує глибиною роздумів субагентів."
  t226: "human_delay.mode у конфігурації імітує швидкість людського набору — діапазон min_ms/max_ms налаштовується."
  t227: "Міграції версій конфігурації виконуються автоматично під час завантаження — нові ключі з'являються без ручного втручання."
  t228: "Моделі GPT і Codex отримують спеціальні вказівки в системному промпті щодо дисципліни інструментів та обов'язкового їх використання."
  t229: "Моделі Gemini отримують окремі директиви щодо абсолютних шляхів, паралельних викликів інструментів і неінтерактивних команд."
  t230: "context.engine у config.yaml можна встановити в назву плагіна для альтернативних стратегій керування контекстом."
  t231: "Знімки сторінок браузера понад 15 000 символів обрізаються або автоматично підсумовуються; повний знімок зберігається в cache/web для посторінкового читання через read_file."
  t232: "Стискач робить дешевий попередній прохід: виводи інструментів понад 200 символів замінюються заповнювачами ще до запуску LLM."
  t233: "Якщо стиснення не вдалося, подальші спроби призупиняються на 10 хвилин, щоб не перевантажувати API."
  t234: "Довгі небезпечні команди (>70 символів) отримують у запиті схвалення опцію 'view', щоб спершу переглянути повний текст."
  t235: "Візуалізація рівня звуку показує стовпчики ▁▂▃▄▅▆▇ під час голосового запису на основі RMS-рівнів мікрофона."
  t236: "Назви профілів не можуть збігатися з наявними бінарними файлами в PATH — 'scout profile create ls' буде відхилено."
  t237: "scout profile create backup --clone-all копіює все (конфігурацію, ключі, SOUL.md, спогади, навички, сеанси)."
  t238: "Файли .cursorrules і .cursor/rules/*.mdc виявляються автоматично й завантажуються як контекст проєкту."
  t239: "Контекстні файли перевіряються на 10+ шаблонів ін'єкції промптів — невидимий Unicode, 'ignore instructions', спроби ексфільтрації."
  t240: "GPT-5 і Codex використовують у форматі повідомлень роль 'developer' замість 'system'."
  t241: "Окремі допоміжні перевизначення для кожного завдання: auxiliary.vision.provider, auxiliary.compression.model тощо у config.yaml."
  t242: "Допоміжний клієнт трактує 'main' як псевдонім провайдера — він розгортається у ваші справжні основні провайдера та модель."
  t243: "scout claw migrate --dry-run показує попередній перегляд міграції з OpenClaw, нічого не записуючи."
  t244: "Шляхи до файлів, вставлені з лапками або екранованими пробілами, обробляються автоматично — чистити вручну не потрібно."
  t245: "Слеш-команди ніколи не спричиняють згортання великої вставки — /command з великими аргументами працює коректно."
  t246: "У режимі переривання слеш-команди, введені під час роботи агента, оминають логіку переривання й виконуються негайно."
  t247: "SCOUT_DEV=1 вимикає виявлення контейнерного режиму для локальної розробки."
  t248: "Кожен MCP-сервер отримує власний набір інструментів (mcp-servername), який можна вмикати й вимикати окремо через scout tools."
  t249: "Заповнювачі MCP ${ENV_VAR} у конфігурації розгортаються під час запуску сервера — зокрема змінні з ~/.scout/.env."
  t250: "Навички з довірених репозиторіїв (SpaceshipResearch) отримують рівень безпеки 'trusted'; навички спільноти проходять додаткове сканування."
  t251: "Карантин навичок у ~/.scout/skills/.hub/quarantine/ зберігає навички, що очікують перевірки безпеки."
  t252: "/steer <prompt> вставляє нотатку після наступного виклику інструмента — скеруйте напрямок посеред завдання, не перериваючи його."
  t253: "/goal <text> задає постійну ціль у стилі Ralph-циклу — Scout автоматично продовжує хід за ходом, доки суддя не визнає її виконаною."
  t254: "/snapshot create [label] зберігає повний знімок стану конфігурації Scout; /snapshot restore <id> пізніше відкочує до нього."
  t255: "/copy [N] копіює останню відповідь асистента в буфер обміну або N-ту з кінця, якщо вказати число."
  t256: "/redraw примусово перемальовує весь інтерфейс, усуваючи зсуви термінала після зміни розміру в tmux або артефактів виділення мишею."
  t257: "/agents (псевдонім /tasks) показує активних агентів і запущені фонові завдання в поточному сеансі."
  t258: "/footer вмикає й вимикає нижній колонтитул шлюзу у фінальних відповідях із моделлю, % контексту та cwd."
  t259: "/busy queue|steer|interrupt визначає, що робить натискання Enter, поки Scout працює."
  t260: "/approve session|always виконує очікувану небезпечну команду з вибраним вами обсягом довіри; /deny відхиляє її."
  t261: "/restart плавно перезапускає шлюз, дочекавшись завершення активних запусків, а потім повідомляє того, хто його запросив, коли все знову працює."
  t262: "/kanban boards switch <slug> змінює активну дошку Kanban серед кількох проєктів прямо з чату."
  t263: "/reload перечитує ~/.scout/.env у запущений сеанс — підхопіть нові API-ключі без перезапуску."
  t264: "cronjob із no_agent=True запускає скрипт за розкладом і надсилає його stdout напряму — нуль токенів, нуль LLM."
  t265: "Порожній stdout cron-скрипта означає тихий тік — нічого не доставляється, ідеально для сторожових перевірок порогів."
  t266: "SCOUT_CRON_MAX_PARALLEL (типово 4) обмежує кількість cron-завдань за один тік, щоб сплески не вичерпували ваші ключі."
  t267: "Хуки шлюзу лежать у ~/.scout/hooks/<name>/ з HOOK.yaml + handler.py — обробник має називатися `handle`."
  t268: "Події хуків включають gateway:startup, session:start, agent:step і підписки за шаблоном command:*."
  t269: "Покладіть чекліст у ~/.scout/BOOT.md — і хук gateway:startup виконуватиме його як одноразового агента під час кожного завантаження."
  t270: "scout curator run --dry-run показує, що куратор архівував би чи об'єднав, нічого не змінюючи."
  t271: "scout curator pin <skill> жорстко захищає навичку і від автоархівації, і від інструмента skill_manage агента."
  t272: "scout curator rollback відновлює навички зі знімка, зробленого перед запуском — резервні копії лежать у skills/.curator_backups/."
  t273: "scout auth reset <provider> [target] скидає паузи та позначки вичерпання для всього пулу облікових даних або для одного запису за індексом, id чи міткою."
  t274: "credential_pool_strategies.<provider>: round_robin рівномірно чергує ключі замість типового fill_first."
  t275: "scout tools обирає провайдера для кожного інструмента — вебпошук, зображення, TTS і браузер — кожен із вашим власним ключем API."
  t276: "provider_routing.data_collection: deny виключає провайдерів OpenRouter, які зберігають дані."
  t277: "provider_routing.require_parameters: true маршрутизує лише до провайдерів, що підтримують кожен параметр вашого запиту."
  t278: "scout dashboard запускає локальний вебінтерфейс на 127.0.0.1:9119 — жодні дані не залишають localhost."
  t279: "Покладіть YAML із двома кольорами палітри в ~/.scout/dashboard-themes/, щоб повністю змінити вигляд панелі керування."
  t280: "Плагіни панелі керування підключаються простим копіюванням: manifest.json + JS-бандл у ~/.scout/dashboard-plugins/ — збірка npm не потрібна."
  t281: "layoutVariant: cockpit у темі панелі керування додає ліву панель шириною 260px, яку плагіни можуть заповнювати через слот sidebar."
  t282: "SCOUT_BACKGROUND_NOTIFICATIONS=result сповіщає лише про завершення фонових завдань (на відміну від concise/all/error/off)."
  t283: "SCOUT_WRITE_SAFE_ROOT обмежує write_file/patch префіксами каталогів; кілька шляхів розділяються через os.pathsep (: або ;)."
  t284: "SCOUT_IGNORE_RULES пропускає автоматичне підключення AGENTS.md, SOUL.md, .cursorrules, пам'яті та попередньо завантажених навичок."
  t285: "SCOUT_ACCEPT_HOOKS автоматично схвалює ще не бачені shell-хуки, оголошені в config.yaml, без запиту в TTY."
  t286: "auxiliary.goal_judge.model спрямовує суддю /goal на дешеву швидку модель, щоб вартість циклу була майже нульовою."
  t287: "Контрольні точки пропускають каталоги з понад 50 000 файлів, щоб уникнути повільних операцій git на величезних монорепозиторіях."
  t288: "tts.provider: piper запускає локальний TTS на CPU для 44 мов — голоси автоматично завантажуються в ~/.scout/cache/piper-voices/."
  t289: "tts.providers.<name>.type: command підключає будь-який TTS-рушій із CLI через заповнювачі {input_path} і {output_path}."
  t290: "API_SERVER_ENABLED=true запускає поруч зі шлюзом OpenAI-сумісний ендпоінт для Open WebUI та LibreChat."
  t291: "batch_runner.py --resume зіставляє виконані запити за текстом, тож перестановки в наборі даних не запускають готову роботу повторно."
  t292: "/new починає новий сеанс на місці (псевдонім /reset) — новий ID сеансу, чиста історія, CLI залишається відкритим."
  t293: "/clear очищає екран термінала І починає новий сеанс — одна команда для візуального скидання."
  t294: "/save записує поточну розмову на диск, не завершуючи сеанс."
  t295: "/status показує зведення про сеанс: ID, назву, модель, використання токенів і час, що минув."
  t296: "/image <path> прикріплює локальний файл зображення до вашого наступного запиту без вставляння чи перетягування."
  t297: "/commands виводить посторінково повний список слеш-команд і встановлених навичок — зручно на платформах без автодоповнення по Tab."
  t298: "/toolsets перелічує всі доступні набори інструментів, щоб ви знали, що приймає -t/--toolsets."
  t299: "/reload-skills повторно сканує ~/.scout/skills/, тож скопійовані туди навички з'являються без перезапуску сеансу."
  t300: "/debug завантажує пакет для підтримки (інформація про систему + журнали) і повертає посилання для поширення — працює і в чаті."
  t301: "scout dump --show-keys додає знеособлені відбитки API-ключів для глибшого налагодження з підтримкою."
  t302: "scout sessions rename <ID> \"new title\" перейменовує будь-який минулий сеанс; scout sessions delete <ID> видаляє один."
  t303: "scout import відновлює повну резервну копію Scout із zip; експорти сеансів у JSON/JSONL імпортуються зі сторінки Sessions панелі керування."
  t304: "scout fallback інтерактивно керує ланцюжком fallback_model — без ручного редагування config.yaml."
  t305: "scout setup проводить нових користувачів через налаштування провайдера, ключів і платформ в одному інтерактивному сценарії."
  t306: "scout status --deep виконує повну перевірку стану всіх компонентів; звичайний scout status — швидкий огляд."
  t307: "SCOUT_AGENT_TIMEOUT=0 вимикає зупинку запущеного агента шлюзом через бездіяльність — для довгих дослідницьких запусків."
  t308: "SCOUT_ENABLE_PROJECT_PLUGINS=1 автоматично завантажує локальні плагіни репозиторію з ./.scout/plugins/ — з обов'язковою перевіркою довіри."
  t309: "SCOUT_DISABLE_FILE_STATE_GUARD=1 вимикає захист «файл змінився після прочитання» для patch і write_file."
  t310: "SCOUT_ALLOW_PRIVATE_URLS=true дозволяє вебінструментам звертатися до localhost і приватних мереж — у режимі шлюзу типово вимкнено."
  t311: "SCOUT_OPTIONAL_SKILLS=name1,name2 автоматично встановлює додаткові навички з необов'язкового каталогу під час першого запуску кожного профілю."
  t312: "SCOUT_BUNDLED_SKILLS вказує на власне дерево вбудованих навичок — використовується пакуванням Homebrew і Nix."
  t313: "SCOUT_DUMP_REQUEST_STDOUT=1 виводить корисне навантаження кожного API-запиту в stdout замість файлів журналу."
  t314: "SCOUT_OAUTH_TRACE=1 записує в журнал (зі знеособленням) обмін OAuth-токенами та спроби оновлення — для налагодження автентифікації провайдера."
  t315: "SCOUT_STREAM_RETRIES (типово 3) задає кількість спроб перепідключення посеред потоку при тимчасових мережевих помилках."
  t316: "SCOUT_GATEWAY_BUSY_ACK_ENABLED=false вимикає підтвердження ⚡/⏳/⏩, коли користувач пише зайнятому агентові."
  t317: "SCOUT_AGENT_NOTIFY_INTERVAL (типово 180s) задає, як часто шлюз повідомляє про прогрес під час довгих ходів."
  t318: "SCOUT_RESTART_DRAIN_TIMEOUT (типово 900s) обмежує, скільки /restart чекає на завершення поточних запусків, перш ніж примусово перезапуститися."
  t319: "SCOUT_CHECKPOINT_TIMEOUT (типово 30s) обмежує час створення контрольної точки файлової системи — збільште його на величезних монорепозиторіях."
  t320: "image_gen.model у config.yaml обирає модель FAL: flux-2/klein, gpt-image-2, nano-banana-pro та інші."
  t321: "image_gen.provider спрямовує генерацію зображень через плагін (OpenAI Images, Codex, FAL) замість типового провайдера."
  t322: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY спрямовують аналіз зображень на будь-який OpenAI-сумісний ендпоінт."
  t323: "security.tirith_fail_open: false змушує Scout блокувати команди, коли сам сканер tirith завершується з помилкою."
  t324: "Змінна середовища TIRITH_FAIL_OPEN перевизначає налаштування tirith_fail_open — швидкий перемикач без редагування config.yaml."
  t325: "ID сеансів починаються з мітки часу (20250305_091523_abcd), тож у ls і jq вони природно сортуються."
  t326: "API_SERVER_MODEL_NAME задає назву моделі в /v1/models — необхідно для багатопрофільних конфігурацій Open WebUI."
  t327: "Плагіни панелі керування роздаються з /dashboard-plugins/<name>/ — просто покладіть файли в ~/.scout/dashboard-plugins/."
  placeholder:
