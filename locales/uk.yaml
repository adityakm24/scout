    p04: "Сплануй функцію, а потім реалізуй її крок за кроком"
    p05: "Знайди та виправ тест, що не проходить"
    p06: "Дослідь цю тему й напиши мені короткий огляд"
    p07: "Що нещодавно змінилося в цьому репозиторії?"
    p08: "Перетвори ці нотатки на список справ"
    p09: "Поясни цю помилку і як її виправити"
    p10: "Постав нагадування або заплануй повторюване завдання"
