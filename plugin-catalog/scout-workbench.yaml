description: The Scout desktop app in your browser. `scout workbench` serves the desktop interface through the Scout dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a SpaceshipResearch product. On the first `scout workbench` run and again after each Scout update it runs `npm install --ignore-scripts` (guided by Scout's lockfile) and Vite against your Scout checkout's desktop sources, writing only under ~/.scout/scout-workbench and its own plugin dir (the checkout is only read), and starts `scout dashboard` on loopback when none is running.
